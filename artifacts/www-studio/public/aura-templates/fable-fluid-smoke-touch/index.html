<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ether — Fluid Smoke Canvas</title>
<style>
  :root {
    --bg: #04050a;
    --ink: #e8e6f2;
    --ink-dim: rgba(232, 230, 242, 0.55);
    --glass: rgba(14, 16, 28, 0.55);
    --glass-edge: rgba(255, 255, 255, 0.10);
    --accent: #8ad4ff;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
    touch-action: none;
    image-rendering: auto;
  }

  /* vignette to deepen the edges */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode: multiply;
  }

  .brand {
    position: fixed;
    top: clamp(16px, 3vw, 40px);
    left: clamp(16px, 3vw, 40px);
    pointer-events: none;
    user-select: none;
    animation: rise 1.4s var(--ease) both;
  }
  .brand h1 {
    margin: 0;
    font-family: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", ui-serif, serif;
    font-weight: 400;
    font-size: clamp(34px, 5vw, 64px);
    letter-spacing: 0.14em;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #b7c4ff 60%, #6d7fd6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 18px rgba(138, 212, 255, 0.25));
  }
  .brand p {
    margin: 10px 0 0 2px;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: clamp(20px, 5vh, 56px);
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-dim);
    pointer-events: none;
    transition: opacity 1.2s ease;
    animation: breathe 3.2s ease-in-out infinite;
    white-space: nowrap;
  }
  .hint.hidden { opacity: 0; animation: none; }

  .hud {
    position: fixed;
    right: clamp(14px, 2.5vw, 32px);
    bottom: clamp(14px, 2.5vw, 32px);
    width: min(280px, calc(100vw - 28px));
    padding: 18px 18px 16px;
    border-radius: 18px;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    animation: rise 1.4s 0.25s var(--ease) both;
  }
  .hud header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .hud header span {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .hud header b {
    font-weight: 500;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    letter-spacing: 0.08em;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
  }
  .row label {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .row label .readout {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }
  .row input[type="range"] {
    grid-column: 1 / -1;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 22px;
    background: transparent;
    margin: 0;
    cursor: pointer;
  }
  .row input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(138,212,255,0.9), rgba(255,255,255,0.15));
  }
  .row input[type="range"]::-moz-range-track {
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(138,212,255,0.9), rgba(255,255,255,0.15));
  }
  .row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    margin-top: -6px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.4), 0 0 14px rgba(138,212,255,0.7);
    transition: transform 0.25s var(--ease);
  }
  .row input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.4), 0 0 14px rgba(138,212,255,0.7);
  }
  .row input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.25); }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .btn {
    flex: 1;
    appearance: none;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.04);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: background 0.35s var(--ease), border-color 0.35s var(--ease), transform 0.25s var(--ease);
  }
  .btn::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(138,212,255,0.35), transparent 60%);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.28); }
  .btn:hover::after { opacity: 1; }
  .btn:active { transform: scale(0.97); }
  .btn.ghost { flex: 0 0 auto; }

  .swatch {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: hsl(200 100% 70%);
    box-shadow: 0 0 12px currentColor;
    transition: background 0.3s linear;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.85; }
  }

  @media (max-width: 480px) {
    .hud { right: 12px; left: 12px; width: auto; padding: 14px; }
    .hint { font-size: 10px; bottom: 150px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand, .hud { animation: none; }
    .hint { animation: none; }
    .btn, .row input[type="range"]::-webkit-slider-thumb { transition: none; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="Interactive fluid smoke canvas. Drag to inject colored dye." role="img"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="brand">
  <h1>Ether</h1>
  <p>a fluid you can touch</p>
</header>

<p class="hint" id="hint">drag anywhere to breathe color into the void</p>

<aside class="hud" aria-label="Simulation controls">
  <header>
    <span>Stable fluids · 96²</span>
    <b id="fps">— fps</b>
  </header>

  <div class="row">
    <label for="brightness">Brightness <span class="readout" id="brightnessOut">1.40</span></label>
    <input type="range" id="brightness" min="0.4" max="3" step="0.01" value="1.4">
  </div>

  <div class="row">
    <label for="dissipation">Dissipation <span class="readout" id="dissipationOut">0.988</span></label>
    <input type="range" id="dissipation" min="0.94" max="0.999" step="0.001" value="0.988">
  </div>

  <div class="actions">
    <button class="btn" id="clear" type="button">Clear</button>
    <button class="btn ghost" id="autoBtn" type="button" title="Toggle ambient stirring" aria-pressed="true">Auto</button>
    <span class="btn ghost" style="display:flex;align-items:center;justify-content:center;pointer-events:none;" aria-hidden="true">
      <span class="swatch" id="swatch"></span>
    </span>
  </div>
</aside>

<script>
(function () {
  'use strict';

  // ---------- Grid setup (stable fluids, Jos Stam style) ----------
  var N = 96;                 // interior cells per side
  var SIZE = (N + 2) * (N + 2);
  var IX = function (x, y) { return x + (N + 2) * y; };

  var u = new Float32Array(SIZE), v = new Float32Array(SIZE);
  var u0 = new Float32Array(SIZE), v0 = new Float32Array(SIZE);
  var r = new Float32Array(SIZE), g = new Float32Array(SIZE), b = new Float32Array(SIZE);
  var r0 = new Float32Array(SIZE), g0 = new Float32Array(SIZE), b0 = new Float32Array(SIZE);

  var dt = 0.12;
  var visc = 0.00002;
  var diff = 0.00001;
  var dissipation = 0.988;
  var brightness = 1.4;

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d', { alpha: false });

  // Low-res buffer that we scale to the screen.
  var buf = document.createElement('canvas');
  buf.width = N; buf.height = N;
  var bctx = buf.getContext('2d');
  var img = bctx.createImageData(N, N);
  var pix = img.data;

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Solver ----------
  function setBoundary(bnd, x) {
    var i;
    for (i = 1; i <= N; i++) {
      x[IX(0, i)]     = bnd === 1 ? -x[IX(1, i)] : x[IX(1, i)];
      x[IX(N + 1, i)] = bnd === 1 ? -x[IX(N, i)] : x[IX(N, i)];
      x[IX(i, 0)]     = bnd === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
      x[IX(i, N + 1)] = bnd === 2 ? -x[IX(i, N)] : x[IX(i, N)];
    }
    x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
    x[IX(0, N + 1)] = 0.5 * (x[IX(1, N + 1)] + x[IX(0, N)]);
    x[IX(N + 1, 0)] = 0.5 * (x[IX(N, 0)] + x[IX(N + 1, 1)]);
    x[IX(N + 1, N + 1)] = 0.5 * (x[IX(N, N + 1)] + x[IX(N + 1, N)]);
  }

  function linSolve(bnd, x, x0, a, c, iter) {
    var invC = 1 / c;
    for (var k = 0; k < iter; k++) {
      for (var j = 1; j <= N; j++) {
        var row = (N + 2) * j;
        for (var i = 1; i <= N; i++) {
          var idx = row + i;
          x[idx] = (x0[idx] + a * (x[idx - 1] + x[idx + 1] + x[idx - (N + 2)] + x[idx + (N + 2)])) * invC;
        }
      }
      setBoundary(bnd, x);
    }
  }

  function diffuse(bnd, x, x0, rate, iter) {
    var a = dt * rate * N * N;
    linSolve(bnd, x, x0, a, 1 + 4 * a, iter);
  }

  function advect(bnd, d, d0, velU, velV) {
    var dt0 = dt * N;
    for (var j = 1; j <= N; j++) {
      for (var i = 1; i <= N; i++) {
        var idx = IX(i, j);
        var x = i - dt0 * velU[idx];
        var y = j - dt0 * velV[idx];
        if (x < 0.5) x = 0.5; if (x > N + 0.5) x = N + 0.5;
        if (y < 0.5) y = 0.5; if (y > N + 0.5) y = N + 0.5;
        var i0 = x | 0, i1 = i0 + 1;
        var j0 = y | 0, j1 = j0 + 1;
        var s1 = x - i0, s0 = 1 - s1;
        var t1 = y - j0, t0 = 1 - t1;
        d[idx] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
                 s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
      }
    }
    setBoundary(bnd, d);
  }

  function project(velU, velV, p, div) {
    var h = 1 / N;
    for (var j = 1; j <= N; j++) {
      for (var i = 1; i <= N; i++) {
        var idx = IX(i, j);
        div[idx] = -0.5 * h * (velU[idx + 1] - velU[idx - 1] + velV[idx + (N + 2)] - velV[idx - (N + 2)]);
        p[idx] = 0;
      }
    }
    setBoundary(0, div); setBoundary(0, p);
    linSolve(0, p, div, 1, 4, 16);
    for (j = 1; j <= N; j++) {
      for (i = 1; i <= N; i++) {
        idx = IX(i, j);
        velU[idx] -= 0.5 * (p[idx + 1] - p[idx - 1]) / h;
        velV[idx] -= 0.5 * (p[idx + (N + 2)] - p[idx - (N + 2)]) / h;
      }
    }
    setBoundary(1, velU); setBoundary(2, velV);
  }

  function velocityStep() {
    diffuse(1, u0, u, visc, 4); diffuse(2, v0, v, visc, 4);
    project(u0, v0, u, v);
    advect(1, u, u0, u0, v0); advect(2, v, v0, u0, v0);
    project(u, v, u0, v0);
    // gentle global damping so energy doesn't accumulate forever
    for (var i = 0; i < SIZE; i++) { u[i] *= 0.995; v[i] *= 0.995; }
  }

  function densityStep(d, d0) {
    diffuse(0, d0, d, diff, 4);
    advect(0, d, d0, u, v);
    for (var i = 0; i < SIZE; i++) d[i] *= dissipation;
  }

  // ---------- Input / dye injection ----------
  var hue = 200;
  var pointer = { down: false, x: 0, y: 0, px: 0, py: 0, moved: false };
  var hintEl = document.getElementById('hint');
  var swatch = document.getElementById('swatch');

  function hslToRgb(h, s, l) {
    h = ((h % 360) + 360) % 360;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    var m = l - c / 2;
    var rr = 0, gg = 0, bb = 0;
    if (h < 60) { rr = c; gg = x; } else if (h < 120) { rr = x; gg = c; }
    else if (h < 180) { gg = c; bb = x; } else if (h < 240) { gg = x; bb = c; }
    else if (h < 300) { rr = x; bb = c; } else { rr = c; bb = x; }
    return [rr + m, gg + m, bb + m];
  }

  function splat(cx, cy, dx, dy, radius, strength) {
    var rgb = hslToRgb(hue, 0.95, 0.55);
    var gx = cx * N, gy = cy * N;
    var rad = radius * N;
    var r2 = rad * rad;
    var x0 = Math.max(1, Math.floor(gx - rad)), x1 = Math.min(N, Math.ceil(gx + rad));
    var y0 = Math.max(1, Math.floor(gy - rad)), y1 = Math.min(N, Math.ceil(gy + rad));
    for (var j = y0; j <= y1; j++) {
      for (var i = x0; i <= x1; i++) {
        var ddx = i - gx, ddy = j - gy;
        var d2 = ddx * ddx + ddy * ddy;
        if (d2 > r2) continue;
        var falloff = Math.exp(-d2 / (r2 * 0.45));
        var idx = IX(i, j);
        u[idx] += dx * falloff * strength;
        v[idx] += dy * falloff * strength;
        r[idx] += rgb[0] * falloff * strength * 0.6;
        g[idx] += rgb[1] * falloff * strength * 0.6;
        b[idx] += rgb[2] * falloff * strength * 0.6;
      }
    }
  }

  function toLocal(e) {
    return { x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight };
  }

  canvas.addEventListener('pointerdown', function (e) {
    var p = toLocal(e);
    pointer.down = true;
    pointer.x = pointer.px = p.x;
    pointer.y = pointer.py = p.y;
    canvas.setPointerCapture(e.pointerId);
    splat(p.x, p.y, 0, 0, 0.045, 1.2);
    hintEl.classList.add('hidden');
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = toLocal(e);
    pointer.px = pointer.x; pointer.py = pointer.y;
    pointer.x = p.x; pointer.y = p.y;
    pointer.moved = true;
    if (!pointer.down) {
      // hover leaves a faint trail so the canvas always feels alive
      var hx = (p.x - pointer.px) * 6, hy = (p.y - pointer.py) * 6;
      splat(p.x, p.y, hx, hy, 0.02, 0.06);
    }
  });
  function release() { pointer.down = false; }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerleave', release);

  // ---------- Controls ----------
  var brightnessIn = document.getElementById('brightness');
  var brightnessOut = document.getElementById('brightnessOut');
  var dissipationIn = document.getElementById('dissipation');
  var dissipationOut = document.getElementById('dissipationOut');
  var autoBtn = document.getElementById('autoBtn');
  var auto = true;

  brightnessIn.addEventListener('input', function () {
    brightness = parseFloat(this.value);
    brightnessOut.textContent = brightness.toFixed(2);
  });
  dissipationIn.addEventListener('input', function () {
    dissipation = parseFloat(this.value);
    dissipationOut.textContent = dissipation.toFixed(3);
  });
  document.getElementById('clear').addEventListener('click', function () {
    r.fill(0); g.fill(0); b.fill(0);
    u.fill(0); v.fill(0);
  });
  autoBtn.addEventListener('click', function () {
    auto = !auto;
    autoBtn.setAttribute('aria-pressed', String(auto));
    autoBtn.style.opacity = auto ? '1' : '0.5';
  });

  // Glow follows the pointer on buttons
  Array.prototype.forEach.call(document.querySelectorAll('.btn'), function (btn) {
    btn.addEventListener('pointermove', function (e) {
      var rect = btn.getBoundingClientRect();
      btn.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width * 100) + '%');
      btn.style.setProperty('--my', ((e.clientY - rect.top) / rect.height * 100) + '%');
    });
  });

  // ---------- Ambient stirring ----------
  var t = 0;
  function ambient() {
    if (!auto || reduceMotion) return;
    t += 0.008;
    // two slow orbiting emitters
    var ax = 0.5 + Math.cos(t * 0.9) * 0.28, ay = 0.5 + Math.sin(t * 1.3) * 0.24;
    var bx = 0.5 + Math.sin(t * 0.7 + 2) * 0.3, by = 0.5 + Math.cos(t * 1.1 + 1) * 0.26;
    var pulse = 0.5 + 0.5 * Math.sin(t * 2.7);
    splat(ax, ay, Math.cos(t * 2) * 0.35, Math.sin(t * 2) * 0.35, 0.03, 0.05 * pulse);
    hue += 40;
    splat(bx, by, -Math.sin(t * 1.5) * 0.3, Math.cos(t * 1.5) * 0.3, 0.03, 0.05 * (1 - pulse));
    hue -= 40;
  }

  // ---------- Render ----------
  function render() {
    var k = 0;
    var br = brightness * 255;
    for (var j = 1; j <= N; j++) {
      var row = (N + 2) * j;
      for (var i = 1; i <= N; i++) {
        var idx = row + i;
        var rr = r[idx] * br, gg = g[idx] * br, bb = b[idx] * br;
        // soft tone-map so saturated cores bloom to white instead of clipping
        pix[k]     = rr > 255 ? 255 : rr;
        pix[k + 1] = gg > 255 ? 255 : gg;
        pix[k + 2] = bb > 255 ? 255 : bb;
        pix[k + 3] = 255;
        k += 4;
      }
    }
    bctx.putImageData(img, 0, 0);
    var w = window.innerWidth, h = window.innerHeight;
    ctx.fillStyle = '#04050a';
    ctx.fillRect(0, 0, w, h);
    // cover-fit the square sim to the viewport
    var s = Math.max(w, h);
    ctx.drawImage(buf, (w - s) / 2, (h - s) / 2, s, s);
  }

  // ---------- Main loop ----------
  var frames = 0, lastFpsT = performance.now();
  var fpsEl = document.getElementById('fps');
  var last = performance.now();

  function frame(now) {
    var elapsed = now - last; last = now;
    dt = Math.min(0.2, Math.max(0.05, elapsed / 1000 * 7));

    hue = (hue + (pointer.down ? 1.6 : 0.4)) % 360;
    swatch.style.background = 'hsl(' + hue.toFixed(0) + ' 100% 70%)';
    swatch.style.color = 'hsl(' + hue.toFixed(0) + ' 100% 60%)';

    if (pointer.down && pointer.moved) {
      var dx = (pointer.x - pointer.px) * 8, dy = (pointer.y - pointer.py) * 8;
      var speed = Math.min(1, Math.hypot(dx, dy) * 3);
      splat(pointer.x, pointer.y, dx, dy, 0.035 + speed * 0.02, 0.9 + speed);
    }
    pointer.moved = false;

    ambient();
    velocityStep();
    densityStep(r, r0); densityStep(g, g0); densityStep(b, b0);
    render();

    frames++;
    if (now - lastFpsT > 800) {
      fpsEl.textContent = Math.round(frames * 1000 / (now - lastFpsT)) + ' fps';
      frames = 0; lastFpsT = now;
    }
    requestAnimationFrame(frame);
  }

  // Seed the canvas with a quiet opening gesture
  (function seed() {
    for (var i = 0; i < 24; i++) {
      var a = i / 24 * Math.PI * 2;
      hue = 190 + i * 6;
      splat(0.5 + Math.cos(a) * 0.12, 0.5 + Math.sin(a) * 0.12, Math.cos(a) * 0.6, Math.sin(a) * 0.6, 0.03, 0.5);
    }
    hue = 200;
  })();

  requestAnimationFrame(frame);
})();
</script>
