<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahel Meridian — Dunes at Golden Hour</title>
<style>
  :root {
    --sky-top: #5d8fb5;
    --sky-mid: #e8b86b;
    --sky-hor: #f8dca4;
    --sun: #fff6d2;
    --sun-glow: rgba(255, 220, 150, 0.55);
    --d1: #f1d9a8;
    --d2: #e4b982;
    --d3: #d59b62;
    --d4: #bd7a48;
    --d5: #9a5a35;
    --d6: #6e3b24;
    --haze: rgba(255, 225, 170, 0.45);
    --text: #fff4dc;
    --px: 0;
    --py: 0;
    --stars: 0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, ui-serif, serif;
    color: var(--text);
    overflow: hidden;
    background: var(--sky-top);
  }
  .world {
    position: fixed; inset: 0;
    overflow: hidden;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 58%, var(--sky-hor) 78%, var(--d1) 100%);
    transition: background 1s linear;
  }
  .stars {
    position: absolute; inset: 0;
    opacity: var(--stars);
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.9) 0 0.8px, transparent 1.4px),
      radial-gradient(circle, rgba(255,255,255,0.6) 0 0.6px, transparent 1.2px),
      radial-gradient(circle, rgba(255,240,220,0.8) 0 1px, transparent 1.6px);
    background-size: 210px 190px, 130px 160px, 340px 290px;
    background-position: 20px 10px, 70px 40px, 0 0;
    transition: opacity 1s;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 50%, transparent 78%);
    mask-image: linear-gradient(180deg, #000 0%, #000 50%, transparent 78%);
  }
  .sun-wrap {
    position: absolute; inset: 0;
    pointer-events: none;
    transform: translate(calc(var(--px) * -6px), calc(var(--py) * -4px));
  }
  .sun {
    position: absolute;
    left: 62%;
    top: 30%;
    width: clamp(70px, 9vw, 150px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #fffbe8, var(--sun) 55%, rgba(255,230,180,0.6) 70%, transparent 72%);
    box-shadow: 0 0 60px 30px var(--sun-glow), 0 0 200px 80px rgba(255, 200, 120, 0.25);
    transform: translate(-50%, -50%);
    filter: url(#shimmer);
  }
  .horizon-haze {
    position: absolute; left: 0; right: 0;
    top: 56%; height: 30%;
    background: linear-gradient(180deg, transparent, var(--haze) 60%, transparent);
    filter: blur(14px);
    pointer-events: none;
    transition: background 1s;
  }

  .layer {
    position: absolute;
    left: -6%; right: -6%;
    bottom: 0;
    height: 100%;
    pointer-events: none;
    will-change: transform;
  }
  .layer svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; display: block; }
  .l1 { transform: translate(calc(var(--px) * -8px), calc(var(--py) * -3px)); }
  .l2 { transform: translate(calc(var(--px) * -16px), calc(var(--py) * -6px)); }
  .l3 { transform: translate(calc(var(--px) * -26px), calc(var(--py) * -9px)); }
  .l4 { transform: translate(calc(var(--px) * -40px), calc(var(--py) * -13px)); }
  .l5 { transform: translate(calc(var(--px) * -58px), calc(var(--py) * -18px)); }
  .l6 { transform: translate(calc(var(--px) * -80px), calc(var(--py) * -24px)); }
  .l1 svg path { fill: var(--d1); transition: fill 1s; }
  .l2 svg path { fill: var(--d2); transition: fill 1s; }
  .l3 svg path { fill: var(--d3); transition: fill 1s; }
  .l4 svg path { fill: var(--d4); transition: fill 1s; }
  .l5 svg path { fill: var(--d5); transition: fill 1s; }
  .l6 svg path { fill: var(--d6); transition: fill 1s; }
  .l1 svg { filter: url(#shimmer); }

  .caravan {
    position: absolute;
    bottom: 33.5%;
    left: 0;
    width: clamp(160px, 22vw, 360px);
    height: auto;
    transform: translateX(-120%);
    will-change: transform;
  }
  .caravan path, .caravan ellipse { fill: var(--d6); transition: fill 1s; }
  .camel { transform-origin: 50% 100%; }
  .camel:nth-child(1) { animation: bob 1.4s ease-in-out infinite; }
  .camel:nth-child(2) { animation: bob 1.4s ease-in-out -0.35s infinite; }
  .camel:nth-child(3) { animation: bob 1.4s ease-in-out -0.7s infinite; }
  .camel:nth-child(4) { animation: bob 1.4s ease-in-out -1.05s infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0.3deg); } 50% { transform: translateY(-1.2px) rotate(-0.3deg); } }

  canvas#sand {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .title {
    position: absolute;
    left: 50%; top: 9%;
    transform: translate(calc(-50% + var(--px) * 4px), calc(var(--py) * 3px));
    text-align: center;
    pointer-events: none;
    text-shadow: 0 2px 20px rgba(80, 30, 10, 0.35);
    width: 90vw;
  }
  .title h1 {
    margin: 0;
    font-weight: normal;
    font-size: clamp(1.9rem, 6.5vw, 5.4rem);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    transform: scaleX(1.12);
    line-height: 1;
  }
  .title .rule {
    width: min(38vw, 420px);
    height: 1px;
    margin: 18px auto 12px;
    background: linear-gradient(90deg, transparent, var(--text), transparent);
    opacity: .85;
  }
  .title p {
    margin: 0;
    font-style: italic;
    font-size: clamp(0.8rem, 1.5vw, 1.15rem);
    letter-spacing: 0.12em;
    opacity: .9;
  }

  .panel {
    position: absolute;
    left: 50%; bottom: 22px;
    transform: translateX(-50%);
    width: min(92vw, 560px);
    padding: 14px 18px 12px;
    border-radius: 14px;
    background: rgba(40, 18, 8, 0.32);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 235, 200, 0.22);
    box-shadow: 0 20px 40px rgba(30, 10, 0, 0.25);
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 14px;
    align-items: center;
  }
  .panel .label {
    font-size: 0.66rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: .85;
    white-space: nowrap;
  }
  .panel .clock {
    font-family: 'Courier New', ui-monospace, monospace;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    min-width: 5ch;
    text-align: right;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px;
    background: linear-gradient(90deg, #ffe7b0, #ff9a5a, #7a3b5c, #1a1f3d);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff, #ffd98a 60%, #d98a3f);
    border: 1px solid rgba(90, 40, 10, 0.5);
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff, #ffd98a 60%, #d98a3f);
    border: 1px solid rgba(90, 40, 10, 0.5);
    cursor: pointer;
  }
  .panel button {
    font: inherit; font-size: 0.66rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--text); background: rgba(255,240,210,0.12);
    border: 1px solid rgba(255,235,200,0.35); border-radius: 999px;
    padding: 7px 14px; cursor: pointer;
    transition: background .2s;
    grid-column: 1 / -1;
    justify-self: center;
  }
  .panel button:hover { background: rgba(255,240,210,0.25); }
  .wind {
    position: absolute; right: 18px; top: 18px;
    font-size: 0.62rem; letter-spacing: 0.28em; text-transform: uppercase;
    opacity: .75; text-align: right; line-height: 1.7;
  }
  @media (max-width: 600px) {
    .panel { grid-template-columns: 1fr auto; }
    .panel .label { display: none; }
    .caravan { bottom: 34%; }
    .title { top: 7%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .camel { animation: none; }
    .sun, .l1 svg { filter: none; }
  }
</style>
</head>
<body>
<div class="world" id="world">
  <div class="stars"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="shimmer" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="2" seed="3" result="noise">
          <animate attributeName="baseFrequency" values="0.012 0.05;0.016 0.06;0.012 0.05" dur="7s" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G">
          <animate attributeName="scale" values="5;9;5" dur="4.5s" repeatCount="indefinite"/>
        </feDisplacementMap>
      </filter>
    </defs>
  </svg>

  <div class="sun-wrap"><div class="sun" id="sun"></div></div>
  <div class="horizon-haze"></div>

  <!-- Far dunes (shimmering) -->
  <div class="layer l1">
    <svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
      <path d="M0 400 C120 372 230 350 360 356 C500 362 560 400 700 392 C840 384 900 340 1040 344 C1180 348 1260 392 1400 386 C1500 382 1560 366 1600 358 L1600 600 L0 600 Z"/>
    </svg>
  </div>
  <div class="layer l2">
    <svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
      <path d="M0 430 C140 410 240 380 380 392 C520 404 600 450 740 440 C880 430 960 386 1100 388 C1240 390 1300 436 1440 432 C1520 430 1570 420 1600 414 L1600 600 L0 600 Z"/>
    </svg>
  </div>
  <div class="layer l3">
    <svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
      <path d="M0 470 C100 452 180 420 300 424 C440 428 520 476 660 470 C820 462 880 420 1020 428 C1160 436 1240 484 1380 480 C1480 476 1550 460 1600 452 L1600 600 L0 600 Z"/>
    </svg>
  </div>
  <div class="layer l4" id="mid">
    <svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
      <path d="M0 500 C160 486 260 456 400 462 C560 468 620 510 780 504 C940 498 1020 452 1160 458 C1300 464 1380 512 1500 506 C1560 504 1590 498 1600 496 L1600 600 L0 600 Z"/>
    </svg>
    <svg class="caravan" id="caravan" viewBox="0 0 360 60" aria-label="A caravan of four camels walking">
      <g class="camel">
        <path d="M14 58 L16 44 L18 44 L20 58 Z M28 58 L30 44 L32 44 L34 58 Z"/>
        <path d="M12 46 C10 36 16 30 24 30 C30 30 34 34 36 40 C38 32 44 30 50 34 C52 40 46 44 40 46 Z"/>
        <path d="M36 36 C40 30 44 24 48 22 C50 20 52 22 52 26 L51 32 C50 34 46 36 42 38 Z"/>
        <ellipse cx="53" cy="22" rx="4" ry="2.4"/>
      </g>
      <g class="camel" transform="translate(88 0)">
        <path d="M14 58 L16 44 L18 44 L20 58 Z M28 58 L30 44 L32 44 L34 58 Z"/>
        <path d="M12 46 C10 36 16 30 24 30 C30 30 34 34 36 40 C38 32 44 30 50 34 C52 40 46 44 40 46 Z"/>
        <path d="M36 36 C40 30 44 24 48 22 C50 20 52 22 52 26 L51 32 C50 34 46 36 42 38 Z"/>
        <ellipse cx="53" cy="22" rx="4" ry="2.4"/>
        <path d="M22 30 L24 22 L28 22 L30 30 Z"/>
      </g>
      <g class="camel" transform="translate(176 0) scale(0.92) translate(0 5)">
        <path d="M14 58 L16 44 L18 44 L20 58 Z M28 58 L30 44 L32 44 L34 58 Z"/>
        <path d="M12 46 C10 36 16 30 24 30 C30 30 34 34 36 40 C38 32 44 30 50 34 C52 40 46 44 40 46 Z"/>
        <path d="M36 36 C40 30 44 24 48 22 C50 20 52 22 52 26 L51 32 C50 34 46 36 42 38 Z"/>
        <ellipse cx="53" cy="22" rx="4" ry="2.4"/>
      </g>
      <g class="camel" transform="translate(262 0)">
        <path d="M14 58 L16 44 L18 44 L20 58 Z M28 58 L30 44 L32 44 L34 58 Z"/>
        <path d="M12 46 C10 36 16 30 24 30 C30 30 34 34 36 40 C38 32 44 30 50 34 C52 40 46 44 40 46 Z"/>
        <path d="M36 36 C40 30 44 24 48 22 C50 20 52 22 52 26 L51 32 C50 34 46 36 42 38 Z"/>
        <ellipse cx="53" cy="22" rx="4" ry="2.4"/>
        <path d="M60 58 L62 44 L63 44 L65 58 Z M68 58 L69 46 L70 46 L72 58 Z"/>
        <path d="M58 48 C58 42 62 40 66 40 C70 40 72 42 73 46 L72 50 L60 50 Z"/>
        <path d="M72 44 C74 40 76 38 78 38 L79 42 L76 46 Z"/>
      </g>
    </svg>
  </div>
  <div class="layer l5">
    <svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
      <path d="M0 540 C120 528 220 500 360 508 C520 516 600 556 760 550 C920 544 980 500 1120 506 C1260 512 1340 556 1480 552 C1540 550 1580 544 1600 542 L1600 600 L0 600 Z"/>
    </svg>
  </div>
  <div class="layer l6">
    <svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
      <path d="M0 580 C140 566 260 548 400 556 C560 564 640 592 800 588 C960 584 1040 556 1180 562 C1320 568 1400 592 1520 590 C1560 589 1590 586 1600 584 L1600 600 L0 600 Z"/>
    </svg>
  </div>

  <canvas id="sand"></canvas>

  <div class="title">
    <h1>Sahel Meridian</h1>
    <div class="rule"></div>
    <p>Where the ergs meet the evening — 16° 14′ N, 0° 02′ W</p>
  </div>

  <div class="wind" id="wind">Wind ESE<br>14 kn</div>

  <div class="panel">
    <span class="label">Time of day</span>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Time of day">
    <span class="clock" id="clock">16:40</span>
    <button id="play">Pause cycle</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  const root = document.documentElement;
  const world = document.getElementById('world');
  const sun = document.getElementById('sun');
  const scrub = document.getElementById('scrub');
  const clock = document.getElementById('clock');
  const playBtn = document.getElementById('play');
  const caravan = document.getElementById('caravan');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- palette keyframes across the cycle ----------
  const keys = [
    { t: 0.00, skyTop: '#5d8fb5', skyMid: '#e8b86b', skyHor: '#f8dca4', sun: '#fff6d2', glow: [255,220,150,0.55], haze: [255,225,170,0.45], dunes: ['#f1d9a8','#e4b982','#d59b62','#bd7a48','#9a5a35','#6e3b24'], stars: 0, clock: 16.67 },
    { t: 0.35, skyTop: '#3f5e8c', skyMid: '#e3894e', skyHor: '#f6b975', sun: '#ffe9b0', glow: [255,190,110,0.6], haze: [255,200,140,0.5], dunes: ['#ecc48c','#dca26a','#c9834f','#ad653a','#87482b','#5b2e1c'], stars: 0, clock: 17.9 },
    { t: 0.62, skyTop: '#26305a', skyMid: '#b2496a', skyHor: '#ef8a5a', sun: '#ffcf8a', glow: [255,150,90,0.55], haze: [255,160,120,0.4], dunes: ['#d9a37a','#c4835a','#a96543','#8a4a32','#67351f','#43220f'], stars: 0.25, clock: 18.7 },
    { t: 0.82, skyTop: '#121a3b', skyMid: '#5a2f5a', skyHor: '#c9613f', sun: '#ffb26a', glow: [255,120,80,0.45], haze: [230,120,100,0.3], dunes: ['#a8785d','#946148','#7a4b39','#5f382a','#45261a','#2a170e'], stars: 0.7, clock: 19.5 },
    { t: 1.00, skyTop: '#070a1a', skyMid: '#1c1837', skyHor: '#4a2a3a', sun: '#ff8a5a', glow: [255,100,80,0.2], haze: [120,70,90,0.25], dunes: ['#5c4a4a','#4c3a3d','#3c2c31','#2e2126','#20161b','#120c10'], stars: 1, clock: 20.2 }
  ];
  const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const toHex = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
  const mix = (a, b, f) => a.map((v, i) => v + (b[i] - v) * f);
  const smooth = f => f * f * (3 - 2 * f);

  function apply(t) {
    let i = 0;
    while (i < keys.length - 2 && t > keys[i + 1].t) i++;
    const a = keys[i], b = keys[i + 1];
    const f = smooth(Math.max(0, Math.min(1, (t - a.t) / (b.t - a.t))));
    const set = (name, v) => root.style.setProperty(name, v);
    set('--sky-top', toHex(mix(hex(a.skyTop), hex(b.skyTop), f)));
    set('--sky-mid', toHex(mix(hex(a.skyMid), hex(b.skyMid), f)));
    set('--sky-hor', toHex(mix(hex(a.skyHor), hex(b.skyHor), f)));
    set('--sun', toHex(mix(hex(a.sun), hex(b.sun), f)));
    const g = mix(a.glow, b.glow, f), hz = mix(a.haze, b.haze, f);
    set('--sun-glow', `rgba(${g[0]|0},${g[1]|0},${g[2]|0},${g[3].toFixed(2)})`);
    set('--haze', `rgba(${hz[0]|0},${hz[1]|0},${hz[2]|0},${hz[3].toFixed(2)})`);
    for (let k = 0; k < 6; k++) set('--d' + (k + 1), toHex(mix(hex(a.dunes[k]), hex(b.dunes[k]), f)));
    set('--stars', (a.stars + (b.stars - a.stars) * f).toFixed(2));
    // sun path: arcs from upper right down behind the far dunes on the left-center
    const sx = 66 - t * 24;
    const sy = 22 + t * 48;
    sun.style.left = sx + '%';
    sun.style.top = sy + '%';
    sun.style.opacity = t > 0.9 ? String(Math.max(0, 1 - (t - 0.9) * 10)) : '1';
    const h = a.clock + (b.clock - a.clock) * f;
    const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
    clock.textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    sandTint = mix(hex(a.dunes[0]), hex(b.dunes[0]), f);
  }

  // ---------- cycle ----------
  const CYCLE = 60000;
  let playing = !reduce;
  let t = 0;
  let lastTs = null;
  let dir = 1;
  scrub.addEventListener('input', () => { t = scrub.value / 1000; apply(t); });
  scrub.addEventListener('pointerdown', () => { playing = false; playBtn.textContent = 'Resume cycle'; });
  playBtn.addEventListener('click', () => { playing = !playing; playBtn.textContent = playing ? 'Pause cycle' : 'Resume cycle'; });

  // ---------- parallax ----------
  let px = 0, py = 0, tpx = 0, tpy = 0;
  window.addEventListener('pointermove', e => {
    tpx = (e.clientX / window.innerWidth - 0.5) * 2;
    tpy = (e.clientY / window.innerHeight - 0.5) * 2;
  });
  window.addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    tpx = Math.max(-1, Math.min(1, e.gamma / 30));
    tpy = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
  });

  // ---------- sand ----------
  const canvas = document.getElementById('sand');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let sandTint = hex('#f1d9a8');
  const grains = [];
  const COUNT = 260;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function spawn(g) {
    g.x = -20 - Math.random() * 80;
    g.y = H * (0.55 + Math.random() * 0.45);
    g.vx = 2.5 + Math.random() * 4;
    g.vy = -0.4 + Math.random() * 0.8;
    g.len = 6 + Math.random() * 18;
    g.a = 0.15 + Math.random() * 0.45;
    g.w = 0.6 + Math.random() * 1.1;
    g.life = 0;
    g.phase = Math.random() * Math.PI * 2;
  }
  for (let i = 0; i < COUNT; i++) { const g = {}; spawn(g); g.x = Math.random() * W; grains.push(g); }
  let gust = 1, gustTarget = 1;
  let lastWindUpdate = -Infinity;
  const windEl = document.getElementById('wind');

  function drawSand(dt, now) {
    ctx.clearRect(0, 0, W, H);
    if (Math.random() < 0.01) gustTarget = 0.6 + Math.random() * 1.4;
    gust += (gustTarget - gust) * 0.01;
    if (now - lastWindUpdate > 2000) {
      lastWindUpdate = now;
      windEl.innerHTML = `Wind ESE<br>${Math.round(9 + gust * 6)} kn`;
    }
    const c = sandTint;
    ctx.lineCap = 'round';
    for (const g of grains) {
      g.life += dt;
      const sway = Math.sin(now / 900 + g.phase) * 0.6;
      g.x += g.vx * gust * dt * 60 / 60;
      g.y += (g.vy + sway * 0.4) * dt * 60 / 60;
      // grains hug the dune surface: bounce up a bit when near bottom
      if (g.y > H * 0.98) g.vy = -Math.abs(g.vy) - 0.3;
      if (g.y < H * 0.5) g.vy += 0.02;
      if (g.x > W + 40) spawn(g);
      const alpha = g.a * Math.min(1, g.life * 2) * (0.6 + gust * 0.3);
      ctx.strokeStyle = `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${alpha.toFixed(3)})`;
      ctx.lineWidth = g.w;
      ctx.beginPath();
      ctx.moveTo(g.x, g.y);
      ctx.lineTo(g.x - g.len * gust, g.y - g.vy * 3);
      ctx.stroke();
    }
  }

  // ---------- caravan ----------
  const CARAVAN_MS = 110000;
  let caravanStart = performance.now() - CARAVAN_MS * 0.3;

  // ---------- main loop ----------
  function loop(ts) {
    if (lastTs === null) lastTs = ts;
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;

    if (playing) {
      t += dir * dt * 1000 / CYCLE;
      if (t >= 1) { t = 1; dir = -1; }
      if (t <= 0) { t = 0; dir = 1; }
      scrub.value = String(Math.round(t * 1000));
      apply(t);
    }

    px += (tpx - px) * 0.05;
    py += (tpy - py) * 0.05;
    root.style.setProperty('--px', px.toFixed(3));
    root.style.setProperty('--py', py.toFixed(3));

    const cp = ((ts - caravanStart) % CARAVAN_MS) / CARAVAN_MS;
    const cw = caravan.getBoundingClientRect().width || 200;
    caravan.style.transform = `translateX(${(-cw - 30 + cp * (W * 1.12 + cw + 60)).toFixed(1)}px)`;

    if (!reduce) drawSand(dt, ts);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  apply(0);
  if (reduce) {
    // static frame: golden hour, light sand streaks drawn once
    drawSand(1 / 60, 0);
    document.querySelectorAll('animate').forEach(a => a.remove());
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
