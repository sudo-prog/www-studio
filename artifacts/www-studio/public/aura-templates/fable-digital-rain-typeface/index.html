<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAIN.TYPE — Digital Rain as Typographic Art</title>
<style>
  :root {
    --bg: #04100c;
    --head: #e8fff3;
    --mid: #5cffb0;
    --tail: #0b6b46;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--mid); font-family: var(--mono); font-size: 12px; overflow: hidden; transition: background 1s; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 55%, rgba(0,0,0,.55)); }

  .hud {
    position: fixed; z-index: 2; left: clamp(14px, 2.5vw, 36px); top: clamp(14px, 2.5vw, 36px);
    width: min(360px, calc(100vw - 28px));
    display: grid; gap: 14px;
    padding: 18px 18px 16px;
    border: 1px solid color-mix(in srgb, var(--mid) 30%, transparent);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 30px 60px -30px rgba(0,0,0,.8);
    transition: border-color 1s, background 1s;
  }
  .hud::before, .hud::after { content: ""; position: absolute; width: 10px; height: 10px; border: 1px solid var(--mid); transition: border-color 1s; }
  .hud::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
  .hud::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
  .title { display: flex; justify-content: space-between; align-items: baseline; letter-spacing: .18em; text-transform: uppercase; }
  .title b { color: var(--head); font-weight: 600; }
  .title span { opacity: .6; font-size: 10px; }
  .cursor { display: inline-block; width: .6em; height: 1.1em; background: var(--mid); vertical-align: -.2em; margin-left: 2px; animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { opacity: 0; } }
  .lbl { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; opacity: .65; display: flex; justify-content: space-between; }
  .lbl .readout { opacity: 1; color: var(--head); }
  .palettes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .palettes button {
    font: inherit; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--p-mid);
    background: transparent; border: 1px solid color-mix(in srgb, var(--p-mid) 35%, transparent); padding: 8px 4px; cursor: pointer;
    display: grid; gap: 6px; justify-items: center; transition: background .3s, border-color .3s, transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .palettes button i { width: 100%; height: 4px; background: linear-gradient(90deg, var(--p-head), var(--p-mid), var(--p-tail)); }
  .palettes button:hover { transform: translateY(-2px); border-color: var(--p-mid); }
  .palettes button[aria-pressed="true"] { border-color: var(--p-mid); background: color-mix(in srgb, var(--p-mid) 14%, transparent); }
  .ctl { display: grid; gap: 8px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 2px; background: color-mix(in srgb, var(--mid) 35%, transparent); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--head); border: 0; cursor: pointer; box-shadow: 0 0 10px var(--mid); transition: transform .2s; }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.25); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 0; background: var(--head); border: 0; cursor: pointer; }
  .cmd { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; border: 1px solid color-mix(in srgb, var(--mid) 35%, transparent); padding: 6px 8px 6px 10px; transition: border-color .3s, box-shadow .3s; }
  .cmd:focus-within { border-color: var(--mid); box-shadow: 0 0 18px -6px var(--mid); }
  .cmd .prompt { color: var(--head); }
  .cmd input { font: inherit; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--head); background: transparent; border: 0; outline: none; caret-color: var(--mid); width: 100%; min-width: 0; }
  .cmd input::placeholder { color: color-mix(in srgb, var(--mid) 45%, transparent); text-transform: none; letter-spacing: 0; }
  .cmd button {
    font: inherit; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--bg); background: var(--mid); border: 0; padding: 7px 10px; cursor: pointer;
    transition: background .3s, transform .2s cubic-bezier(.2,.8,.2,1);
  }
  .cmd button:hover { background: var(--head); transform: translateY(-1px); }
  .status { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; display: flex; justify-content: space-between; opacity: .8; }
  .status b { font-weight: 400; color: var(--head); }

  .stats {
    position: fixed; z-index: 2; right: clamp(14px, 2.5vw, 36px); bottom: clamp(14px, 2.5vw, 36px);
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase; text-align: right; opacity: .7; line-height: 1.9;
  }
  .stats b { color: var(--head); font-weight: 400; }
  .caption {
    position: fixed; z-index: 2; left: clamp(14px, 2.5vw, 36px); bottom: clamp(14px, 2.5vw, 36px);
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase; opacity: .55; max-width: 44ch; line-height: 1.8;
  }
  @media (max-width: 640px) { .caption { display: none; } .stats { font-size: 9px; } .hud { gap: 10px; padding: 14px; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
</head>
<body>
<canvas id="rain" aria-label="Falling glyph rain that resolves into a typed message"></canvas>
<div class="vignette"></div>

<aside class="hud" aria-label="Rain controls">
  <div class="title"><b>Rain.Type<span class="cursor" aria-hidden="true"></span></b><span>glyph stream v2.0</span></div>

  <div class="ctl">
    <div class="lbl">Palette</div>
    <div class="palettes" id="palettes">
      <button data-p="jade" aria-pressed="true" style="--p-head:#e8fff3;--p-mid:#5cffb0;--p-tail:#0b6b46"><i></i>Jade</button>
      <button data-p="amber" aria-pressed="false" style="--p-head:#fff3d6;--p-mid:#ffb347;--p-tail:#7a4a0a"><i></i>Amber</button>
      <button data-p="ice" aria-pressed="false" style="--p-head:#f4fbff;--p-mid:#8fd3ff;--p-tail:#1f4f7a"><i></i>Ice</button>
      <button data-p="rose" aria-pressed="false" style="--p-head:#ffe9f1;--p-mid:#ff6fa3;--p-tail:#7a1f45"><i></i>Rose</button>
    </div>
  </div>

  <div class="ctl">
    <label class="lbl" for="density">Density <span class="readout" id="densityOut">70%</span></label>
    <input type="range" id="density" min="10" max="100" value="70">
  </div>
  <div class="ctl">
    <label class="lbl" for="speed">Speed <span class="readout" id="speedOut">1.0×</span></label>
    <input type="range" id="speed" min="20" max="250" value="100">
  </div>

  <div class="ctl">
    <label class="lbl" for="msg">Message mode</label>
    <div class="cmd">
      <span class="prompt" aria-hidden="true">&gt;</span>
      <input type="text" id="msg" maxlength="40" placeholder="type a phrase, hit enter" autocomplete="off" spellcheck="false">
      <button id="resolve">Resolve</button>
    </div>
  </div>
  <div class="status"><span>Mode <b id="mode">rain</b></span><span id="progress"></span></div>
</aside>

<div class="caption">Glyphs: 24 invented katakana-like strokes, 10 numerals, 26 Latin capitals. Head bright, tail fading. Type a phrase and the rain will find it.</div>
<div class="stats"><span>Grid <b id="sGrid">—</b></span><br><span>Streams <b id="sStreams">—</b></span><br><span>Frame <b id="sFps">—</b> fps</span></div>

<script>
(function () {
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const PALETTES = {
    jade:  { bg: '#04100c', head: '#e8fff3', mid: '#5cffb0', tail: '#0b6b46' },
    amber: { bg: '#0d0903', head: '#fff3d6', mid: '#ffb347', tail: '#7a4a0a' },
    ice:   { bg: '#050912', head: '#f4fbff', mid: '#8fd3ff', tail: '#1f4f7a' },
    rose:  { bg: '#0f050a', head: '#ffe9f1', mid: '#ff6fa3', tail: '#7a1f45' }
  };
  let pal = PALETTES.jade;

  // ---- glyph set: invented stroke glyphs (10-unit box) + numerals + Latin ----
  const STROKES = [
    'M2 2H8M5 2V9', 'M2 3H8L6 9', 'M5 1V9M2 5H8', 'M2 2L8 8M8 2L2 8', 'M3 2H7V8H3Z', 'M2 2H8M2 5H8M5 5V9',
    'M2 8L5 2L8 8', 'M2 2V8H8', 'M8 2H2V8', 'M2 3H8M4 3V9M6 6H8', 'M2 2H8V5H2M5 5V9', 'M5 2V5M2 5H8M3 8H7',
    'M2 2H8L5 6L8 9', 'M2 9L5 2L8 9M3.5 6H6.5', 'M8 2L2 5L8 8', 'M2 2L8 5L2 8', 'M2 2H8L2 9', 'M3 2H7M5 2V6L2 9M5 6L8 9',
    'M2 2H5V9M5 5H8', 'M2 4H8M2 7H8M5 1V9', 'M3 2H7L5 5L7 8H3', 'M2 2L5 5L8 2M5 5V9', 'M2 5H8M4 2L2 5L4 8M6 2L8 5L6 8', 'M2 2H8V8H5M2 5H5V8'
  ];
  const LATIN = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', DIGITS = '0123456789';
  const GLYPHS = STROKES.map(d => ({ path: new Path2D(d) }))
    .concat(DIGITS.split('').map(ch => ({ text: ch })))
    .concat(LATIN.split('').map(ch => ({ text: ch })));
  const G = GLYPHS.length, LEVELS = 14;
  const textIndex = (ch) => {
    const u = ch.toUpperCase();
    if (DIGITS.includes(u)) return STROKES.length + DIGITS.indexOf(u);
    if (LATIN.includes(u)) return STROKES.length + 10 + LATIN.indexOf(u);
    return -1;
  };

  // ---- colour helpers -------------------------------------------------
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function shade(b) { // brightness 0..1 -> rgba string
    const H = hex(pal.head), M = hex(pal.mid), T = hex(pal.tail);
    let c, a = 1;
    if (b > 0.85) { const t = (b - 0.85) / 0.15; c = M.map((v, i) => v + (H[i] - v) * t); }
    else { const t = b / 0.85; c = T.map((v, i) => v + (M[i] - v) * t); a = Math.min(1, 0.15 + t * 1.1); }
    return 'rgba(' + c.map(Math.round).join(',') + ',' + a.toFixed(3) + ')';
  }

  // ---- atlas -----------------------------------------------------------
  let W = 0, H = 0, dpr = 1, cell = 22, cols = 0, rows = 0;
  let atlas, cellPx;
  function buildAtlas() {
    cellPx = Math.round(cell * dpr);
    atlas = document.createElement('canvas');
    atlas.width = G * cellPx; atlas.height = LEVELS * cellPx;
    const a = atlas.getContext('2d');
    a.lineCap = 'round'; a.lineJoin = 'round';
    a.textAlign = 'center'; a.textBaseline = 'middle';
    a.font = 'bold ' + Math.round(cellPx * 0.78) + 'px ' + getComputedStyle(document.body).fontFamily;
    for (let L = 0; L < LEVELS; L++) {
      const b = L / (LEVELS - 1);
      const col = shade(b);
      a.strokeStyle = col; a.fillStyle = col;
      a.lineWidth = Math.max(1, cellPx * (0.09 + 0.03 * b));
      a.shadowBlur = b > 0.9 ? cellPx * 0.6 : 0; a.shadowColor = pal.mid;
      for (let g = 0; g < G; g++) {
        const gl = GLYPHS[g], x = g * cellPx, y = L * cellPx;
        if (gl.path) {
          a.save(); a.translate(x + cellPx * 0.1, y + cellPx * 0.1); a.scale(cellPx * 0.08, cellPx * 0.08);
          a.lineWidth = a.lineWidth / (cellPx * 0.08);
          a.stroke(gl.path); a.restore();
        } else {
          a.fillText(gl.text, x + cellPx / 2, y + cellPx / 2 + cellPx * 0.03);
        }
      }
    }
  }

  // ---- grid state ------------------------------------------------------
  let bright, glyph, locked, lockT, streams;
  let density = 0.7, speedMul = 1;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    cell = W < 600 ? 18 : W > 2000 ? 26 : 22;
    cols = Math.ceil(W / cell); rows = Math.ceil(H / cell) + 1;
    bright = new Float32Array(cols * rows); glyph = new Uint8Array(cols * rows);
    locked = new Uint8Array(cols * rows); lockT = new Float32Array(cols * rows);
    for (let i = 0; i < glyph.length; i++) glyph[i] = (Math.random() * G) | 0;
    streams = Array.from({ length: cols }, () => ({ y: Math.random() * rows * 1.6 - rows * 0.6, v: 6 + Math.random() * 10, on: Math.random() < density, len: 8 + Math.random() * 18 }));
    // pre-seed tails so the very first frame already looks like rain in progress
    streams.forEach((s, c) => {
      if (!s.on) return;
      const head = Math.floor(s.y);
      for (let r = head; r >= 0 && r > head - 26; r--) { if (r < rows) bright[r * cols + c] = Math.exp(-(head - r) * 0.16); }
    });
    buildAtlas();
    document.getElementById('sGrid').textContent = cols + ' × ' + rows;
    if (message.state !== 'rain') message.state = 'rain';
  }

  // ---- message mode ----------------------------------------------------
  const message = { state: 'rain', targets: [], t: 0 };
  const modeEl = document.getElementById('mode'), progEl = document.getElementById('progress');
  function startMessage(text) {
    const chars = text.trim().toUpperCase().slice(0, Math.min(40, cols - 4)).split('');
    const glyphIdx = chars.map(textIndex);
    if (!glyphIdx.some(i => i >= 0)) return;
    // release any prior message
    for (let i = 0; i < locked.length; i++) if (locked[i]) { locked[i] = 0; bright[i] = 1; }
    const row = Math.floor(rows * 0.46), start = Math.floor((cols - chars.length) / 2);
    message.targets = [];
    glyphIdx.forEach((gi, k) => { if (gi >= 0) message.targets.push({ col: start + k, row, g: gi, done: false }); });
    message.state = 'resolving'; message.t = 0;
    // wake the columns that carry letters so the phrase resolves quickly
    message.targets.forEach((tg, k) => { const s = streams[tg.col]; s.on = true; if (s.y > tg.row || s.y < -rows) s.y = -2 - (k % 7) * 1.5; s.v = 10 + Math.random() * 6; });
  }
  function messageTick(dt) {
    const m = message;
    if (m.state === 'rain') { modeEl.textContent = 'rain'; progEl.textContent = ''; return; }
    m.t += dt;
    if (m.state === 'resolving') {
      let done = 0;
      m.targets.forEach(tg => {
        if (tg.done) { done++; return; }
        const s = streams[tg.col];
        if (!s.on) { s.on = true; s.y = -2; }
        if (s.y >= tg.row || m.t > 7) { // head has passed (or safety timeout)
          const i = tg.row * cols + tg.col;
          locked[i] = 1; lockT[i] = 0; glyph[i] = tg.g; bright[i] = 1; tg.done = true; done++;
        }
      });
      modeEl.textContent = 'resolving'; progEl.textContent = done + ' / ' + m.targets.length;
      if (done === m.targets.length) { m.state = 'hold'; m.t = 0; }
    } else if (m.state === 'hold') {
      modeEl.textContent = 'locked'; progEl.textContent = 'holding';
      if (m.t > 4.5) { m.state = 'dissolving'; m.t = 0; m.targets.forEach(tg => tg.release = Math.random() * 1.6); }
    } else if (m.state === 'dissolving') {
      modeEl.textContent = 'dissolving'; progEl.textContent = '';
      let left = 0;
      m.targets.forEach(tg => {
        const i = tg.row * cols + tg.col;
        if (locked[i]) { if (m.t > tg.release) { locked[i] = 0; bright[i] = 1; } else left++; }
      });
      if (!left) { m.state = 'rain'; m.targets = []; }
    }
  }

  // ---- simulation ------------------------------------------------------
  function tick(dt) {
    const decay = Math.exp(-dt * 1.6);
    for (let i = 0; i < bright.length; i++) if (!locked[i]) bright[i] *= decay;
    const want = Math.round(cols * density);
    let active = 0;
    for (let c = 0; c < cols; c++) {
      const s = streams[c];
      if (!s.on) { if (active < want && Math.random() < dt * 0.6) { s.on = true; s.y = -1; s.v = 6 + Math.random() * 10; } continue; }
      active++;
      const prev = Math.floor(s.y);
      s.y += s.v * speedMul * dt;
      const now = Math.floor(s.y);
      for (let r = prev + 1; r <= now; r++) {
        if (r < 0 || r >= rows) continue;
        const i = r * cols + c;
        if (locked[i]) continue;
        glyph[i] = (Math.random() * G) | 0; bright[i] = 1;
      }
      if (s.y > rows + 2) {
        s.on = active <= want && Math.random() < 0.8;
        s.y = -Math.random() * 6; s.v = 6 + Math.random() * 10;
        if (!s.on) active--;
      }
    }
    // random glyph flicker in the tails
    if (!reduced) for (let k = 0; k < cols * 0.15; k++) { const i = (Math.random() * bright.length) | 0; if (!locked[i] && bright[i] > 0.1) glyph[i] = (Math.random() * G) | 0; }
    for (let i = 0; i < lockT.length; i++) if (locked[i]) lockT[i] += dt;
    return active;
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const cp = cellPx;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const i = r * cols + c, b = bright[i];
      if (b < 0.03 && !locked[i]) continue;
      const L = locked[i] ? LEVELS - 1 : Math.min(LEVELS - 1, Math.round(b * (LEVELS - 1)));
      const x = c * cp, y = r * cp;
      if (locked[i]) {
        const t = Math.min(1, lockT[i] / 0.35), pop = 1 + (1 - t) * 0.7;
        ctx.save();
        ctx.translate(x + cp / 2, y + cp / 2); ctx.scale(pop, pop);
        ctx.globalAlpha = 0.28 + 0.12 * Math.sin(lockT[i] * 3 + c);
        ctx.fillStyle = pal.mid; ctx.beginPath(); ctx.arc(0, 0, cp * 0.9, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.drawImage(atlas, glyph[i] * cp, (LEVELS - 1) * cp, cp, cp, -cp / 2, -cp / 2, cp, cp);
        ctx.fillStyle = pal.head; ctx.fillRect(-cp * 0.35, cp * 0.42, cp * 0.7, Math.max(1, cp * 0.05));
        ctx.restore();
      } else {
        ctx.drawImage(atlas, glyph[i] * cp, L * cp, cp, cp, x, y, cp, cp);
      }
    }
  }

  let last = performance.now(), fpsAcc = 0, fpsN = 0, statT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const active = tick(dt);
    messageTick(dt);
    render();
    fpsAcc += dt; fpsN++; statT += dt;
    if (statT > 0.5) {
      document.getElementById('sFps').textContent = Math.round(fpsN / fpsAcc);
      document.getElementById('sStreams').textContent = active + ' / ' + cols;
      fpsAcc = 0; fpsN = 0; statT = 0;
    }
    requestAnimationFrame(frame);
  }

  // ---- controls --------------------------------------------------------
  const densityEl = document.getElementById('density'), speedEl = document.getElementById('speed');
  densityEl.addEventListener('input', () => { density = densityEl.value / 100; document.getElementById('densityOut').textContent = densityEl.value + '%'; });
  speedEl.addEventListener('input', () => { speedMul = speedEl.value / 100; document.getElementById('speedOut').textContent = speedMul.toFixed(1) + '×'; });
  if (reduced) { densityEl.value = 35; speedEl.value = 35; densityEl.dispatchEvent(new Event('input')); speedEl.dispatchEvent(new Event('input')); }

  document.getElementById('palettes').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    pal = PALETTES[b.dataset.p];
    document.querySelectorAll('#palettes button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    const rs = document.documentElement.style;
    rs.setProperty('--bg', pal.bg); rs.setProperty('--head', pal.head); rs.setProperty('--mid', pal.mid); rs.setProperty('--tail', pal.tail);
    buildAtlas();
  });

  const msgEl = document.getElementById('msg');
  const go = () => { if (msgEl.value.trim()) { startMessage(msgEl.value); msgEl.blur(); } };
  document.getElementById('resolve').addEventListener('click', go);
  msgEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
  window.addEventListener('keydown', (e) => {
    if (e.target !== document.body) return;
    if (e.key === '/') { e.preventDefault(); msgEl.focus(); }
    else if (e.key >= '1' && e.key <= '4') document.querySelectorAll('#palettes button')[+e.key - 1].click();
  });
  canvas.addEventListener('click', () => { if (message.state === 'hold') { message.state = 'dissolving'; message.t = 0; message.targets.forEach(tg => tg.release = Math.random() * 1.2); } });

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
  setTimeout(() => { if (message.state === 'rain') startMessage('TYPE IS RAIN'); }, 2200);
})();
</script>
</body>
</html>
