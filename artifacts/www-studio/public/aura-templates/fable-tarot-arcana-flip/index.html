<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Major Arcana — a three-card spread</title>
<style>
  :root{
    --velvet:#4a0f1e; --velvet-2:#2c0812; --gold:#d9b45b; --gold-2:#f3dc9a; --ivory:#f1e6c8; --ink:#1b1424; --muted:#c9a58c;
    --cw: clamp(84px, 13vw, 150px); --ch: calc(var(--cw) * 1.66);
    --ease: cubic-bezier(.22,.8,.2,1);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{
    min-height:100vh; color:var(--ivory); overflow-x:hidden;
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, ui-serif, serif;
    background-color:var(--velvet);
    background-image:
      radial-gradient(ellipse 70% 55% at 50% 0%, rgba(255,190,110,.28), transparent 70%),
      radial-gradient(ellipse 120% 90% at 50% 60%, transparent 40%, rgba(0,0,0,.75) 100%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 1px, transparent 1px 5px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.14) 0 1px, transparent 1px 5px),
      linear-gradient(var(--velvet), var(--velvet-2));
    background-attachment: fixed;
  }
  .candle{ position:fixed; left:50%; top:-12vh; width:70vw; height:50vh; transform:translateX(-50%); border-radius:50%; pointer-events:none; z-index:0;
    background: radial-gradient(closest-side, rgba(255,200,120,.30), rgba(255,170,90,.08) 60%, transparent); filter:blur(20px); animation: flicker 3.2s ease-in-out infinite; }
  @keyframes flicker{ 0%,100%{ opacity:.85; transform:translateX(-50%) scale(1); } 30%{ opacity:1; transform:translateX(-51%) scale(1.04); } 60%{ opacity:.75; transform:translateX(-49%) scale(.98); } }

  header{ position:relative; z-index:2; text-align:center; padding: clamp(18px,4vh,44px) 16px 0; }
  h1{ margin:0; font-weight:400; font-variant: small-caps; letter-spacing:.22em; font-size: clamp(1.4rem, 3.2vw, 2.4rem); color:var(--gold-2); text-shadow: 0 0 24px rgba(255,210,130,.35); }
  header p{ margin:.5em 0 0; color:var(--muted); font-style:italic; font-size:clamp(.85rem,1.4vw,1rem); }
  .rule{ width:min(320px,60vw); height:1px; margin:14px auto 0; background:linear-gradient(90deg, transparent, var(--gold), transparent); }

  main{ position:relative; z-index:1; max-width:1100px; margin:0 auto; padding: 0 12px 40px; }
  .spread{ display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: clamp(8px,2vw,28px); margin: clamp(14px,3vh,30px) auto 0; max-width: 760px; }
  .col{ display:flex; flex-direction:column; align-items:center; gap:10px; min-width:0; }
  .slot{ width:var(--cw); height:var(--ch); border-radius: calc(var(--cw) * .07); border:1px dashed rgba(217,180,91,.45); display:grid; place-items:center; position:relative; background:rgba(0,0,0,.18); transition: border-color .4s, box-shadow .4s; }
  .slot.filled{ border-color:transparent; box-shadow:0 0 0 1px rgba(217,180,91,.15); }
  .slot .lbl{ font-variant: small-caps; letter-spacing:.24em; color:rgba(217,180,91,.85); font-size:clamp(.7rem,1.3vw,.95rem); }
  .reading{ text-align:center; max-width:30ch; opacity:0; transform:translateY(10px); transition: opacity .8s var(--ease), transform .8s var(--ease); font-size:clamp(.72rem,1.25vw,.95rem); line-height:1.5; }
  .reading.show{ opacity:1; transform:none; }
  .reading h3{ margin:0; font-weight:400; font-variant: small-caps; letter-spacing:.14em; color:var(--gold-2); font-size:1.15em; }
  .reading .or{ margin:.15em 0 .5em; font-size:.8em; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
  .reading .or.rev{ color:#e88b7d; }
  .reading .kw{ display:block; font-style:italic; color:var(--muted); margin-top:.5em; font-size:.85em; }

  .stage{ position:relative; height: calc(var(--ch) * 1.75); margin: clamp(10px,3vh,30px) auto 0; }
  .card{ position:absolute; left:50%; top:10px; width:var(--cw); height:var(--ch); margin-left:calc(var(--cw) / -2); transform-origin: 50% calc(var(--ch) * 2.6);
    transition: transform .9s var(--ease), opacity .6s ease; cursor:pointer; will-change: transform; outline:none; }
  .card:focus-visible .lift{ box-shadow:0 0 0 3px var(--gold-2); border-radius: calc(var(--cw) * .07); }
  .lift{ width:100%; height:100%; transition: transform .5s var(--ease); perspective:1200px; }
  .card:not(.drawn):hover .lift, .card:not(.drawn):focus-visible .lift{ transform:translateY(-18px); }
  .card.rev .lift{ transform:rotate(180deg); }
  .inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition: transform 1.1s var(--ease); }
  .card.flipped .inner{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; border-radius: calc(var(--cw) * .07); overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow: 0 10px 30px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.06) inset; }
  .face svg{ display:block; }
  .back svg{ width:100%; height:100%; }
  .front{ transform:rotateY(180deg); background: radial-gradient(ellipse at 50% 30%, #2a1d36, var(--ink) 70%); border:1px solid rgba(217,180,91,.5); display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding: 6% 6% 5%; }
  .front::before{ content:""; position:absolute; inset:5%; border:1px solid rgba(217,180,91,.35); border-radius:3px; pointer-events:none; }
  .front::after{ content:""; position:absolute; inset:0; pointer-events:none; background: linear-gradient(115deg, transparent 30%, rgba(255,240,190,.0) 42%, rgba(255,240,190,.45) 50%, rgba(255,240,190,0) 58%, transparent 70%); background-size:250% 100%; background-position: 120% 0; mix-blend-mode:screen; }
  .card.flipped .front::after{ animation: foil 1.8s .5s var(--ease) both; }
  .card.flipped:hover .front::after{ animation: foil 1.4s var(--ease); }
  @keyframes foil{ from{ background-position:120% 0; } to{ background-position:-120% 0; } }
  .num{ font-variant: small-caps; letter-spacing:.16em; color:var(--gold); font-size: calc(var(--cw) * .085); position:relative; z-index:1; }
  .art{ width:88%; height:auto; flex:1; min-height:0; position:relative; z-index:1; filter: drop-shadow(0 0 6px rgba(217,180,91,.35)); }
  .name{ font-variant: small-caps; letter-spacing:.12em; color:var(--gold-2); font-size: calc(var(--cw) * .085); text-align:center; line-height:1.1; white-space:nowrap; position:relative; z-index:1; }
  .card.dim{ opacity:.35; pointer-events:none; }

  .controls{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top: clamp(10px,2vh,22px); position:relative; z-index:3; }
  .controls button{ font:inherit; font-variant: small-caps; letter-spacing:.18em; font-size:clamp(.8rem,1.3vw,1rem); color:var(--gold-2); background:rgba(0,0,0,.28); border:1px solid rgba(217,180,91,.55); border-radius:999px; padding:.55em 1.5em; cursor:pointer; transition: background .3s, box-shadow .3s, transform .3s var(--ease), opacity .3s; }
  .controls button:hover{ background:rgba(217,180,91,.16); box-shadow:0 0 22px rgba(217,180,91,.25); transform:translateY(-1px); }
  .controls button:disabled{ opacity:.35; cursor:default; transform:none; box-shadow:none; background:rgba(0,0,0,.28); }
  .status{ text-align:center; color:var(--muted); font-style:italic; font-size:.85rem; margin-top:10px; min-height:1.4em; }
  footer{ text-align:center; color:rgba(201,165,140,.6); font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; padding:10px 16px 26px; position:relative; z-index:1; }

  @media (max-width:640px){
    :root{ --cw: clamp(78px, 26vw, 110px); }
    .reading{ max-width:100%; }
    .stage{ height: calc(var(--ch) * 1.6); }
  }
  @media (prefers-reduced-motion: reduce){
    .candle{ animation:none; }
    .card, .lift, .inner, .reading{ transition-duration:.01s !important; }
    .card.flipped .front::after, .card.flipped:hover .front::after{ animation:none; }
  }
</style>
</head>
<body>
<div class="candle" aria-hidden="true"></div>

<header>
  <h1>The Major Arcana</h1>
  <p>Twenty-two cards, one candle, three questions: what was, what is, what may be.</p>
  <div class="rule"></div>
</header>

<main>
  <section class="spread" aria-label="Three-card spread">
    <div class="col"><div class="slot" id="slot0"><span class="lbl">Past</span></div><div class="reading" id="read0"></div></div>
    <div class="col"><div class="slot" id="slot1"><span class="lbl">Present</span></div><div class="reading" id="read1"></div></div>
    <div class="col"><div class="slot" id="slot2"><span class="lbl">Future</span></div><div class="reading" id="read2"></div></div>
  </section>

  <div class="stage" id="stage" aria-label="Deck"></div>

  <div class="controls">
    <button type="button" id="shuffle">Shuffle</button>
    <button type="button" id="draw" disabled>Draw three</button>
    <button type="button" id="reset" disabled>Gather the deck</button>
  </div>
  <p class="status" id="status" aria-live="polite">Shuffle the deck to begin. You may also draw a single card from the fan.</p>
</main>
<footer>Original readings · inline SVG arcana · gold foil by CSS</footer>

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ARCANA = [
    ['0','The Fool','beginnings · faith · the leap','You stand at the cliff\'s edge with your bundle light and your eyes on the sky. Step; the ground has always appeared where the foot lands.','Recklessness is wearing the costume of freedom this week. Look down once before you leap, then leap.'],
    ['I','The Magician','will · craft · channel','Every tool you need is already on the table, arranged and waiting. Point upward, point downward, and the current runs through you.','Sleight of hand has replaced the work itself. Put the tricks away and make one true thing.'],
    ['II','The High Priestess','intuition · the veil · silence','The answer is behind the veil, and the veil is thin tonight. Sit still long enough and it will lift itself.','You have been shouting over your own intuition. Turn the volume down; something has been trying to speak.'],
    ['III','The Empress','abundance · nurture · growth','Abundance is not coming; it is here, ripening in plain sight. Tend it with your hands and it will feed more than you.','Care has curdled into control, or gone dry from neglect. Nourish yourself before you try to grow anything else.'],
    ['IV','The Emperor','structure · authority · order','Structure is a kindness you give your future self. Build the frame now, and let the wild things climb it later.','The rules have outlived the reason they were made. Question the throne, especially if you are sitting on it.'],
    ['V','The Hierophant','tradition · teaching · the key','Tradition holds a key you have not tried yet. Learn the old form before you break it.','The ceremony has hollowed out; you are kneeling to a habit. Find a truer teacher, even if it is yourself.'],
    ['VI','The Lovers','union · choice · harmony','A choice arrives dressed as another person. Choose with the whole heart, and the two roads become one.','Something between you and another has slipped out of tune. Speak the quiet thing before it becomes the loud thing.'],
    ['VII','The Chariot','drive · control · victory','Two forces pull in different directions and you hold both reins. Victory here is not speed but steadiness.','You are driving hard toward a destination you have not questioned. Slow down enough to read the signposts.'],
    ['VIII','Strength','courage · patience · gentleness','The lion does not need to be conquered, only met. Gentleness that does not flinch is the rarest power.','Doubt has been gnawing at your resolve. Remember the times you were braver than you felt.'],
    ['IX','The Hermit','solitude · search · the lantern','Withdraw, not to escape, but to hear. The lantern shows only the next step, and that is enough.','Solitude has thickened into isolation. Leave the cave with what you learned and let someone see your light.'],
    ['X','Wheel of Fortune','cycles · fate · turning','The wheel turns and your place on it changes. Fortune favours those who ride the rise without gripping the rim.','A cycle is dragging you round again. Notice the pattern; naming it is how you finally step off.'],
    ['XI','Justice','truth · balance · consequence','Cause and consequence are meeting at last, and the scales are honest. Act as though the truth will be read aloud.','An imbalance has been tolerated too long. Own your part, and let the rest be weighed fairly.'],
    ['XII','The Hanged Man','surrender · suspension · new sight','Surrender is not defeat; it is a new angle on the same sky. Hang a while and let understanding arrive upside down.','You are stalling and calling it patience. The pause has done its work — come down from the tree.'],
    ['XIII','Death','endings · release · renewal','Something is ending so completely that it cannot be repaired, only released. Grieve it, then notice the horizon lightening.','You are clutching a season that has already passed. Refusing the ending only delays the beginning.'],
    ['XIV','Temperance','balance · alchemy · patience','Pour patiently from one vessel to the other until the two become a third thing. Balance is a practice, not a state.','Excess in one cup, drought in the other. Find the middle path before the imbalance chooses for you.'],
    ['XV','The Devil','bondage · desire · illusion','The chains are loose enough to slip, and you know it. Name what binds you and watch it lose its glamour.','You are already loosening a grip that once felt permanent. Freedom looks smaller than expected and is worth more.'],
    ['XVI','The Tower','upheaval · revelation · collapse','What was built on a false foundation is falling, and the lightning is a mercy. Let it fall; you will rebuild on rock.','You feel the tremor and are propping up the walls. Better to leave before the roof teaches you the lesson.'],
    ['XVII','The Star','hope · renewal · clarity','After the storm, the sky is clear and the water is sweet. Hope is not naive here; it is accurate.','Faith has dimmed, and the well seems far. The star is still there — you have only stopped looking up.'],
    ['XVIII','The Moon','illusion · dreams · the path','Not everything you see tonight is true, and not everything true can be seen. Trust the path, not the shadows beside it.','Confusion is lifting like fog at dawn. What frightened you was mostly shape and silhouette.'],
    ['XIX','The Sun','joy · vitality · openness','Joy without asterisk, warmth without agenda. Stand in the open and let yourself be seen.','The light is there but you are squinting at it. Let the small happiness be enough for today.'],
    ['XX','Judgement','awakening · reckoning · the call','A call sounds and something in you rises to answer. Forgive what needs forgiving, then step into the next life.','You are judging yourself by a verdict long overturned. Hear the call as invitation, not indictment.'],
    ['XXI','The World','completion · wholeness · return','The circle closes and you are standing at its centre, whole. Celebrate — then notice the next circle beginning.','Completion is close but a loose thread remains. Finish it properly; shortcuts here will unravel later.']
  ];

  const stage = document.getElementById('stage'), status = document.getElementById('status');
  const bShuffle = document.getElementById('shuffle'), bDraw = document.getElementById('draw'), bReset = document.getElementById('reset');
  const slots = [0, 1, 2].map(i => document.getElementById('slot' + i));
  const reads = [0, 1, 2].map(i => document.getElementById('read' + i));
  const cards = [];
  let order = [], fanned = false, drawn = [], busy = false;

  ARCANA.forEach(([num, name], i) => {
    const el = document.createElement('div');
    el.className = 'card'; el.dataset.i = i; el.setAttribute('role', 'button'); el.setAttribute('tabindex', '0'); el.setAttribute('aria-label', 'Draw ' + name);
    el.innerHTML = `<div class="lift"><div class="inner">
      <div class="face back"><svg viewBox="0 0 120 200" preserveAspectRatio="none" aria-hidden="true"><use href="#cardBack"/></svg></div>
      <div class="face front"><div class="num">${num}</div>
        <svg class="art" viewBox="0 0 120 160" fill="none" stroke="#d9b45b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#a${i}"/></svg>
        <div class="name">${name}</div></div></div></div>`;
    stage.appendChild(el); cards.push(el);
  });

  const cardSize = () => ({ w: cards[0].offsetWidth, h: cards[0].offsetHeight });

  function stackAll(){
    cards.forEach((c, i) => { c.style.transitionDelay = '0ms'; c.style.transform = `translateY(${(cardSize().h * .3).toFixed(1)}px) rotate(${((i % 5) - 2) * .6}deg) translate(${(i % 3) * .4}px, ${-i * .35}px)`; c.style.zIndex = i; });
  }
  function fanAll(){
    const { h } = cardSize(); const R = h * 2.6, avail = Math.min(stage.clientWidth, window.innerWidth) - 30;
    const total = Math.min(80, 2 * Math.asin(Math.min(1, avail / 2 / R)) * 180 / Math.PI);
    const per = total / (order.length - 1 || 1);
    order.forEach((idx, p) => {
      const c = cards[idx]; if(c.classList.contains('drawn')) return;
      c.style.transitionDelay = (p * 22) + 'ms';
      c.style.transform = `rotate(${((p - (order.length - 1) / 2) * per).toFixed(2)}deg)`;
      c.style.zIndex = p + 1;
    });
  }
  function placeDrawn(){
    const { h } = cardSize(); const sr = stage.getBoundingClientRect();
    const cx = sr.left + sr.width / 2, cy = sr.top + 10 + h / 2;
    drawn.forEach(({ card, slot }) => {
      const r = slots[slot].getBoundingClientRect();
      card.style.transitionDelay = '0ms';
      card.style.transform = `translate(${(r.left + r.width / 2 - cx).toFixed(1)}px, ${(r.top + r.height / 2 - cy).toFixed(1)}px)`;
      card.style.zIndex = 200 + slot;
    });
  }

  function shuffle(){
    if(busy) return; busy = true;
    order = ARCANA.map((_, i) => i);
    for(let i = order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    cards.forEach(c => c.classList.remove('dim'));
    stackAll();
    status.textContent = 'Shuffling…';
    setTimeout(() => { fanAll(); fanned = true; bDraw.disabled = false; bReset.disabled = false; status.textContent = 'Choose "Draw three", or pick any card from the fan.'; busy = false; }, reduce ? 20 : 500);
  }

  function drawCard(card, reversed){
    if(!fanned || card.classList.contains('drawn') || drawn.length >= 3) return false;
    const slot = drawn.length; const i = +card.dataset.i; const [num, name, kw, up, rev] = ARCANA[i];
    card.classList.add('drawn'); if(reversed) card.classList.add('rev');
    card.setAttribute('aria-label', `${name}, ${reversed ? 'reversed' : 'upright'}`); card.removeAttribute('role'); card.setAttribute('tabindex', '-1');
    drawn.push({ card, slot, reversed });
    placeDrawn();
    setTimeout(() => card.classList.add('flipped'), reduce ? 10 : 850);
    setTimeout(() => {
      slots[slot].classList.add('filled');
      reads[slot].innerHTML = `<h3>${num} · ${name}</h3><p class="or${reversed ? ' rev' : ''}">${reversed ? 'Reversed' : 'Upright'}</p><p>${reversed ? rev : up}</p><span class="kw">${kw}</span>`;
      reads[slot].classList.add('show');
    }, reduce ? 20 : 1350);
    if(drawn.length === 3){ bDraw.disabled = true; setTimeout(() => { cards.forEach(c => { if(!c.classList.contains('drawn')) c.classList.add('dim'); }); status.textContent = 'The spread is complete. Gather the deck to ask again.'; }, reduce ? 30 : 1500); }
    else status.textContent = `${['Past', 'Present', 'Future'][slot]} drawn. ${3 - drawn.length} to go.`;
    return true;
  }

  function drawThree(){
    if(busy || !fanned) return; busy = true;
    const pool = order.filter(i => !cards[i].classList.contains('drawn'));
    const need = 3 - drawn.length; let k = 0;
    const picks = []; while(picks.length < need && pool.length){ picks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]); }
    (function next(){ if(k >= picks.length){ busy = false; return; } drawCard(cards[picks[k++]], Math.random() < .3); setTimeout(next, reduce ? 30 : 650); })();
  }

  function reset(){
    if(busy) return; busy = true;
    cards.forEach(c => { c.classList.remove('flipped', 'dim'); });
    reads.forEach(r => r.classList.remove('show')); slots.forEach(s => s.classList.remove('filled'));
    setTimeout(() => {
      cards.forEach((c, i) => { c.classList.remove('drawn', 'rev'); c.setAttribute('role', 'button'); c.setAttribute('tabindex', '0'); c.setAttribute('aria-label', 'Draw ' + ARCANA[i][1]); });
      drawn = []; fanned = false; stackAll(); bDraw.disabled = true; bReset.disabled = true;
      status.textContent = 'The deck is gathered. Shuffle to begin again.'; busy = false;
    }, reduce ? 20 : 700);
  }

  stage.addEventListener('click', e => { const c = e.target.closest('.card'); if(c && fanned && !busy) drawCard(c, Math.random() < .3); });
  stage.addEventListener('keydown', e => { if((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')){ e.preventDefault(); if(fanned && !busy) drawCard(e.target, Math.random() < .3); } });
  bShuffle.addEventListener('click', shuffle); bDraw.addEventListener('click', drawThree); bReset.addEventListener('click', reset);
  window.addEventListener('resize', () => { if(fanned) fanAll(); else stackAll(); placeDrawn(); });

  stackAll();
})();
</script>
</body>
</html>
