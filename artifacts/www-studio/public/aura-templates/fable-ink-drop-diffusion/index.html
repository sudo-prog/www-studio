<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sumi — Ink Drops in Still Water</title>
<style>
  :root {
    --ink: #1f2a6b;
    --fg: #2a2723;
    --muted: rgba(42, 39, 35, .55);
    --line: rgba(42, 39, 35, .22);
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #e7edf0; color: var(--fg);
    font-family: Georgia, "Iowan Old Style", Palatino, "Book Antiqua", ui-serif, serif;
    overflow: hidden; -webkit-font-smoothing: antialiased;
    touch-action: none; cursor: crosshair;
  }
  canvas { position: fixed; inset: 0; display: block; }
  #bg { z-index: 0; }
  #ink { z-index: 1; mix-blend-mode: multiply; }

  .title {
    position: fixed; top: clamp(18px, 4vh, 44px); left: clamp(18px, 3.5vw, 48px); z-index: 3;
    display: flex; gap: 14px; align-items: flex-start; pointer-events: none;
  }
  .title .rule {
    width: 1px; height: clamp(120px, 24vh, 220px);
    background: linear-gradient(180deg, var(--fg), transparent);
    position: relative;
  }
  .title .rule::before { content: ""; position: absolute; top: -3px; left: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); transition: background 1s; }
  .title .vert {
    writing-mode: vertical-rl; text-orientation: mixed;
    font-size: clamp(13px, 1.3vw, 16px); letter-spacing: .34em; color: var(--muted);
    margin: 0; line-height: 1;
  }
  .title h1 { margin: 0; font-weight: 400; font-size: clamp(22px, 2.6vw, 34px); letter-spacing: .02em; line-height: 1.05; }
  .title h1 span { display: block; font-size: .42em; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); margin-top: 10px; font-family: ui-sans-serif, system-ui, sans-serif; }

  .hint {
    position: fixed; left: 50%; top: 50%; z-index: 3; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; color: var(--muted);
    font-style: italic; font-size: clamp(15px, 1.6vw, 20px); letter-spacing: .04em;
    transition: opacity 1.6s var(--ease); animation: breathe 5s ease-in-out infinite;
  }
  .hint.gone { opacity: 0; animation: none; }
  @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  .ui {
    position: fixed; left: 50%; bottom: clamp(16px, 3.5vh, 36px); z-index: 4; transform: translateX(-50%);
    display: flex; align-items: center; gap: clamp(10px, 2vw, 22px); flex-wrap: wrap; justify-content: center;
    padding: 10px 16px; border-radius: 999px;
    background: rgba(255,255,255,.35); border: 1px solid rgba(255,255,255,.55);
    backdrop-filter: blur(8px);
    box-shadow: 0 20px 40px -24px rgba(30,30,40,.45);
    cursor: auto; max-width: calc(100vw - 20px);
  }
  .swatches { display: flex; gap: 10px; }
  .swatches button {
    width: 26px; height: 26px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
    background: var(--c); position: relative;
    transition: transform .4s var(--ease), box-shadow .4s var(--ease);
    box-shadow: inset 0 -3px 6px rgba(0,0,0,.25), inset 0 2px 3px rgba(255,255,255,.25);
  }
  .swatches button::after {
    content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid var(--fg);
    opacity: 0; transform: scale(.8); transition: opacity .3s, transform .4s var(--ease);
  }
  .swatches button:hover { transform: translateY(-2px); }
  .swatches button[aria-pressed="true"]::after { opacity: .6; transform: none; }
  .sep { width: 1px; height: 22px; background: var(--line); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button, .btn {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); background: transparent; border: 0; padding: 8px 14px; cursor: pointer;
    transition: color .3s, background .3s;
  }
  .seg button:hover, .btn:hover { color: var(--fg); }
  .seg button[aria-pressed="true"] { color: #f4f1ea; background: var(--fg); }
  .btn { border: 1px solid var(--line); border-radius: 999px; }
  .btn.busy { color: var(--fg); animation: fadepulse 1.6s ease-in-out infinite; }
  @keyframes fadepulse { 50% { opacity: .35; } }

  .count { position: fixed; right: clamp(18px, 3.5vw, 48px); bottom: clamp(18px, 4vh, 44px); z-index: 3; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; pointer-events: none; }

  @media (max-width: 560px) {
    .title .vert { display: none; }
    .count { display: none; }
    .ui { gap: 10px; padding: 8px 12px; }
    .seg button, .btn { padding: 8px 10px; font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint { animation: none; }
    .btn.busy { animation: none; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="ink" role="img" aria-label="Ink blooming in water. Click or tap to drop ink."></canvas>

<div class="title">
  <p class="vert">墨 · still water · slow breath</p>
  <div class="rule"></div>
  <h1>Sumi<span>ink drops in water</span></h1>
</div>

<p class="hint" id="hint">touch the water</p>

<nav class="ui" aria-label="Ink controls">
  <div class="swatches" role="group" aria-label="Ink colour">
    <button type="button" data-ink="#1f2a6b" style="--c:#1f2a6b" aria-label="Indigo" aria-pressed="true"></button>
    <button type="button" data-ink="#c8402a" style="--c:#c8402a" aria-label="Vermilion" aria-pressed="false"></button>
    <button type="button" data-ink="#6b4a2b" style="--c:#6b4a2b" aria-label="Sepia" aria-pressed="false"></button>
    <button type="button" data-ink="#14141a" style="--c:#14141a" aria-label="Black" aria-pressed="false"></button>
    <button type="button" data-ink="#157a7a" style="--c:#157a7a" aria-label="Teal" aria-pressed="false"></button>
  </div>
  <span class="sep"></span>
  <div class="seg" role="group" aria-label="Medium">
    <button type="button" data-medium="water" aria-pressed="true">Water</button>
    <button type="button" data-medium="paper" aria-pressed="false">Paper</button>
  </div>
  <button type="button" class="btn" id="drain">Drain</button>
</nav>
<div class="count" id="count">0 drops</div>

<script>
(function () {
  'use strict';
  const bg = document.getElementById('bg'), bctx = bg.getContext('2d');
  const ink = document.getElementById('ink'), ictx = ink.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const state = { color: '#1f2a6b', medium: 'water', drops: [], count: 0, draining: 0, time: 0 };
  let W = 0, H = 0, dpr = 1;

  /* ---------- value noise (3D) & curl ---------- */
  const PERM = new Uint8Array(512);
  (function () { const p = []; for (let i = 0; i < 256; i++) p[i] = i; for (let i = 255; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; })();
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + (b - a) * t;
  function grad(h, x, y, z) {
    switch (h & 15) {
      case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y;
      case 4: return x + z; case 5: return -x + z; case 6: return x - z; case 7: return -x - z;
      case 8: return y + z; case 9: return -y + z; case 10: return y - z; case 11: return -y - z;
      case 12: return y + x; case 13: return -y + z; case 14: return y - x; default: return -y - z;
    }
  }
  function noise(x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const A = PERM[X] + Y, AA = PERM[A] + Z, AB = PERM[A + 1] + Z, B = PERM[X + 1] + Y, BA = PERM[B] + Z, BB = PERM[B + 1] + Z;
    return lerp(
      lerp(lerp(grad(PERM[AA], x, y, z), grad(PERM[BA], x - 1, y, z), u), lerp(grad(PERM[AB], x, y - 1, z), grad(PERM[BB], x - 1, y - 1, z), u), v),
      lerp(lerp(grad(PERM[AA + 1], x, y, z - 1), grad(PERM[BA + 1], x - 1, y, z - 1), u), lerp(grad(PERM[AB + 1], x, y - 1, z - 1), grad(PERM[BB + 1], x - 1, y - 1, z - 1), u), v), w);
  }
  function curl(x, y, t, scale, out) {
    const e = .5, s = 1 / scale;
    const n1 = noise(x * s, (y + e) * s, t), n2 = noise(x * s, (y - e) * s, t);
    const n3 = noise((x + e) * s, y * s, t), n4 = noise((x - e) * s, y * s, t);
    out[0] = (n1 - n2) / (2 * e); out[1] = -(n3 - n4) / (2 * e);
  }
  const tmp = [0, 0];

  /* ---------- brush sprites ---------- */
  const sprites = new Map();
  function sprite(color, soft) {
    const key = color + soft;
    if (sprites.has(key)) return sprites.get(key);
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    const [r, gg, b] = [parseInt(color.slice(1, 3), 16), parseInt(color.slice(3, 5), 16), parseInt(color.slice(5, 7), 16)];
    g.addColorStop(0, `rgba(${r},${gg},${b},1)`);
    g.addColorStop(soft ? .25 : .55, `rgba(${r},${gg},${b},${soft ? .6 : .85})`);
    g.addColorStop(1, `rgba(${r},${gg},${b},0)`);
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    sprites.set(key, c);
    return c;
  }

  /* ---------- backgrounds ---------- */
  function paintBackground() {
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state.medium === 'water') {
      const g = bctx.createRadialGradient(W * .5, H * .4, 0, W * .5, H * .5, Math.max(W, H) * .8);
      g.addColorStop(0, '#f1f5f6'); g.addColorStop(.6, '#e3eaee'); g.addColorStop(1, '#cfd9df');
      bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
      // faint caustic ripples
      bctx.globalAlpha = .06; bctx.strokeStyle = '#ffffff'; bctx.lineWidth = 1.2;
      for (let i = 0; i < 40; i++) {
        const cx = Math.random() * W, cy = Math.random() * H, r = 40 + Math.random() * 240;
        bctx.beginPath(); bctx.ellipse(cx, cy, r, r * .55, Math.random() * 3, 0, 6.283); bctx.stroke();
      }
      bctx.globalAlpha = 1;
      document.body.style.background = '#e7edf0';
    } else {
      bctx.fillStyle = '#f3ead8'; bctx.fillRect(0, 0, W, H);
      // fibres
      const n = Math.floor((W * H) / 900);
      for (let i = 0; i < n; i++) {
        const x = Math.random() * W, y = Math.random() * H, len = 6 + Math.random() * 26, a = Math.random() * Math.PI;
        bctx.strokeStyle = Math.random() < .5 ? 'rgba(120, 95, 60, .12)' : 'rgba(255,255,255,.35)';
        bctx.lineWidth = .6 + Math.random() * .8;
        bctx.beginPath(); bctx.moveTo(x, y); bctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); bctx.stroke();
      }
      // mottling
      for (let i = 0; i < 60; i++) {
        const g = bctx.createRadialGradient(Math.random() * W, Math.random() * H, 0, Math.random() * W, Math.random() * H, 120 + Math.random() * 300);
        g.addColorStop(0, 'rgba(200, 170, 120, .10)'); g.addColorStop(1, 'rgba(200,170,120,0)');
        bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
      }
      document.body.style.background = '#f3ead8';
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    const keep = document.createElement('canvas'); keep.width = ink.width || 1; keep.height = ink.height || 1;
    keep.getContext('2d').drawImage(ink, 0, 0);
    for (const c of [bg, ink]) { c.width = Math.floor(W * dpr); c.height = Math.floor(H * dpr); }
    ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ictx.drawImage(keep, 0, 0, keep.width / dpr, keep.height / dpr);
    paintBackground();
  }
  addEventListener('resize', resize);
  resize();

  /* ---------- drops ---------- */
  function drop(x, y) {
    const paper = state.medium === 'paper';
    const budget = Math.min(1, (W * H) / 1.6e6);
    const n = Math.floor((paper ? 380 : 620) * (0.45 + budget * .55));
    const parts = [];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, r = Math.pow(Math.random(), .5) * 6;
      const speed = paper ? 14 + Math.random() * 26 : 30 + Math.random() * 90;
      parts.push({
        x: x + Math.cos(a) * r, y: y + Math.sin(a) * r,
        vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        life: paper ? 3 + Math.random() * 4 : 4 + Math.random() * 6, age: 0,
        size: paper ? 4 + Math.random() * 7 : 1.6 + Math.random() * 3.2,
        seed: Math.random() * 1000
      });
    }
    state.drops.push({ parts, color: state.color, paper, x, y, born: state.time });
    state.count++;
    document.getElementById('count').textContent = state.count + (state.count === 1 ? ' drop' : ' drops');
    document.getElementById('hint').classList.add('gone');
    // dense core
    ictx.globalCompositeOperation = 'multiply';
    const sp = sprite(state.color, paper);
    for (let i = 0; i < (paper ? 18 : 30); i++) {
      const a = Math.random() * 6.283, r = Math.random() * (paper ? 10 : 6), s = paper ? 26 : 14;
      ictx.globalAlpha = paper ? .10 : .22;
      ictx.drawImage(sp, x + Math.cos(a) * r - s / 2, y + Math.sin(a) * r - s / 2, s, s);
    }
    ictx.globalAlpha = 1;
  }

  ink.addEventListener('pointerdown', e => { drop(e.clientX, e.clientY); });
  let dragLast = 0;
  ink.addEventListener('pointermove', e => {
    if (e.buttons !== 1 || e.pointerType === 'touch') return;
    if (performance.now() - dragLast > 220) { dragLast = performance.now(); drop(e.clientX, e.clientY); }
  });

  /* ---------- simulation ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000) || .016; last = now;
    state.time += dt;
    const t = state.time;

    // the whole water slowly swirls: re-draw the ink onto itself with a tiny rotation & drift
    if (state.medium === 'water' && !reduced && (state.drops.length || state.count)) {
      ictx.globalCompositeOperation = 'copy';
      ictx.save();
      ictx.translate(W / 2 + Math.sin(t * .13) * .08, H / 2 + Math.cos(t * .11) * .08);
      ictx.rotate(.00022 + Math.sin(t * .05) * .00012);
      ictx.scale(1.0004, 1.0004);
      ictx.drawImage(ink, -W / 2, -H / 2, W, H);
      ictx.restore();
    }

    if (state.draining) {
      ictx.globalCompositeOperation = 'destination-out';
      ictx.fillStyle = `rgba(0,0,0,${reduced ? .08 : .018})`;
      ictx.fillRect(0, 0, W, H);
      state.draining -= dt;
      if (state.draining <= 0) {
        ictx.clearRect(0, 0, W, H);
        state.drops.length = 0; state.count = 0;
        document.getElementById('count').textContent = '0 drops';
        document.getElementById('drain').classList.remove('busy');
      }
    }

    ictx.globalCompositeOperation = 'multiply';
    for (let d = state.drops.length - 1; d >= 0; d--) {
      const drp = state.drops[d];
      const sp = sprite(drp.color, drp.paper);
      const parts = drp.parts;
      let alive = 0;
      for (const p of parts) {
        if (p.age >= p.life) continue;
        alive++;
        p.age += dt;
        const k = p.age / p.life;
        // curl noise advection: fine tendrils + coarse swirl
        curl(p.x + p.seed, p.y, t * .12 + p.seed * .01, drp.paper ? 26 : 42, tmp);
        const fine = drp.paper ? 26 : 64;
        let ax = tmp[0] * fine, ay = tmp[1] * fine;
        curl(p.x, p.y, t * .04, 240, tmp);
        ax += tmp[0] * 30; ay += tmp[1] * 30;
        // global water rotation about the centre
        if (!drp.paper) { const dx = p.x - W / 2, dy = p.y - H / 2; ax += -dy * .015; ay += dx * .015; }
        const friction = drp.paper ? .90 : .965;
        p.vx = (p.vx + ax * dt * 6) * Math.pow(friction, dt * 60);
        p.vy = (p.vy + ay * dt * 6) * Math.pow(friction, dt * 60);
        p.x += p.vx * dt; p.y += p.vy * dt;
        const size = p.size * (drp.paper ? (1 + k * 2.2) : (1 + k * 1.4));
        const alpha = drp.paper ? .045 * (1 - k) : .05 * (1 - k * k);
        ictx.globalAlpha = alpha;
        ictx.drawImage(sp, p.x - size, p.y - size, size * 2, size * 2);
      }
      if (!alive) state.drops.splice(d, 1);
    }
    ictx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- controls ---------- */
  document.querySelectorAll('[data-ink]').forEach(b => b.addEventListener('click', () => {
    state.color = b.dataset.ink;
    document.querySelectorAll('[data-ink]').forEach(x => x.setAttribute('aria-pressed', x === b));
    document.documentElement.style.setProperty('--ink', state.color);
  }));
  document.querySelectorAll('[data-medium]').forEach(b => b.addEventListener('click', () => {
    state.medium = b.dataset.medium;
    document.querySelectorAll('[data-medium]').forEach(x => x.setAttribute('aria-pressed', x === b));
    paintBackground();
  }));
  document.getElementById('drain').addEventListener('click', e => {
    if (state.draining > 0) return;
    state.draining = reduced ? 2 : 7;
    e.currentTarget.classList.add('busy');
  });
  addEventListener('keydown', e => {
    if (e.key >= '1' && e.key <= '5') document.querySelectorAll('[data-ink]')[+e.key - 1].click();
    if (e.key === 'd' || e.key === 'D') document.getElementById('drain').click();
    if (e.key === 'p' || e.key === 'P') document.querySelector('[data-medium="' + (state.medium === 'water' ? 'paper' : 'water') + '"]').click();
  });
})();
</script>
</body>
</html>
