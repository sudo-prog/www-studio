<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abyssal — Bioluminescent Deep Sea</title>
<style>
  :root{
    --ink:#c9dcf0;
    --dim:rgba(201,220,240,.42);
    --sans:ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#020611;color:var(--ink);font-family:var(--sans)}
  body{background:linear-gradient(180deg,#04102a 0%,#030b1d 35%,#020611 100%)}
  canvas#sea{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,2,10,.65) 100%)}

  .title{position:fixed;left:clamp(18px,4vw,56px);top:clamp(18px,4vw,48px);pointer-events:none}
  .title h1{margin:0;font-weight:200;font-size:clamp(20px,2.6vw,34px);letter-spacing:.62em;text-transform:uppercase;color:var(--ink);text-indent:.1em;
    text-shadow:0 0 24px rgba(120,190,255,.35)}
  .title p{margin:8px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}

  .hud{position:fixed;left:clamp(18px,4vw,56px);right:clamp(18px,4vw,56px);bottom:clamp(18px,4vw,40px);display:flex;justify-content:space-between;align-items:flex-end;gap:14px;pointer-events:none;flex-wrap:wrap}
  .hud .l,.hud .r{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);line-height:1.9}
  .hud .r{text-align:right}
  .hud b{font-weight:400;color:var(--ink)}
  .depth{font-family:var(--mono);font-size:clamp(14px,1.6vw,20px);letter-spacing:.14em;color:var(--ink);font-weight:300}
  .bar{width:120px;height:1px;background:rgba(201,220,240,.2);margin:6px 0 4px;position:relative;overflow:hidden}
  .bar::after{content:"";position:absolute;left:0;top:0;height:100%;width:40%;background:linear-gradient(90deg,transparent,#8fd3ff,transparent);animation:sweep 6s linear infinite}
  @keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

  .palette{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
  .palette i{width:8px;height:8px;border-radius:50%;display:block;box-shadow:0 0 8px currentColor;background:currentColor}
  .hint{position:fixed;left:50%;bottom:clamp(64px,10vh,110px);transform:translateX(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);pointer-events:none;
    opacity:1;transition:opacity 1.6s ease;white-space:nowrap}
  .hint.gone{opacity:0}
  @media (max-width:520px){.hint{font-size:9px;letter-spacing:.2em;white-space:normal;text-align:center;width:86%;line-height:1.8}}
  @media (prefers-reduced-motion:reduce){.bar::after{animation:none}.hint{transition:none}}
</style>
</head>
<body>
<canvas id="sea" aria-label="Animated deep-sea scene with bioluminescent jellyfish and plankton. Move to stir the water, click to release a jellyfish."></canvas>
<div class="vignette"></div>

<div class="title">
  <h1>Abyssal</h1>
  <p>Bathypelagic zone · no sunlight reaches here</p>
</div>

<p class="hint" id="hint">Move to stir the water · click to release a jellyfish</p>

<div class="hud">
  <div class="l">
    <div class="depth" id="depth">−3 400 m</div>
    <div class="bar"></div>
    <div>Temp <b>2.1 °C</b> · Pressure <b>341 atm</b></div>
  </div>
  <div class="r">
    <div>Medusae <b id="count">3</b> · Plankton <b id="pcount">0</b></div>
    <div>Emission spectrum</div>
    <div class="palette" aria-hidden="true">
      <i style="color:#4fe3ff"></i><i style="color:#3fd9c4"></i><i style="color:#6a7dff"></i><i style="color:#a56bff"></i>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  const canvas=document.getElementById('sea'), ctx=canvas.getContext('2d');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU=Math.PI*2;
  let W=1,H=1,dpr=1;
  const mouse={x:-9999,y:-9999,vx:0,vy:0,px:-9999,py:-9999,active:false};
  const HUES=[188,168,232,268]; // cyan, teal, ultramarine, violet
  const jellies=[], plankton=[], schools=[];
  const MAXJ=9;

  function resize(){
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize',resize); resize();

  /* ---------- Jellyfish ---------- */
  function Jelly(x,y,hue,r){
    this.x=x; this.y=y; this.hue=hue; this.r=r||(34+Math.random()*34);
    this.vx=0; this.vy=0; this.phase=Math.random()*TAU; this.rate=0.9+Math.random()*0.5;
    this.seed=Math.random()*100; this.born=0; this.age=0;
    this.tent=[]; this.arms=[];
    const nT=7+Math.floor(this.r/9);
    for(let i=0;i<nT;i++){
      const a=-0.15-0.7*(i/(nT-1))+Math.random()*0.02; // spread across the rim underside in normalized units
      const n=14+Math.floor(Math.random()*10), seg=this.r*0.22+Math.random()*4;
      const pts=[]; for(let j=0;j<n;j++) pts.push({x:x,y:y+j*seg,px:x,py:y+j*seg});
      this.tent.push({u:(i/(nT-1))*2-1,pts:pts,seg:seg,w:0.6+Math.random()*0.9});
    }
    for(let i=0;i<4;i++){
      const n=9, seg=this.r*0.3;
      const pts=[]; for(let j=0;j<n;j++) pts.push({x:x,y:y+j*seg,px:x,py:y+j*seg});
      this.arms.push({u:(i-1.5)*0.28,pts:pts,seg:seg});
    }
  }
  Jelly.prototype.update=function(dt,t){
    this.age+=dt;
    this.phase+=dt*this.rate*(reduced?0.6:1);
    const c=Math.cos(this.phase);
    const thrust=Math.max(0,-c)*this.r*0.9;
    this.vy-=thrust*dt;
    this.vy+=this.r*0.16*dt;                 // gentle sink between pulses
    this.vx+=Math.sin(t*0.27+this.seed)*4*dt+Math.sin(t*0.05+this.seed*2)*2*dt;
    const dr=Math.exp(-dt*0.9); this.vx*=dr; this.vy*=dr;
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    if(this.y<-this.r*4){ this.y=H+this.r*3; this.x=Math.random()*W; this.settle(); }
    if(this.x<-this.r*3) this.x=W+this.r*2; else if(this.x>W+this.r*3) this.x=-this.r*2;
    const s=1+0.13*Math.sin(this.phase);
    const rimY=this.y+this.r*0.32*s, bw=this.r*s;
    for(const T of this.tent){ this.verlet(T.pts,this.x+T.u*bw*0.9,rimY-Math.abs(T.u)*this.r*0.12,T.seg,dt,t,0.55); }
    for(const A of this.arms){ this.verlet(A.pts,this.x+A.u*bw,this.y+this.r*0.25*s,A.seg,dt,t,0.35); }
  };
  Jelly.prototype.settle=function(){
    for(const T of this.tent.concat(this.arms)) for(let j=0;j<T.pts.length;j++){ T.pts[j].x=T.pts[j].px=this.x; T.pts[j].y=T.pts[j].py=this.y+j*T.seg; }
  };
  Jelly.prototype.verlet=function(pts,ax,ay,seg,dt,t,sway){
    pts[0].x=ax; pts[0].y=ay;
    const g=0.05, damp=0.985;
    for(let j=1;j<pts.length;j++){
      const p=pts[j];
      const vx=(p.x-p.px)*damp, vy=(p.y-p.py)*damp;
      p.px=p.x; p.py=p.y;
      p.x+=vx+Math.sin(t*0.9+j*0.4+this.seed)*sway*dt*6;
      p.y+=vy+g;
      // cursor disturbance
      const dx=p.x-mouse.x, dy=p.y-mouse.y, d2=dx*dx+dy*dy;
      if(d2<14400){ const d=Math.sqrt(d2)||1, f=(1-d/120)*Math.min(30,Math.hypot(mouse.vx,mouse.vy))*0.02; p.x+=dx/d*f; p.y+=dy/d*f; }
    }
    for(let k=0;k<3;k++){
      for(let j=1;j<pts.length;j++){
        const a=pts[j-1], b=pts[j];
        let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.0001, diff=(d-seg)/d;
        if(j===1){ b.x-=dx*diff; b.y-=dy*diff; }
        else { a.x+=dx*diff*0.5; a.y+=dy*diff*0.5; b.x-=dx*diff*0.5; b.y-=dy*diff*0.5; }
      }
      pts[0].x=ax; pts[0].y=ay;
    }
  };
  Jelly.prototype.draw=function(){
    const s=1+0.13*Math.sin(this.phase), r=this.r, bw=r*s, bh=r*0.78/Math.sqrt(s);
    const h=this.hue, glow=0.55+0.45*Math.max(0,-Math.cos(this.phase));
    const fade=Math.min(1,this.age*0.6);
    ctx.globalCompositeOperation='lighter';
    // tentacles
    for(const T of this.tent){
      const p=T.pts; ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y);
      for(let j=1;j<p.length-1;j++){ const mx=(p[j].x+p[j+1].x)/2, my=(p[j].y+p[j+1].y)/2; ctx.quadraticCurveTo(p[j].x,p[j].y,mx,my); }
      const gr=ctx.createLinearGradient(0,p[0].y,0,p[p.length-1].y);
      gr.addColorStop(0,'hsla('+h+',90%,70%,'+(0.5*fade)+')'); gr.addColorStop(1,'hsla('+h+',90%,70%,0)');
      ctx.strokeStyle=gr; ctx.lineWidth=T.w; ctx.stroke();
    }
    // oral arms (ribbon-like, brighter)
    for(const A of this.arms){
      const p=A.pts; ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y);
      for(let j=1;j<p.length-1;j++){ const mx=(p[j].x+p[j+1].x)/2, my=(p[j].y+p[j+1].y)/2; ctx.quadraticCurveTo(p[j].x,p[j].y,mx,my); }
      const gr=ctx.createLinearGradient(0,p[0].y,0,p[p.length-1].y);
      gr.addColorStop(0,'hsla('+(h+15)+',95%,80%,'+(0.55*fade)+')'); gr.addColorStop(1,'hsla('+h+',90%,70%,0)');
      ctx.strokeStyle=gr; ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.stroke();
    }
    // halo
    let g=ctx.createRadialGradient(this.x,this.y,r*0.2,this.x,this.y,r*2.4);
    g.addColorStop(0,'hsla('+h+',90%,65%,'+(0.22*glow*fade)+')'); g.addColorStop(1,'hsla('+h+',90%,65%,0)');
    ctx.fillStyle=g; ctx.fillRect(this.x-r*2.4,this.y-r*2.4,r*4.8,r*4.8);
    // bell
    ctx.save(); ctx.translate(this.x,this.y); ctx.scale(bw,bh);
    g=ctx.createRadialGradient(0,-0.25,0.05,0,0,1);
    g.addColorStop(0,'hsla('+(h+10)+',100%,88%,'+(0.55*fade)+')');
    g.addColorStop(0.45,'hsla('+h+',95%,65%,'+(0.28*fade)+')');
    g.addColorStop(0.92,'hsla('+h+',90%,60%,'+(0.12*fade)+')');
    g.addColorStop(1,'hsla('+h+',90%,60%,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,1,Math.PI,0); ctx.bezierCurveTo(1,0.35,0.5,0.5,0,0.45); ctx.bezierCurveTo(-0.5,0.5,-1,0.35,-1,0); ctx.closePath(); ctx.fill();
    ctx.restore();
    // rim
    ctx.beginPath(); ctx.ellipse(this.x,this.y+bh*0.05,bw*0.98,bh*0.42,0,0,TAU);
    ctx.strokeStyle='hsla('+h+',100%,80%,'+(0.35*glow*fade)+')'; ctx.lineWidth=1.2; ctx.stroke();
    // inner organs: four small radial glows
    for(let i=0;i<4;i++){
      const a=i*TAU/4+Math.PI/4, ox=Math.cos(a)*bw*0.28, oy=Math.sin(a)*bh*0.16-bh*0.15;
      g=ctx.createRadialGradient(this.x+ox,this.y+oy,0,this.x+ox,this.y+oy,r*0.22);
      g.addColorStop(0,'hsla('+(h+20)+',100%,85%,'+(0.5*glow*fade)+')'); g.addColorStop(1,'hsla('+h+',100%,80%,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(this.x+ox,this.y+oy,r*0.22,0,TAU); ctx.fill();
    }
    // top specular
    g=ctx.createRadialGradient(this.x-bw*0.3,this.y-bh*0.55,0,this.x-bw*0.3,this.y-bh*0.55,r*0.5);
    g.addColorStop(0,'rgba(220,245,255,'+(0.28*fade)+')'); g.addColorStop(1,'rgba(220,245,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(this.x-bw*0.3,this.y-bh*0.55,r*0.5,0,TAU); ctx.fill();
    ctx.globalCompositeOperation='source-over';
  };

  function spawnJelly(x,y,hue,r){
    if(jellies.length>=MAXJ) jellies.shift();
    const j=new Jelly(x,y,hue,r); j.settle(); jellies.push(j);
    document.getElementById('count').textContent=jellies.length;
  }

  /* ---------- Plankton ---------- */
  const PN=reduced?90:190;
  for(let i=0;i<PN;i++) plankton.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,s:0.6+Math.random()*1.6,glow:0,ph:Math.random()*TAU,hue:HUES[i%4]+Math.random()*10});
  document.getElementById('pcount').textContent=PN;
  function updatePlankton(dt,t){
    const ms=Math.min(40,Math.hypot(mouse.vx,mouse.vy));
    for(const p of plankton){
      const cx=Math.sin(p.y*0.004+t*0.12)*7+3, cy=Math.cos(p.x*0.003+t*0.09)*3-2;
      p.vx+=(cx-p.vx)*dt*0.6+(Math.random()-0.5)*4*dt; p.vy+=(cy-p.vy)*dt*0.6+(Math.random()-0.5)*4*dt;
      const dx=p.x-mouse.x, dy=p.y-mouse.y, d2=dx*dx+dy*dy;
      if(d2<19600){ const d=Math.sqrt(d2)||1, f=(1-d/140)*(8+ms*3); p.vx+=dx/d*f*dt*6; p.vy+=dy/d*f*dt*6; p.glow=Math.min(1,p.glow+(1-d/140)*(0.4+ms*0.05)); }
      p.glow*=Math.exp(-dt*0.8);
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.x<-10) p.x=W+10; else if(p.x>W+10) p.x=-10;
      if(p.y<-10) p.y=H+10; else if(p.y>H+10) p.y=-10;
    }
  }
  function drawPlankton(t){
    ctx.globalCompositeOperation='lighter';
    for(const p of plankton){
      const tw=0.5+0.5*Math.sin(t*1.3+p.ph), a=0.18+0.35*tw+0.5*p.glow, rad=p.s*(1+p.glow*1.8);
      ctx.fillStyle='hsla('+p.hue+',100%,'+(70+p.glow*20)+'%,'+a+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,rad,0,TAU); ctx.fill();
      if(p.glow>0.05||tw>0.85){
        const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad*6);
        g.addColorStop(0,'hsla('+p.hue+',100%,75%,'+(0.25*(p.glow+tw*0.3))+')'); g.addColorStop(1,'hsla('+p.hue+',100%,75%,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,rad*6,0,TAU); ctx.fill();
      }
    }
    ctx.globalCompositeOperation='source-over';
  }

  /* ---------- Lantern fish ---------- */
  let nextSchool=8+Math.random()*10;
  function spawnSchool(){
    const dir=Math.random()<0.5?1:-1, n=10+Math.floor(Math.random()*12);
    const sc={x:dir>0?-160:W+160,y:H*(0.25+Math.random()*0.5),dir:dir,speed:60+Math.random()*50,fish:[],t:0};
    for(let i=0;i<n;i++) sc.fish.push({ox:-i*16*dir+(Math.random()-0.5)*40,oy:(Math.random()-0.5)*70,ph:Math.random()*TAU,sz:4+Math.random()*3});
    schools.push(sc);
  }
  function updateSchools(dt){
    nextSchool-=dt; if(nextSchool<=0){ spawnSchool(); nextSchool=18+Math.random()*20; }
    for(let i=schools.length-1;i>=0;i--){
      const s=schools[i]; s.t+=dt; s.x+=s.dir*s.speed*dt; s.y+=Math.sin(s.t*0.5)*12*dt;
      if((s.dir>0&&s.x>W+300)||(s.dir<0&&s.x<-300)) schools.splice(i,1);
    }
  }
  function drawSchools(t){
    for(const s of schools){
      for(const f of s.fish){
        const wig=Math.sin(t*9+f.ph), fx=s.x+f.ox, fy=s.y+f.oy+Math.sin(t*2+f.ph)*4, d=s.dir, sz=f.sz;
        ctx.globalCompositeOperation='source-over';
        ctx.fillStyle='rgba(20,40,70,.85)'; ctx.beginPath();
        ctx.moveTo(fx+d*sz*2.2,fy); ctx.quadraticCurveTo(fx,fy-sz*0.9,fx-d*sz*1.6,fy+wig*1.2); ctx.lineTo(fx-d*sz*2.6,fy-sz*0.9+wig*2); ctx.lineTo(fx-d*sz*2.6,fy+sz*0.9+wig*2); ctx.lineTo(fx-d*sz*1.6,fy+wig*1.2); ctx.quadraticCurveTo(fx,fy+sz*0.9,fx+d*sz*2.2,fy); ctx.fill();
        ctx.globalCompositeOperation='lighter';
        const g=ctx.createRadialGradient(fx+d*sz*0.9,fy+sz*0.3,0,fx+d*sz*0.9,fy+sz*0.3,sz*2.2);
        g.addColorStop(0,'rgba(140,235,255,.9)'); g.addColorStop(0.3,'rgba(90,200,255,.35)'); g.addColorStop(1,'rgba(90,200,255,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(fx+d*sz*0.9,fy+sz*0.3,sz*2.2,0,TAU); ctx.fill();
        ctx.fillStyle='rgba(120,220,255,.6)'; for(let k=1;k<4;k++){ ctx.beginPath(); ctx.arc(fx-d*sz*k*0.5,fy+sz*0.5,0.7,0,TAU); ctx.fill(); }
      }
    }
    ctx.globalCompositeOperation='source-over';
  }

  /* ---------- Light shaft ---------- */
  function drawShaft(t){
    ctx.globalCompositeOperation='lighter';
    const cx=W*0.62+Math.sin(t*0.08)*W*0.03;
    for(let i=0;i<3;i++){
      const w0=W*(0.03+i*0.04), w1=W*(0.16+i*0.1), sway=Math.sin(t*0.11+i)*W*0.02;
      const g=ctx.createLinearGradient(0,0,0,H*0.95);
      g.addColorStop(0,'rgba(80,140,210,'+(0.09-i*0.025)+')'); g.addColorStop(0.5,'rgba(60,110,180,'+(0.035-i*0.008)+')'); g.addColorStop(1,'rgba(40,80,150,0)');
      ctx.fillStyle=g; ctx.beginPath();
      ctx.moveTo(cx-w0+sway,-10); ctx.lineTo(cx+w0+sway,-10); ctx.lineTo(cx+w1-sway,H*0.95); ctx.lineTo(cx-w1-sway,H*0.95); ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  }

  /* ---------- Input ---------- */
  const hint=document.getElementById('hint');
  let hintHidden=false;
  function hideHint(){ if(!hintHidden){ hintHidden=true; hint.classList.add('gone'); } }
  canvas.addEventListener('pointermove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; });
  canvas.addEventListener('pointerleave',()=>{ mouse.x=mouse.y=-9999; mouse.active=false; });
  canvas.addEventListener('pointerdown',e=>{
    hideHint();
    spawnJelly(e.clientX,e.clientY,HUES[Math.floor(Math.random()*HUES.length)]+(Math.random()-0.5)*14,30+Math.random()*36);
    // ripple: shove nearby plankton
    for(const p of plankton){ const dx=p.x-e.clientX, dy=p.y-e.clientY, d=Math.hypot(dx,dy); if(d<220){ const f=(1-d/220)*120; p.vx+=dx/d*f; p.vy+=dy/d*f; p.glow=1; } }
  });
  setTimeout(hideHint,9000);

  /* ---------- Loop ---------- */
  for(let i=0;i<3;i++) spawnJelly(W*(0.2+i*0.3),H*(0.3+Math.random()*0.4),HUES[i],40+Math.random()*24);
  let last=performance.now(), t=0;
  const depthEl=document.getElementById('depth');
  function frame(now){
    requestAnimationFrame(frame);
    let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05;
    t+=dt;
    mouse.vx=(mouse.x-mouse.px)/Math.max(dt,0.001)*0.016; mouse.vy=(mouse.y-mouse.py)/Math.max(dt,0.001)*0.016;
    if(mouse.px<-9000||mouse.x<-9000){ mouse.vx=mouse.vy=0; }
    mouse.px=mouse.x; mouse.py=mouse.y;

    ctx.clearRect(0,0,W,H);
    drawShaft(t);
    updatePlankton(dt,t); drawPlankton(t);
    updateSchools(dt); drawSchools(t);
    jellies.sort((a,b)=>a.r-b.r);
    for(const j of jellies){ j.update(dt,t); j.draw(); }
    if((now/1000|0)%2===0) depthEl.textContent='−3 '+(400+Math.round(Math.sin(t*0.07)*6)).toString().padStart(3,'0')+' m';
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
