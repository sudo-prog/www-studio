<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Softdesk 4 — Neumorphic Audio Console</title>
<style>
  :root {
    --surface: #e0e5ec;
    --surface-2: #e6ebf2;
    --light: #ffffff;
    --dark: #a3b1c6;
    --dark-2: #8d9bb0;
    --ink: #3d4a5c;
    --ink-soft: #6b7a90;
    --ink-faint: #97a4b8;
    --accent: #ff7a59;
    --accent-2: #4fd1c5;
    --led-green: #5ee36a;
    --led-amber: #ffc857;
    --led-red: #ff4d4d;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
    --out: 9px 9px 18px var(--dark), -9px -9px 18px var(--light);
    --out-sm: 5px 5px 10px var(--dark), -5px -5px 10px var(--light);
    --in: inset 6px 6px 12px var(--dark), inset -6px -6px 12px var(--light);
    --in-sm: inset 3px 3px 6px var(--dark), inset -3px -3px 6px var(--light);
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(20px, 4vw, 48px) clamp(14px, 3vw, 36px) 60px;
  }

  /* ---------- Header ---------- */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo-badge {
    width: 52px; height: 52px; border-radius: 16px;
    display: grid; place-items: center;
    background: var(--surface);
    box-shadow: var(--out-sm);
  }
  .logo-badge svg { display: block; }
  .logo h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .logo p { margin: 2px 0 0; font-size: 12px; color: var(--ink-soft); }

  .readout {
    display: flex;
    gap: 14px;
    padding: 12px 18px;
    border-radius: 18px;
    background: var(--surface);
    box-shadow: var(--in);
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-soft);
  }
  .readout b { color: var(--ink); font-weight: 600; }

  /* ---------- Layout ---------- */
  .console {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr)) 1.4fr;
    gap: 22px;
  }

  .strip, .master {
    background: var(--surface);
    border-radius: 28px;
    box-shadow: var(--out);
    padding: 22px 16px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .strip-name {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    text-align: center;
  }
  .strip-name b { display: block; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--ink); font-weight: 600; margin-top: 3px; }

  /* ---------- Knob ---------- */
  .knob-block { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .knob {
    --angle: -135deg;
    position: relative;
    width: 72px; height: 72px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--surface-2), #d3d9e2);
    box-shadow: var(--out-sm);
    cursor: ns-resize;
    transition: box-shadow 0.25s var(--ease), transform 0.25s var(--ease);
    outline: none;
  }
  .knob:focus-visible { box-shadow: var(--out-sm), 0 0 0 3px var(--accent-2); }
  .knob.active { box-shadow: var(--in-sm); transform: scale(0.97); }
  .knob::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: linear-gradient(145deg, #d6dce5, var(--surface-2));
    box-shadow: inset 2px 2px 4px var(--dark), inset -2px -2px 4px var(--light);
  }
  .knob .pointer {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 22px;
    margin-left: -2px;
    transform-origin: 50% 100%;
    transform: translateY(-100%) rotate(var(--angle)) translateY(-8px);
    border-radius: 2px;
    background: var(--accent);
    box-shadow: 0 0 6px rgba(255,122,89,0.6);
  }
  .knob .arc {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(from 225deg, var(--accent-2) 0deg, var(--accent-2) var(--sweep, 0deg), transparent var(--sweep, 0deg));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
    opacity: 0.9;
    pointer-events: none;
  }
  .knob-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft); }
  .knob-value {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink);
    min-width: 58px;
    text-align: center;
    padding: 4px 8px;
    border-radius: 8px;
    box-shadow: var(--in-sm);
  }

  /* ---------- Toggle ---------- */
  .toggles { display: flex; gap: 10px; }
  .toggle {
    position: relative;
    width: 54px; height: 30px;
    border-radius: 15px;
    background: var(--surface);
    box-shadow: var(--in-sm);
    border: 0;
    padding: 0;
    cursor: pointer;
    transition: background 0.3s var(--ease);
    outline: none;
  }
  .toggle:focus-visible { box-shadow: var(--in-sm), 0 0 0 3px var(--accent-2); }
  .toggle .thumb {
    position: absolute;
    top: 3px; left: 3px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--light), #d9dfe8);
    box-shadow: 2px 2px 5px var(--dark), -1px -1px 3px var(--light);
    transition: transform 0.3s var(--ease), background 0.3s;
  }
  .toggle[aria-pressed="true"] .thumb { transform: translateX(24px); background: linear-gradient(145deg, #ffb59f, var(--accent)); }
  .toggle[aria-pressed="true"] { background: #dbe3ec; }
  .toggle-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }

  /* ---------- Fader + meter ---------- */
  .fader-row { display: flex; gap: 14px; align-items: stretch; height: 230px; }

  .fader {
    position: relative;
    width: 42px;
    border-radius: 21px;
    box-shadow: var(--in);
    cursor: ns-resize;
    outline: none;
  }
  .fader:focus-visible { box-shadow: var(--in), 0 0 0 3px var(--accent-2); }
  .fader .track {
    position: absolute;
    left: 50%;
    top: 16px;
    bottom: 16px;
    width: 4px;
    margin-left: -2px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--dark-2), var(--dark));
  }
  .fader .fill {
    position: absolute;
    left: 50%;
    bottom: 16px;
    width: 4px;
    margin-left: -2px;
    border-radius: 2px;
    height: calc(var(--pos, 0.75) * (100% - 32px));
    background: linear-gradient(180deg, var(--accent-2), #3fb8ad);
  }
  .fader .cap {
    position: absolute;
    left: 50%;
    width: 34px;
    height: 46px;
    margin-left: -17px;
    border-radius: 10px;
    bottom: calc(var(--pos, 0.75) * (100% - 32px) + 16px - 23px);
    background: linear-gradient(180deg, #eef2f7, #d5dbe4);
    box-shadow: var(--out-sm);
    transition: box-shadow 0.2s var(--ease);
  }
  .fader .cap::after {
    content: "";
    position: absolute;
    left: 6px; right: 6px; top: 50%;
    height: 3px; margin-top: -1.5px;
    border-radius: 2px;
    background: var(--ink-faint);
    box-shadow: 0 -6px 0 #c5cdd8, 0 6px 0 #c5cdd8;
  }
  .fader.active .cap { box-shadow: var(--in-sm); }

  .meter {
    width: 22px;
    border-radius: 11px;
    box-shadow: var(--in-sm);
    padding: 8px 5px;
    display: flex;
    flex-direction: column-reverse;
    gap: 3px;
  }
  .meter i {
    display: block;
    flex: 1;
    border-radius: 2px;
    background: #cfd6e0;
    box-shadow: inset 1px 1px 2px rgba(0,0,0,0.08);
    transition: background 0.06s linear, box-shadow 0.06s linear;
  }
  .meter i.on { background: var(--led-green); box-shadow: 0 0 6px rgba(94,227,106,0.7); }
  .meter i.on.amber { background: var(--led-amber); box-shadow: 0 0 6px rgba(255,200,87,0.7); }
  .meter i.on.red { background: var(--led-red); box-shadow: 0 0 7px rgba(255,77,77,0.8); }

  .fader-value {
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 8px;
    box-shadow: var(--in-sm);
    min-width: 72px;
    text-align: center;
  }

  /* ---------- Master ---------- */
  .master { gap: 20px; }
  .master .fader-row { height: 250px; }
  .master .knob { width: 92px; height: 92px; }
  .master .knob .pointer { height: 30px; }

  .transport {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    width: 100%;
  }
  .tbtn {
    height: 50px;
    border: 0;
    border-radius: 14px;
    background: var(--surface);
    box-shadow: var(--out-sm);
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: box-shadow 0.2s var(--ease), transform 0.2s var(--ease), color 0.2s;
    outline: none;
  }
  .tbtn:focus-visible { box-shadow: var(--out-sm), 0 0 0 3px var(--accent-2); }
  .tbtn:hover { transform: translateY(-1px); }
  .tbtn:active, .tbtn.pressed { box-shadow: var(--in-sm); transform: translateY(0); }
  .tbtn.pressed.play { color: var(--accent-2); }
  .tbtn.pressed.rec { color: var(--led-red); }
  .tbtn svg { display: block; }

  .timecode {
    width: 100%;
    padding: 14px 18px;
    border-radius: 16px;
    box-shadow: var(--in);
    font-family: var(--mono);
    font-size: clamp(20px, 2vw, 26px);
    letter-spacing: 0.08em;
    text-align: center;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .timecode small { display: block; font-size: 10px; letter-spacing: 0.2em; color: var(--ink-soft); margin-top: 4px; font-family: var(--font); }

  .scenes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
  .scene {
    padding: 10px 6px;
    border: 0;
    border-radius: 12px;
    background: var(--surface);
    box-shadow: var(--out-sm);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    cursor: pointer;
    transition: box-shadow 0.2s var(--ease), color 0.2s;
    outline: none;
  }
  .scene:focus-visible { box-shadow: var(--out-sm), 0 0 0 3px var(--accent-2); }
  .scene.on { box-shadow: var(--in-sm); color: var(--accent); }

  .hint {
    margin-top: 28px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 12px;
  }
  .hint kbd {
    font-family: var(--mono);
    padding: 2px 6px;
    border-radius: 6px;
    box-shadow: var(--in-sm);
    font-size: 11px;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 1000px) {
    .console { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .master { grid-column: span 2; }
    .master .fader-row { height: 220px; }
  }
  @media (max-width: 480px) {
    .console { grid-template-columns: 1fr; gap: 18px; }
    .master { grid-column: span 1; }
    .fader-row { height: 200px; }
    .readout { width: 100%; justify-content: space-between; }
  }
  @media (min-width: 1800px) {
    .wrap { max-width: 1500px; }
    body { font-size: 16px; }
    .knob { width: 84px; height: 84px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .knob, .toggle .thumb, .tbtn, .fader .cap, .meter i, .scene { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="logo">
      <div class="logo-badge" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3d4a5c" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 12h2M8 6v12M12 9v6M16 4v16M20 10v4"/>
        </svg>
      </div>
      <div>
        <h1>Softdesk 4</h1>
        <p>Four-channel soft console · state-only demo</p>
      </div>
    </div>
    <div class="readout" aria-live="off">
      <span>Rate <b>48 kHz</b></span>
      <span>Buffer <b>128</b></span>
      <span>Load <b id="cpu">11%</b></span>
    </div>
  </header>

  <main class="console" id="console"></main>

  <p class="hint">Drag knobs and faders vertically. Double-click a knob to reset. Focus a control and use <kbd>↑</kbd> <kbd>↓</kbd> for fine steps, <kbd>Shift</kbd> for coarse.</p>
</div>

<!-- Template-free rendering: the four channel strips share markup, so they are built once in JS. -->
<script>
  (function () {
    'use strict';

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var channels = [
      { id: 'ch1', short: 'CH 1', name: 'Vocal',   gain: 0.62, pan: 0.5, fader: 0.78, mute: false, solo: false, hue: 0 },
      { id: 'ch2', short: 'CH 2', name: 'Keys',    gain: 0.48, pan: 0.32, fader: 0.66, mute: false, solo: false, hue: 1 },
      { id: 'ch3', short: 'CH 3', name: 'Bass',    gain: 0.71, pan: 0.5, fader: 0.72, mute: false, solo: false, hue: 2 },
      { id: 'ch4', short: 'CH 4', name: 'Drums',   gain: 0.55, pan: 0.68, fader: 0.7, mute: false, solo: false, hue: 3 }
    ];
    var master = { fader: 0.8, width: 0.5, transport: 'stop', rec: false, scene: 0, time: 0 };

    var root = document.getElementById('console');

    function el(tag, cls, html) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html !== undefined) e.innerHTML = html;
      return e;
    }

    /* ----- Knob widget ----- */
    function makeKnob(opts) {
      var block = el('div', 'knob-block');
      var knob = el('div', 'knob');
      knob.setAttribute('role', 'slider');
      knob.setAttribute('tabindex', '0');
      knob.setAttribute('aria-label', opts.label);
      knob.setAttribute('aria-valuemin', '0');
      knob.setAttribute('aria-valuemax', '100');
      knob.appendChild(el('div', 'arc'));
      knob.appendChild(el('div', 'pointer'));
      var label = el('div', 'knob-label', opts.label);
      var value = el('div', 'knob-value');
      block.appendChild(knob); block.appendChild(label); block.appendChild(value);

      var v = opts.value;
      function render() {
        var angle = -135 + v * 270;
        knob.style.setProperty('--angle', angle + 'deg');
        knob.style.setProperty('--sweep', (v * 270) + 'deg');
        knob.setAttribute('aria-valuenow', Math.round(v * 100));
        value.textContent = opts.format(v);
        if (opts.onChange) opts.onChange(v);
      }
      function set(nv) { v = Math.min(1, Math.max(0, nv)); render(); }

      var startY = 0, startV = 0, dragging = false;
      knob.addEventListener('pointerdown', function (e) {
        dragging = true; startY = e.clientY; startV = v;
        knob.classList.add('active');
        knob.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      knob.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        var dy = startY - e.clientY;
        set(startV + dy / (e.shiftKey ? 600 : 180));
      });
      function release() { dragging = false; knob.classList.remove('active'); }
      knob.addEventListener('pointerup', release);
      knob.addEventListener('pointercancel', release);
      knob.addEventListener('dblclick', function () { set(opts.reset !== undefined ? opts.reset : opts.value); });
      knob.addEventListener('wheel', function (e) { e.preventDefault(); set(v - Math.sign(e.deltaY) * 0.02); }, { passive: false });
      knob.addEventListener('keydown', function (e) {
        var step = e.shiftKey ? 0.1 : 0.01;
        if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { set(v + step); e.preventDefault(); }
        if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { set(v - step); e.preventDefault(); }
        if (e.key === 'Home') { set(0); e.preventDefault(); }
        if (e.key === 'End') { set(1); e.preventDefault(); }
      });
      render();
      return { el: block, set: set, get: function () { return v; } };
    }

    /* ----- Fader widget ----- */
    function makeFader(opts) {
      var fader = el('div', 'fader');
      fader.setAttribute('role', 'slider');
      fader.setAttribute('tabindex', '0');
      fader.setAttribute('aria-label', opts.label);
      fader.setAttribute('aria-valuemin', '0');
      fader.setAttribute('aria-valuemax', '100');
      fader.appendChild(el('div', 'track'));
      fader.appendChild(el('div', 'fill'));
      fader.appendChild(el('div', 'cap'));

      var v = opts.value;
      function render() {
        fader.style.setProperty('--pos', v);
        fader.setAttribute('aria-valuenow', Math.round(v * 100));
        if (opts.onChange) opts.onChange(v);
      }
      function set(nv) { v = Math.min(1, Math.max(0, nv)); render(); }

      var dragging = false, startY = 0, startV = 0, travel = 1;
      fader.addEventListener('pointerdown', function (e) {
        dragging = true; startY = e.clientY; startV = v;
        travel = fader.getBoundingClientRect().height - 32;
        fader.classList.add('active');
        fader.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      fader.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        set(startV + (startY - e.clientY) / travel / (e.shiftKey ? 4 : 1));
      });
      function release() { dragging = false; fader.classList.remove('active'); }
      fader.addEventListener('pointerup', release);
      fader.addEventListener('pointercancel', release);
      fader.addEventListener('dblclick', function () { set(opts.reset !== undefined ? opts.reset : 0.75); });
      fader.addEventListener('wheel', function (e) { e.preventDefault(); set(v - Math.sign(e.deltaY) * 0.02); }, { passive: false });
      fader.addEventListener('keydown', function (e) {
        var step = e.shiftKey ? 0.1 : 0.01;
        if (e.key === 'ArrowUp') { set(v + step); e.preventDefault(); }
        if (e.key === 'ArrowDown') { set(v - step); e.preventDefault(); }
      });
      render();
      return { el: fader, set: set, get: function () { return v; } };
    }

    /* ----- Meter widget ----- */
    var SEGMENTS = 14;
    function makeMeter(label) {
      var m = el('div', 'meter');
      m.setAttribute('role', 'img');
      m.setAttribute('aria-label', label + ' level meter');
      var segs = [];
      for (var i = 0; i < SEGMENTS; i++) { var s = el('i'); m.appendChild(s); segs.push(s); }
      var peak = 0;
      return {
        el: m,
        draw: function (level) {
          peak = Math.max(peak * 0.94, level);
          var lit = Math.round(peak * SEGMENTS);
          for (var i = 0; i < SEGMENTS; i++) {
            var on = i < lit;
            segs[i].className = on ? ('on' + (i >= SEGMENTS - 2 ? ' red' : i >= SEGMENTS - 5 ? ' amber' : '')) : '';
          }
        }
      };
    }

    /* ----- Toggle widget ----- */
    function makeToggle(label, on, onChange) {
      var wrap = el('div', 'toggle-wrap');
      var b = el('button', 'toggle');
      b.type = 'button';
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.setAttribute('aria-label', label);
      b.appendChild(el('span', 'thumb'));
      wrap.appendChild(b);
      wrap.appendChild(el('span', '', label));
      b.addEventListener('click', function () {
        on = !on;
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        onChange(on);
      });
      return wrap;
    }

    function fmtDb(v) {
      if (v <= 0) return '-inf dB';
      var db = 20 * Math.log10(v) * 1.6 + 6; // fader law: 0.75 -> roughly 0 dB
      return (db >= 0 ? '+' : '') + db.toFixed(1) + ' dB';
    }
    function fmtPan(v) {
      var p = Math.round((v - 0.5) * 200);
      return p === 0 ? 'C' : (p < 0 ? 'L ' + Math.abs(p) : 'R ' + p);
    }
    function fmtPct(v) { return Math.round(v * 100) + ' %'; }

    /* ----- Build channel strips ----- */
    var strips = channels.map(function (ch, idx) {
      var strip = el('section', 'strip');
      strip.id = 'strip-' + ch.id;
      strip.setAttribute('aria-label', ch.short + ' ' + ch.name);
      strip.appendChild(el('div', 'strip-name', ch.short + '<b>' + ch.name + '</b>'));

      var gain = makeKnob({ label: 'Gain', value: ch.gain, format: fmtPct, onChange: function (v) { ch.gain = v; } });
      var pan = makeKnob({ label: 'Pan', value: ch.pan, reset: 0.5, format: fmtPan, onChange: function (v) { ch.pan = v; } });
      strip.appendChild(gain.el);
      strip.appendChild(pan.el);

      var toggles = el('div', 'toggles');
      toggles.appendChild(makeToggle('Mute', ch.mute, function (on) { ch.mute = on; }));
      toggles.appendChild(makeToggle('Solo', ch.solo, function (on) { ch.solo = on; }));
      strip.appendChild(toggles);

      var valueEl = el('div', 'fader-value');
      var fader = makeFader({ label: ch.name + ' fader', value: ch.fader, onChange: function (v) { ch.fader = v; valueEl.textContent = fmtDb(v); } });
      var meter = makeMeter(ch.name);
      var row = el('div', 'fader-row');
      row.appendChild(fader.el);
      row.appendChild(meter.el);
      strip.appendChild(row);
      strip.appendChild(valueEl);
      root.appendChild(strip);
      return { ch: ch, meter: meter, fader: fader, gain: gain, pan: pan, phase: idx * 1.7 };
    });

    /* ----- Master section ----- */
    var m = el('section', 'master');
    m.id = 'master';
    m.setAttribute('aria-label', 'Master section');
    m.appendChild(el('div', 'strip-name', 'Master<b>Stereo bus</b>'));

    var tc = el('div', 'timecode', '<span id="tc">00:00:00.00</span><small>Timecode · 25 fps</small>');
    m.appendChild(tc);

    var transport = el('div', 'transport');
    var icons = {
      rew: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12L3 12l8-6zm10 0v12l-8-6 8-6z"/></svg>',
      stop: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
      play: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',
      rec: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="7"/></svg>'
    };
    var tbtns = {};
    ['rew', 'stop', 'play', 'rec'].forEach(function (k) {
      var b = el('button', 'tbtn ' + k, icons[k]);
      b.type = 'button';
      b.setAttribute('aria-label', { rew: 'Return to start', stop: 'Stop', play: 'Play', rec: 'Record arm' }[k]);
      transport.appendChild(b);
      tbtns[k] = b;
    });
    m.appendChild(transport);

    var width = makeKnob({ label: 'Stereo width', value: master.width, reset: 0.5, format: fmtPct, onChange: function (v) { master.width = v; } });
    m.appendChild(width.el);

    var mValue = el('div', 'fader-value');
    var mFader = makeFader({ label: 'Master fader', value: master.fader, reset: 0.8, onChange: function (v) { master.fader = v; mValue.textContent = fmtDb(v); } });
    var mL = makeMeter('Master left');
    var mR = makeMeter('Master right');
    var mRow = el('div', 'fader-row');
    mRow.appendChild(mL.el); mRow.appendChild(mFader.el); mRow.appendChild(mR.el);
    m.appendChild(mRow);
    m.appendChild(mValue);

    var scenes = el('div', 'scenes');
    var sceneData = [
      { name: 'Verse',  f: [0.78, 0.6, 0.72, 0.62] },
      { name: 'Chorus', f: [0.84, 0.74, 0.76, 0.8] },
      { name: 'Bridge', f: [0.7, 0.8, 0.66, 0.5] }
    ];
    var sceneBtns = sceneData.map(function (s, i) {
      var b = el('button', 'scene' + (i === 0 ? ' on' : ''), s.name);
      b.type = 'button';
      b.addEventListener('click', function () {
        sceneBtns.forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        master.scene = i;
        animateFaders(s.f);
      });
      scenes.appendChild(b);
      return b;
    });
    m.appendChild(scenes);
    root.appendChild(m);

    function animateFaders(targets) {
      var from = strips.map(function (s) { return s.fader.get(); });
      var t0 = performance.now(), dur = reduce ? 0 : 600;
      function step(now) {
        var k = dur === 0 ? 1 : Math.min(1, (now - t0) / dur);
        var e = 1 - Math.pow(1 - k, 3);
        strips.forEach(function (s, i) { s.fader.set(from[i] + (targets[i] - from[i]) * e); });
        if (k < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    /* ----- Transport logic ----- */
    function setTransport(state) {
      master.transport = state;
      tbtns.play.classList.toggle('pressed', state === 'play');
      tbtns.stop.classList.toggle('pressed', state === 'stop');
    }
    tbtns.play.addEventListener('click', function () { setTransport(master.transport === 'play' ? 'stop' : 'play'); });
    tbtns.stop.addEventListener('click', function () { setTransport('stop'); });
    tbtns.rew.addEventListener('click', function () { master.time = 0; drawTime(); });
    tbtns.rec.addEventListener('click', function () { master.rec = !master.rec; tbtns.rec.classList.toggle('pressed', master.rec); });
    setTransport('stop');

    var tcEl = document.getElementById('tc');
    function drawTime() {
      var t = master.time;
      var h = Math.floor(t / 3600), mi = Math.floor(t / 60) % 60, s = Math.floor(t) % 60, f = Math.floor((t % 1) * 25);
      var p = function (n) { return String(n).padStart(2, '0'); };
      tcEl.textContent = p(h) + ':' + p(mi) + ':' + p(s) + '.' + p(f);
    }

    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); tbtns.play.click(); }
    });

    /* ----- Fake signal engine ----- */
    var last = performance.now();
    var cpuEl = document.getElementById('cpu');
    var cpuTick = 0;

    function signal(t, phase, ch) {
      // A slow envelope, a mid "beat" and fast jitter, per channel.
      var env = 0.55 + 0.25 * Math.sin(t * 0.7 + phase);
      var beat = Math.max(0, Math.sin(t * 4.2 + phase * 2)) * 0.35;
      var jitter = (Math.sin(t * 23 + phase * 5) + Math.sin(t * 31.7 + phase)) * 0.06;
      var base = env + beat * (ch.name === 'Drums' ? 1.4 : 1) + jitter;
      return Math.max(0, Math.min(1, base * ch.gain * 1.3));
    }

    function frame(now) {
      var dt = (now - last) / 1000; last = now;
      var playing = master.transport === 'play';
      if (playing) { master.time += dt; drawTime(); }
      var t = now / 1000;
      var anySolo = strips.some(function (s) { return s.ch.solo; });

      var sumL = 0, sumR = 0;
      strips.forEach(function (s) {
        var lvl = playing ? signal(t, s.phase, s.ch) : 0;
        var audible = !s.ch.mute && (!anySolo || s.ch.solo);
        var post = audible ? lvl * s.ch.fader * 1.15 : 0;
        s.meter.draw(Math.min(1, post));
        var pan = s.ch.pan;
        sumL += post * Math.cos(pan * Math.PI / 2);
        sumR += post * Math.sin(pan * Math.PI / 2);
      });
      var w = 0.5 + master.width;
      var mid = (sumL + sumR) / 2, side = (sumL - sumR) / 2 * w;
      mL.draw(Math.min(1, (mid + side) * master.fader * 0.55));
      mR.draw(Math.min(1, (mid - side) * master.fader * 0.55));

      if ((cpuTick += dt) > 0.8) {
        cpuTick = 0;
        var load = playing ? 14 + Math.round(Math.random() * 9) : 6 + Math.round(Math.random() * 3);
        cpuEl.textContent = load + '%';
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    drawTime();
  })();
</script>
</body>
</html>
