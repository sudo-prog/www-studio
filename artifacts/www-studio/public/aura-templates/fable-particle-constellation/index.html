<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation — An Interactive Particle Field</title>
<style>
  :root {
    --navy: #060b1f;
    --navy-deep: #03061a;
    --peri: #a9b4ff;
    --peri-soft: rgba(169, 180, 255, 0.55);
    --ink: rgba(236, 239, 255, 0.92);
    --ink-dim: rgba(236, 239, 255, 0.5);
    --ink-faint: rgba(236, 239, 255, 0.18);
    --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, ui-serif, serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--navy);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(ellipse 120% 80% at 50% 110%, rgba(66, 79, 160, 0.22), transparent 60%),
      radial-gradient(ellipse 60% 50% at 20% 10%, rgba(120, 90, 200, 0.10), transparent 60%),
      var(--navy);
  }

  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }

  /* Vignette + subtle scanline texture for depth */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 55%, rgba(3, 6, 26, 0.75) 100%);
    z-index: 2;
  }

  .ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(20px, 4vw, 56px);
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
  }

  .title {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(2.6rem, 8vw, 7.5rem);
    letter-spacing: 0.18em;
    line-height: 0.95;
    margin: 0;
    color: var(--ink);
    text-shadow: 0 0 40px rgba(169, 180, 255, 0.35), 0 0 2px rgba(255,255,255,0.4);
    animation: settle 2.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .title small {
    display: block;
    font-family: var(--mono);
    font-size: clamp(0.62rem, 1vw, 0.78rem);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 14px;
    margin-left: 4px;
  }

  .stamp {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-dim);
    text-align: right;
    line-height: 1.9;
    animation: settle 2.4s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .stamp b {
    display: block;
    color: var(--ink);
    font-weight: 500;
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
  }

  .legend {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    display: grid;
    gap: 8px;
    animation: settle 2.4s 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .legend div {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px 2px var(--peri-soft);
  }

  .line {
    width: 22px; height: 1px;
    background: linear-gradient(90deg, var(--peri), transparent);
  }

  .ring {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid var(--peri);
    box-shadow: 0 0 8px var(--peri-soft);
  }

  .panel {
    pointer-events: auto;
    display: grid;
    gap: 18px;
    padding: 18px 20px;
    min-width: 260px;
    border: 1px solid var(--ink-faint);
    background: rgba(6, 11, 31, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 4px;
    animation: settle 2.4s 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: border-color 0.5s ease, box-shadow 0.5s ease;
  }

  .panel:hover {
    border-color: rgba(169, 180, 255, 0.35);
    box-shadow: 0 0 40px rgba(169, 180, 255, 0.08);
  }

  .control label,
  .control .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 0.66rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 10px;
  }

  .control .readout {
    color: var(--peri);
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 22px;
    background: transparent;
    cursor: pointer;
    margin: 0;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 1px;
    background: linear-gradient(90deg, var(--peri) var(--fill, 50%), var(--ink-faint) var(--fill, 50%));
  }

  input[type="range"]::-moz-range-track {
    height: 1px;
    background: var(--ink-faint);
  }

  input[type="range"]::-moz-range-progress {
    height: 1px;
    background: var(--peri);
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px; height: 12px;
    margin-top: -5.5px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--peri);
    box-shadow: 0 0 12px 2px var(--peri-soft);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
  }

  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--peri);
    box-shadow: 0 0 12px 2px var(--peri-soft);
  }

  input[type="range"]:hover::-webkit-slider-thumb,
  input[type="range"]:focus-visible::-webkit-slider-thumb {
    transform: scale(1.35);
    box-shadow: 0 0 18px 4px var(--peri-soft);
  }

  input[type="range"]:focus-visible { outline: none; }

  .toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--ink-faint);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }

  .toggle::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 50%;
    background: rgba(169, 180, 255, 0.16);
    box-shadow: inset 0 0 0 1px rgba(169, 180, 255, 0.4);
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .toggle[data-mode="repel"]::before { transform: translateX(100%); }

  .toggle button {
    position: relative;
    z-index: 1;
    appearance: none;
    background: none;
    border: 0;
    padding: 10px 0;
    font-family: var(--mono);
    font-size: 0.66rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.3s ease;
  }

  .toggle button:hover { color: var(--ink); }
  .toggle button[aria-pressed="true"] { color: #fff; }
  .toggle button:focus-visible { outline: 1px solid var(--peri); outline-offset: -3px; }

  .hint {
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: center;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
    to   { opacity: 1; transform: none; filter: none; }
  }

  @media (max-width: 640px) {
    .ui { padding: 20px; }
    header { flex-direction: column; }
    .stamp { text-align: left; }
    .legend { display: none; }
    .panel { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .title, .stamp, .legend, .panel { animation: none; }
    .toggle::before, input[type="range"]::-webkit-slider-thumb { transition: none; }
  }
</style>
</head>
<body>

<canvas id="sky" aria-label="Interactive constellation of drifting particles" role="img"></canvas>
<div class="vignette"></div>

<div class="ui">
  <header>
    <h1 class="title">Constellation<small>Field study no. 006 · a slow gravity</small></h1>
    <div class="stamp">
      <b id="count">—</b> particles
      <span id="links">—</span> threads<br>
      <span id="fps">—</span> fps
    </div>
  </header>

  <div aria-hidden="true"></div>

  <footer>
    <div class="legend">
      <div><span class="dot"></span> particle · drifting on a slow current</div>
      <div><span class="line"></span> thread · drawn when two lie within reach</div>
      <div><span class="ring"></span> ripple · click anywhere to release one</div>
    </div>

    <div class="panel">
      <div class="control">
        <label for="dist">Connection distance <span class="readout" id="distOut">120</span></label>
        <input type="range" id="dist" min="40" max="260" value="120" step="1">
      </div>
      <div class="control">
        <div class="row"><span>Cursor field</span><span id="modeOut">attract</span></div>
        <div class="toggle" id="toggle" data-mode="attract" role="group" aria-label="Cursor field mode">
          <button type="button" data-mode="attract" aria-pressed="true">Attract</button>
          <button type="button" data-mode="repel" aria-pressed="false">Repel</button>
        </div>
      </div>
      <div class="hint">move · click · drag the slider</div>
    </div>
  </footer>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d', { alpha: true });
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const distInput = document.getElementById('dist');
  const distOut = document.getElementById('distOut');
  const toggle = document.getElementById('toggle');
  const modeOut = document.getElementById('modeOut');
  const countEl = document.getElementById('count');
  const linksEl = document.getElementById('links');
  const fpsEl = document.getElementById('fps');

  const state = {
    w: 0, h: 0, dpr: 1,
    particles: [],
    ripples: [],
    linkDist: 120,
    mode: 1,               // 1 attract, -1 repel
    mouse: { x: -9999, y: -9999, active: false },
    cellSize: 130,
    lastT: performance.now(),
    fpsAcc: 0, fpsN: 0
  };

  function targetCount() {
    const area = state.w * state.h;
    return Math.max(90, Math.min(420, Math.round(area / 5200)));
  }

  function makeParticle(x, y) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.08 + Math.random() * 0.22;
    return {
      x: x !== undefined ? x : Math.random() * state.w,
      y: y !== undefined ? y : Math.random() * state.h,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 0.8 + Math.random() * 1.7,
      phase: Math.random() * Math.PI * 2,
      twinkle: 0.4 + Math.random() * 0.6,
      hue: Math.random() < 0.18 ? 1 : 0   // some particles carry periwinkle tint
    };
  }

  function resize() {
    state.dpr = Math.min(window.devicePixelRatio || 1, 2);
    state.w = window.innerWidth;
    state.h = window.innerHeight;
    canvas.width = Math.floor(state.w * state.dpr);
    canvas.height = Math.floor(state.h * state.dpr);
    canvas.style.width = state.w + 'px';
    canvas.style.height = state.h + 'px';
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

    const n = targetCount();
    while (state.particles.length < n) state.particles.push(makeParticle());
    if (state.particles.length > n) state.particles.length = n;
    for (const p of state.particles) {
      if (p.x > state.w) p.x = Math.random() * state.w;
      if (p.y > state.h) p.y = Math.random() * state.h;
    }
    countEl.textContent = state.particles.length;
  }

  function updateSliderFill() {
    const pct = ((distInput.value - distInput.min) / (distInput.max - distInput.min)) * 100;
    distInput.style.setProperty('--fill', pct + '%');
  }

  distInput.addEventListener('input', () => {
    state.linkDist = +distInput.value;
    distOut.textContent = distInput.value;
    state.cellSize = Math.max(60, state.linkDist);
    updateSliderFill();
  });
  updateSliderFill();

  toggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const mode = btn.dataset.mode;
    toggle.dataset.mode = mode;
    state.mode = mode === 'attract' ? 1 : -1;
    modeOut.textContent = mode;
    toggle.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  });

  function pointer(e) {
    state.mouse.x = e.clientX;
    state.mouse.y = e.clientY;
    state.mouse.active = true;
  }

  canvas.addEventListener('pointermove', pointer);
  canvas.addEventListener('pointerdown', (e) => {
    pointer(e);
    state.ripples.push({ x: e.clientX, y: e.clientY, t: 0, life: 1.6 });
    // birth a few particles at the burst
    for (let i = 0; i < 4 && state.particles.length < 520; i++) {
      const p = makeParticle(e.clientX, e.clientY);
      const a = Math.random() * Math.PI * 2;
      p.vx = Math.cos(a) * 1.4; p.vy = Math.sin(a) * 1.4;
      state.particles.push(p);
    }
    countEl.textContent = state.particles.length;
  });
  canvas.addEventListener('pointerleave', () => { state.mouse.active = false; });

  window.addEventListener('resize', resize);
  resize();

  // Spatial hash so the link pass stays O(n) rather than O(n²)
  function buildGrid() {
    const cs = state.cellSize;
    const cols = Math.ceil(state.w / cs) + 1;
    const grid = new Map();
    state.particles.forEach((p, i) => {
      const key = Math.floor(p.x / cs) + cols * Math.floor(p.y / cs);
      const cell = grid.get(key);
      if (cell) cell.push(i); else grid.set(key, [i]);
    });
    return { grid, cols, cs };
  }

  function step(dt) {
    const { w, h, mouse, particles, ripples } = state;
    const drag = 0.985;
    const time = performance.now() * 0.001;

    for (const p of particles) {
      // slow current: gentle curl noise approximation
      const cx = Math.sin(p.y * 0.004 + time * 0.15) * 0.004;
      const cy = Math.cos(p.x * 0.004 - time * 0.12) * 0.004;
      p.vx += cx * dt; p.vy += cy * dt;

      if (mouse.active) {
        const dx = mouse.x - p.x, dy = mouse.y - p.y;
        const d2 = dx * dx + dy * dy;
        const reach = 220;
        if (d2 < reach * reach && d2 > 1) {
          const d = Math.sqrt(d2);
          const falloff = 1 - d / reach;
          const f = 0.06 * falloff * falloff * state.mode;
          p.vx += (dx / d) * f * dt;
          p.vy += (dy / d) * f * dt;
        }
      }

      for (const r of ripples) {
        const dx = p.x - r.x, dy = p.y - r.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const front = r.t * 320;
        const band = Math.abs(d - front);
        if (band < 40) {
          const push = (1 - band / 40) * 0.9 * (1 - r.t / r.life);
          p.vx += (dx / d) * push * dt;
          p.vy += (dy / d) * push * dt;
        }
      }

      p.vx *= drag; p.vy *= drag;
      // keep a minimum drift so nothing dies
      const sp = Math.hypot(p.vx, p.vy);
      if (sp < 0.05) { p.vx += (Math.random() - 0.5) * 0.02; p.vy += (Math.random() - 0.5) * 0.02; }
      if (sp > 3) { p.vx *= 3 / sp; p.vy *= 3 / sp; }

      p.x += p.vx * dt; p.y += p.vy * dt;

      const m = 20;
      if (p.x < -m) p.x = w + m; else if (p.x > w + m) p.x = -m;
      if (p.y < -m) p.y = h + m; else if (p.y > h + m) p.y = -m;
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      ripples[i].t += dt / 60;
      if (ripples[i].t > ripples[i].life) ripples.splice(i, 1);
    }
  }

  function draw() {
    const { w, h, particles, ripples, linkDist } = state;
    const time = performance.now() * 0.001;
    ctx.clearRect(0, 0, w, h);

    // threads
    const { grid, cols, cs } = buildGrid();
    const ld2 = linkDist * linkDist;
    let links = 0;
    ctx.lineWidth = 0.8;
    for (const [key, cell] of grid) {
      const gx = key % cols, gy = Math.floor(key / cols);
      for (let oy = 0; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          if (oy === 0 && ox < 0) continue;
          const nk = (gx + ox) + cols * (gy + oy);
          const other = grid.get(nk);
          if (!other) continue;
          for (const i of cell) {
            const a = particles[i];
            for (const j of other) {
              if (nk === key && j <= i) continue;
              const b = particles[j];
              const dx = a.x - b.x, dy = a.y - b.y;
              const d2 = dx * dx + dy * dy;
              if (d2 < ld2) {
                const alpha = (1 - Math.sqrt(d2) / linkDist);
                ctx.strokeStyle = 'rgba(169,180,255,' + (alpha * alpha * 0.55).toFixed(3) + ')';
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
                links++;
              }
            }
          }
        }
      }
    }

    // particles with glow halos
    for (const p of particles) {
      const tw = 0.7 + 0.3 * Math.sin(time * p.twinkle * 1.6 + p.phase);
      const r = p.r * tw;
      const halo = r * 6;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, halo);
      if (p.hue) {
        g.addColorStop(0, 'rgba(190,198,255,' + (0.5 * tw).toFixed(3) + ')');
        g.addColorStop(0.35, 'rgba(169,180,255,0.16)');
      } else {
        g.addColorStop(0, 'rgba(255,255,255,' + (0.45 * tw).toFixed(3) + ')');
        g.addColorStop(0.35, 'rgba(200,206,255,0.12)');
      }
      g.addColorStop(1, 'rgba(169,180,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, halo, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = p.hue ? 'rgba(214,220,255,' + tw + ')' : 'rgba(255,255,255,' + tw + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    }

    // ripples
    for (const r of ripples) {
      const k = r.t / r.life;
      const radius = r.t * 320;
      const alpha = (1 - k) * 0.7;
      ctx.lineWidth = 1.2 * (1 - k) + 0.3;
      ctx.strokeStyle = 'rgba(169,180,255,' + alpha.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(r.x, r.y, radius, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + (alpha * 0.4).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(r.x, r.y, radius * 0.6, 0, Math.PI * 2); ctx.stroke();
    }

    // cursor well
    if (state.mouse.active) {
      const m = state.mouse;
      const pulse = 1 + 0.08 * Math.sin(time * 3);
      const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 80 * pulse);
      g.addColorStop(0, 'rgba(169,180,255,0.14)');
      g.addColorStop(1, 'rgba(169,180,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(m.x, m.y, 80 * pulse, 0, Math.PI * 2); ctx.fill();
    }

    linksEl.textContent = links;
  }

  function frame(now) {
    let dt = (now - state.lastT) / 16.667;
    state.lastT = now;
    if (dt > 3) dt = 3;
    if (!reduceMotion) step(dt); else if (state.ripples.length) step(dt);
    draw();

    state.fpsAcc += 1000 / Math.max(1, now - (state.prevNow || now - 16));
    state.prevNow = now;
    if (++state.fpsN >= 30) {
      fpsEl.textContent = Math.round(state.fpsAcc / state.fpsN);
      state.fpsAcc = 0; state.fpsN = 0;
    }
    requestAnimationFrame(frame);
  }

  // Under reduced motion, spread particles a little so the static field still reads as a constellation
  if (reduceMotion) {
    for (let i = 0; i < 40; i++) step(1);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
