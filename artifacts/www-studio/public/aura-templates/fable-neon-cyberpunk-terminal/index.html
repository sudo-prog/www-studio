<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KESTREL//OS — Boot Terminal</title>
<style>
  :root {
    --bg: #05060a;
    --bg-2: #0a0c14;
    --panel: rgba(10, 12, 22, 0.82);
    --magenta: #ff2bd6;
    --cyan: #00f0ff;
    --amber: #ffb830;
    --green: #5cff8a;
    --dim: #6b7390;
    --text: #d8e6ff;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% 0%, #10142a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- CRT overlays ---------- */
  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.28) 2px 3px);
    mix-blend-mode: multiply;
  }
  .scanlines::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 120px;
    top: -120px;
    background: linear-gradient(180deg, transparent, rgba(0,240,255,0.06), transparent);
    animation: sweep 7s linear infinite;
  }
  @keyframes sweep { to { top: 100%; } }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 49;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
  }

  .flicker {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 48;
    background: rgba(255,255,255,0.02);
    animation: flicker 0.12s steps(2) infinite;
  }
  @keyframes flicker { 50% { opacity: 0.4; } }

  .gridfloor {
    position: fixed;
    left: -50%; right: -50%; bottom: -10%;
    height: 45%;
    pointer-events: none;
    background:
      linear-gradient(90deg, rgba(255,43,214,0.18) 1px, transparent 1px) 0 0 / 60px 100%,
      linear-gradient(0deg, rgba(0,240,255,0.18) 1px, transparent 1px) 0 0 / 100% 40px;
    transform: perspective(500px) rotateX(62deg);
    transform-origin: 50% 100%;
    mask-image: linear-gradient(180deg, transparent, #000 60%);
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 60%);
    opacity: 0.5;
    animation: gridmove 3s linear infinite;
  }
  @keyframes gridmove { to { background-position: 0 0, 0 40px; } }

  /* ---------- Layout ---------- */
  .shell {
    position: relative;
    z-index: 2;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 14px;
    padding: 16px;
    max-width: 1500px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 18px;
    border: 1px solid rgba(0,240,255,0.25);
    background: var(--panel);
    box-shadow: 0 0 0 1px rgba(255,43,214,0.08) inset, 0 0 30px rgba(0,240,255,0.08);
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
  }

  .title {
    font-size: clamp(18px, 2.4vw, 30px);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #fff;
    position: relative;
    text-shadow: 0 0 12px rgba(0,240,255,0.6);
  }
  .title .slash { color: var(--magenta); }
  .title.glitch {
    animation: glitch 0.42s steps(2) both;
  }
  @keyframes glitch {
    0%   { text-shadow: -3px 0 var(--magenta), 3px 0 var(--cyan); transform: translate(0); }
    20%  { text-shadow: 4px 0 var(--magenta), -4px 0 var(--cyan); transform: translate(-2px, 1px) skewX(4deg); }
    40%  { text-shadow: -5px 0 var(--magenta), 5px 0 var(--cyan); transform: translate(3px, -1px); clip-path: inset(20% 0 40% 0); }
    60%  { text-shadow: 2px 0 var(--magenta), -2px 0 var(--cyan); transform: translate(-1px, 0) skewX(-6deg); clip-path: inset(60% 0 5% 0); }
    80%  { text-shadow: -1px 0 var(--magenta), 1px 0 var(--cyan); transform: translate(1px, 1px); clip-path: none; }
    100% { text-shadow: 0 0 12px rgba(0,240,255,0.6); transform: none; }
  }

  .status { display: flex; gap: 18px; font-size: 12px; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; }
  .status b { color: var(--cyan); font-weight: 500; }
  .status .led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); margin-right: 6px; vertical-align: middle; animation: blink 1.6s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 340px);
    gap: 14px;
    min-height: 0;
  }

  .term, .side {
    border: 1px solid rgba(255,43,214,0.28);
    background: var(--panel);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 0 40px rgba(255,43,214,0.08), inset 0 0 60px rgba(0,0,0,0.5);
    position: relative;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .term::before, .side::before {
    content: attr(data-label);
    position: absolute;
    top: -1px;
    left: 16px;
    transform: translateY(-50%);
    padding: 0 8px;
    background: var(--bg);
    color: var(--magenta);
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }

  .corner { position: absolute; width: 12px; height: 12px; border: 1px solid var(--cyan); pointer-events: none; }
  .corner.tl { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  .log {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(0,240,255,0.35) transparent;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.35); }

  .line { white-space: pre-wrap; word-break: break-word; min-height: 1.5em; }
  .line .t { color: var(--dim); }
  .line .ok { color: var(--green); }
  .line .warn { color: var(--amber); }
  .line .err { color: #ff4d6d; }
  .line .c { color: var(--cyan); }
  .line .m { color: var(--magenta); }
  .line .cmd { color: #fff; }
  .line.ascii { color: var(--cyan); text-shadow: 0 0 8px rgba(0,240,255,0.5); line-height: 1.15; font-size: 12px; }
  .line table { border-collapse: collapse; margin: 4px 0; }
  .line td { padding: 1px 14px 1px 0; color: var(--text); }
  .line td:first-child { color: var(--dim); }
  .bar { display: inline-block; width: 160px; height: 8px; vertical-align: middle; border: 1px solid rgba(0,240,255,0.4); margin: 0 8px; position: relative; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--magenta)); box-shadow: 0 0 8px var(--cyan); }

  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.1em;
    background: var(--cyan);
    vertical-align: -0.2em;
    box-shadow: 0 0 8px var(--cyan);
    animation: caret 1s steps(1) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }

  .prompt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px 16px;
    border-top: 1px solid rgba(0,240,255,0.15);
  }
  .prompt .ps { color: var(--magenta); white-space: nowrap; text-shadow: 0 0 8px rgba(255,43,214,0.6); }
  .prompt input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: none;
    color: #fff;
    font: inherit;
    caret-color: var(--cyan);
    text-shadow: 0 0 6px rgba(0,240,255,0.5);
  }
  .prompt input::placeholder { color: var(--dim); }
  .prompt input:disabled { opacity: 0.4; }

  /* ---------- Side panel ---------- */
  .side-body {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 22px 16px 16px;
  }
  .side h2 { margin: 0; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }

  canvas#wire {
    width: 100%;
    height: 180px;
    display: block;
    border: 1px solid rgba(0,240,255,0.15);
    background:
      linear-gradient(rgba(0,240,255,0.06) 1px, transparent 1px) 0 0 / 100% 20px,
      linear-gradient(90deg, rgba(0,240,255,0.06) 1px, transparent 1px) 0 0 / 20px 100%;
  }

  .hex {
    flex: 1;
    min-height: 120px;
    overflow: hidden;
    font-size: 11px;
    line-height: 1.55;
    color: var(--dim);
    position: relative;
    mask-image: linear-gradient(180deg, #000 70%, transparent);
    -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent);
  }
  .hex div { white-space: pre; }
  .hex .addr { color: var(--magenta); }
  .hex .hot { color: var(--cyan); text-shadow: 0 0 6px rgba(0,240,255,0.6); }
  .hex .asc { color: var(--text); opacity: 0.6; }

  .gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gauge { border: 1px solid rgba(0,240,255,0.15); padding: 8px 10px; font-size: 11px; }
  .gauge span { display: block; color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; font-size: 9px; margin-bottom: 4px; }
  .gauge b { color: var(--cyan); font-weight: 500; font-size: 15px; }
  .gauge .meter { height: 3px; background: rgba(0,240,255,0.15); margin-top: 6px; }
  .gauge .meter i { display: block; height: 100%; background: var(--magenta); box-shadow: 0 0 6px var(--magenta); transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    body { overflow: auto; }
    .shell { height: auto; min-height: 100%; }
    main { grid-template-columns: minmax(0, 1fr); }
    .shell { grid-template-columns: minmax(0, 1fr); }
    .term { min-height: 60vh; min-width: 0; }
    .side { min-width: 0; }
    .log { overflow-x: hidden; }
    .line { overflow-wrap: anywhere; }
    .side { order: 2; }
    .status span:nth-child(2) { display: none; }
    .line.ascii { white-space: pre; overflow: hidden; font-size: 8px; }
  }
  @media (max-width: 480px) {
    .shell { padding: 10px; }
    header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .bar { width: 90px; }
  }
  @media (min-width: 1800px) {
    body { font-size: 16px; }
    .hex { font-size: 13px; }
    canvas#wire { height: 240px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .scanlines::after, .flicker, .gridfloor, .status .led { animation: none; }
    .title.glitch { animation: none; }
    .cursor { animation: none; }
  }
</style>
</head>
<body>

<div class="gridfloor" aria-hidden="true"></div>
<div class="flicker" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<div class="shell">
  <header>
    <div class="title" id="title">Kestrel<span class="slash">//</span>OS</div>
    <div class="status">
      <span><i class="led"></i>Link <b>Secure</b></span>
      <span>Node <b>ARC-7</b></span>
      <span>Clock <b id="clock">00:00:00</b></span>
    </div>
  </header>

  <main>
    <section class="term" data-label="Console" aria-label="Boot console">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="log" id="log" aria-live="polite"></div>
      <form class="prompt" id="promptForm" autocomplete="off">
        <label class="ps" for="cmd">operator@kestrel:~$</label>
        <input id="cmd" type="text" spellcheck="false" placeholder="booting…" disabled aria-label="Command input">
      </form>
    </section>

    <aside class="side" data-label="Telemetry" aria-label="Telemetry">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="side-body">
        <h2>Core assembly</h2>
        <canvas id="wire" aria-label="Rotating wireframe core"></canvas>
        <div class="gauges">
          <div class="gauge"><span>Core temp</span><b id="gTemp">41.2°</b><div class="meter"><i id="mTemp" style="width:40%"></i></div></div>
          <div class="gauge"><span>Flux</span><b id="gFlux">0.88</b><div class="meter"><i id="mFlux" style="width:88%"></i></div></div>
        </div>
        <h2>Memory · 0x7f3a</h2>
        <div class="hex" id="hex" aria-hidden="true"></div>
      </div>
    </aside>
  </main>
</div>

<script>
  (function () {
    'use strict';

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var log = document.getElementById('log');
    var input = document.getElementById('cmd');
    var form = document.getElementById('promptForm');
    var title = document.getElementById('title');

    /* ----- Utilities ----- */
    function stamp() {
      var d = new Date();
      var p = function (n) { return String(n).padStart(2, '0'); };
      return '[' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '.' + String(d.getMilliseconds()).padStart(3, '0') + ']';
    }
    function esc(s) { return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    function scroll() { log.scrollTop = log.scrollHeight; }

    function addLine(html, cls) {
      var d = document.createElement('div');
      d.className = 'line' + (cls ? ' ' + cls : '');
      d.innerHTML = html;
      log.appendChild(d);
      scroll();
      return d;
    }

    // Types text into a new line character by character, then resolves.
    function typeLine(text, opts) {
      opts = opts || {};
      return new Promise(function (resolve) {
        var d = addLine('');
        var caret = document.createElement('span');
        caret.className = 'cursor';
        var content = document.createElement('span');
        if (opts.stamp !== false) {
          var t = document.createElement('span'); t.className = 't'; t.textContent = stamp() + ' ';
          d.appendChild(t);
        }
        d.appendChild(content); d.appendChild(caret);
        var i = 0;
        var speed = reduce ? 0 : (opts.speed || 14);
        function step() {
          if (i < text.length) {
            var chunk = speed === 0 ? text.length : 1 + (Math.random() < 0.2 ? 1 : 0);
            content.textContent += text.substr(i, chunk); i += chunk;
            scroll();
            setTimeout(step, speed + Math.random() * speed);
          } else {
            if (opts.tail) { var s = document.createElement('span'); s.innerHTML = ' ' + opts.tail; d.appendChild(s); }
            caret.remove();
            resolve(d);
          }
        }
        step();
      });
    }

    function wait(ms) { return new Promise(function (r) { setTimeout(r, reduce ? 0 : ms); }); }

    function progress(label, ms) {
      return new Promise(function (resolve) {
        var d = addLine('<span class="t">' + stamp() + '</span> ' + esc(label) + ' <span class="bar"><i style="width:0%"></i></span><span class="pct">0%</span>');
        var bar = d.querySelector('.bar i'), pct = d.querySelector('.pct');
        var t0 = performance.now();
        function tick() {
          var k = Math.max(0, Math.min(1, (performance.now() - t0) / (reduce ? 1 : ms)));
          var e = k < 0.7 ? k * 0.9 : 0.63 + (k - 0.7) * 1.233;
          bar.style.width = (e * 100).toFixed(0) + '%';
          pct.textContent = (e * 100).toFixed(0) + '%';
          if (k < 1) requestAnimationFrame(tick); else { pct.innerHTML = '<span class="ok">done</span>'; resolve(); }
        }
        requestAnimationFrame(tick);
      });
    }

    /* ----- Boot sequence ----- */
    var OK = '<span class="ok">[ OK ]</span>';
    var WARN = '<span class="warn">[WARN]</span>';

    var banner = [
      ' _  _____ ____ _____ ____  _____ _',
      '| |/ / __/ ___|_   _|  _ \\| ____| |',
      '| \' /|  _|\\___ \\ | | | |_) |  _| | |',
      '| . \\| |___ __) || | |  _ <| |___| |___',
      '|_|\\_\\_____|___/ |_| |_| \\_\\_____|_____|  v9.4.1 "Nightjar"'
    ];

    async function boot() {
      addLine(esc(banner.join('\n')), 'ascii');
      await wait(300);
      await typeLine('KESTREL bootloader stage 2 · secure enclave handshake', { tail: OK });
      await typeLine('Verifying firmware signature (ed25519) ……', { tail: OK });
      await typeLine('Mounting /neural (rw, journaled, 12.4 TiB)', { tail: OK });
      await progress('Hydrating memory lattice', 1200);
      await typeLine('Calibrating optical bus — 4 lanes @ 64 Gb/s', { tail: OK });
      await typeLine('Coolant loop pressure 2.1 bar, nominal', { tail: OK });
      await typeLine('Uplink relay ARC-7 responding, latency 3 ms', { tail: OK });
      await typeLine('Thermal sensor #3 reporting stale data, using fallback', { tail: WARN });
      await progress('Loading operator profile', 700);
      await typeLine('Intrusion countermeasures armed · 0 active threats', { tail: OK });
      await wait(200);
      addLine('');
      addLine('<span class="c">Welcome, operator.</span> Type <span class="m">help</span> to list commands.');
      addLine('');
      input.disabled = false;
      input.placeholder = 'type a command';
      input.focus();
    }

    /* ----- Commands ----- */
    var history = [], hIndex = -1;

    var commands = {
      help: function () {
        addLine('<span class="c">Available commands</span>');
        addLine('<table><tr><td>help</td><td>list commands</td></tr>' +
          '<tr><td>status</td><td>subsystem health report</td></tr>' +
          '<tr><td>scan</td><td>sweep the local sector for signals</td></tr>' +
          '<tr><td>about</td><td>what this terminal is</td></tr>' +
          '<tr><td>clear</td><td>wipe the console</td></tr></table>');
      },
      status: function () {
        var rows = [
          ['core', 'online', 'ok'], ['optical bus', '4/4 lanes', 'ok'], ['coolant', '2.1 bar', 'ok'],
          ['thermal #3', 'fallback', 'warn'], ['uplink', 'ARC-7 · 3 ms', 'ok'], ['threats', '0 active', 'ok']
        ];
        var html = '<table>' + rows.map(function (r) {
          return '<tr><td>' + r[0] + '</td><td class="' + r[2] + '">' + r[1] + '</td></tr>';
        }).join('') + '</table>';
        addLine(html);
      },
      scan: async function () {
        await progress('Sweeping sector 7G', 900);
        var found = [
          ['0x2A41', 'beacon', 'civilian', -71],
          ['0x2A7F', 'drone swarm', 'unregistered', -58],
          ['0x2B03', 'encrypted burst', 'unknown', -44]
        ];
        for (var i = 0; i < found.length; i++) {
          var f = found[i];
          var cls = f[2] === 'unknown' ? 'm' : f[2] === 'unregistered' ? 'warn' : 'ok';
          await typeLine(f[0] + '  ' + f[1].padEnd(18) + f[3] + ' dBm  ', { tail: '<span class="' + cls + '">' + f[2] + '</span>', speed: 8 });
        }
        addLine('<span class="c">3 signals resolved.</span> One source refuses identification.');
        glitch();
      },
      about: function () {
        addLine('<span class="m">KESTREL//OS</span> is a fictional boot terminal built as a single HTML file.');
        addLine('No network calls, no libraries, no fonts loaded. Every glow is a text-shadow; every scanline is a gradient.');
        addLine('The wireframe to the right is drawn on a canvas; the hex dump is generated locally and means nothing at all.');
      },
      clear: function () { log.innerHTML = ''; }
    };

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var raw = input.value.trim();
      if (!raw) return;
      history.unshift(raw); hIndex = -1;
      addLine('<span class="m">operator@kestrel:~$</span> <span class="cmd">' + esc(raw) + '</span>');
      input.value = '';
      var name = raw.split(/\s+/)[0].toLowerCase();
      if (commands[name]) {
        input.disabled = true;
        await commands[name]();
        input.disabled = false;
        input.focus();
      } else {
        addLine('<span class="err">unknown command:</span> ' + esc(name) + ' — try <span class="m">help</span>');
      }
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowUp') { if (hIndex < history.length - 1) { hIndex++; input.value = history[hIndex]; } e.preventDefault(); }
      if (e.key === 'ArrowDown') { if (hIndex > 0) { hIndex--; input.value = history[hIndex]; } else { hIndex = -1; input.value = ''; } e.preventDefault(); }
    });

    document.querySelector('.term').addEventListener('click', function () { if (!input.disabled) input.focus(); });

    /* ----- Header glitch ----- */
    function glitch() {
      if (reduce) return;
      title.classList.remove('glitch');
      void title.offsetWidth;
      title.classList.add('glitch');
    }
    function scheduleGlitch() {
      setTimeout(function () { glitch(); scheduleGlitch(); }, 2500 + Math.random() * 6000);
    }
    scheduleGlitch();

    /* ----- Clock ----- */
    var clockEl = document.getElementById('clock');
    function tickClock() {
      var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
      clockEl.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }
    tickClock(); setInterval(tickClock, 1000);

    /* ----- Hex dump ----- */
    var hex = document.getElementById('hex');
    var ROWS = 14;
    var addr = 0x7f3a0000;
    var hexRows = [];
    function hexRow(a) {
      var bytes = [], asc = '';
      for (var i = 0; i < 8; i++) {
        var b = (Math.random() * 256) | 0;
        var hot = Math.random() < 0.12;
        bytes.push((hot ? '<span class="hot">' : '') + b.toString(16).padStart(2, '0') + (hot ? '</span>' : ''));
        asc += (b > 32 && b < 127) ? String.fromCharCode(b) : '.';
      }
      return '<span class="addr">' + a.toString(16) + '</span>  ' + bytes.join(' ') + '  <span class="asc">' + esc(asc) + '</span>';
    }
    for (var r = 0; r < ROWS; r++) { var d = document.createElement('div'); d.innerHTML = hexRow(addr); addr += 8; hex.appendChild(d); hexRows.push(d); }
    setInterval(function () {
      var row = hexRows.shift();
      row.innerHTML = hexRow(addr); addr += 8;
      hex.appendChild(row); hexRows.push(row);
    }, reduce ? 1500 : 220);

    /* ----- Gauges ----- */
    var gTemp = document.getElementById('gTemp'), mTemp = document.getElementById('mTemp');
    var gFlux = document.getElementById('gFlux'), mFlux = document.getElementById('mFlux');
    setInterval(function () {
      var t = 39 + Math.random() * 6, f = 0.8 + Math.random() * 0.19;
      gTemp.textContent = t.toFixed(1) + '°'; mTemp.style.width = ((t - 30) / 30 * 100) + '%';
      gFlux.textContent = f.toFixed(2); mFlux.style.width = (f * 100) + '%';
    }, 1400);

    /* ----- Wireframe canvas ----- */
    var canvas = document.getElementById('wire');
    var ctx = canvas.getContext('2d');
    var W = 0, H = 0, dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 3);
      var r = canvas.getBoundingClientRect();
      W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // Icosahedron vertices and edges.
    var PHI = (1 + Math.sqrt(5)) / 2;
    var V = [
      [-1, PHI, 0], [1, PHI, 0], [-1, -PHI, 0], [1, -PHI, 0],
      [0, -1, PHI], [0, 1, PHI], [0, -1, -PHI], [0, 1, -PHI],
      [PHI, 0, -1], [PHI, 0, 1], [-PHI, 0, -1], [-PHI, 0, 1]
    ];
    var E = [];
    for (var i = 0; i < V.length; i++) for (var j = i + 1; j < V.length; j++) {
      var dx = V[i][0] - V[j][0], dy = V[i][1] - V[j][1], dz = V[i][2] - V[j][2];
      if (Math.abs(Math.sqrt(dx * dx + dy * dy + dz * dz) - 2) < 0.01) E.push([i, j]);
    }

    function rot(p, ax, ay) {
      var x = p[0], y = p[1], z = p[2];
      var cy = Math.cos(ay), sy = Math.sin(ay);
      var x1 = x * cy - z * sy, z1 = x * sy + z * cy;
      var cx = Math.cos(ax), sx = Math.sin(ax);
      var y2 = y * cx - z1 * sx, z2 = y * sx + z1 * cx;
      return [x1, y2, z2];
    }

    var t0 = performance.now();
    function draw(now) {
      var t = (now - t0) / 1000;
      ctx.clearRect(0, 0, W, H);
      var cx = W / 2, cy = H / 2, scale = Math.min(W, H) * 0.24;
      var ax = reduce ? 0.5 : t * 0.5, ay = reduce ? 0.8 : t * 0.8;
      var proj = V.map(function (p) {
        var q = rot(p, ax, ay);
        var persp = 3.2 / (3.2 + q[2]);
        return [cx + q[0] * scale * persp, cy + q[1] * scale * persp, q[2]];
      });

      // Outer ring
      ctx.strokeStyle = 'rgba(255,43,214,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, scale * 1.55, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([4, 10]);
      ctx.beginPath(); ctx.arc(cx, cy, scale * 1.75, -t * 0.4, -t * 0.4 + Math.PI * 1.4); ctx.stroke();
      ctx.setLineDash([]);

      // Edges, depth-shaded
      for (var k = 0; k < E.length; k++) {
        var a = proj[E[k][0]], b = proj[E[k][1]];
        var depth = (a[2] + b[2]) / 2 / PHI;
        var alpha = 0.35 + 0.55 * (1 - (depth + 1) / 2);
        ctx.strokeStyle = 'rgba(0,240,255,' + alpha.toFixed(3) + ')';
        ctx.lineWidth = depth < 0 ? 1.4 : 0.7;
        ctx.shadowColor = 'rgba(0,240,255,0.8)';
        ctx.shadowBlur = depth < 0 ? 8 : 0;
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
      ctx.shadowBlur = 0;

      // Vertices
      for (var v = 0; v < proj.length; v++) {
        var p = proj[v];
        ctx.fillStyle = p[2] < 0 ? '#ff2bd6' : 'rgba(255,43,214,0.4)';
        ctx.beginPath(); ctx.arc(p[0], p[1], p[2] < 0 ? 2.4 : 1.4, 0, Math.PI * 2); ctx.fill();
      }

      // Corner readout
      ctx.fillStyle = 'rgba(107,115,144,0.9)';
      ctx.font = '10px ' + getComputedStyle(document.body).fontFamily;
      ctx.fillText('ICO-12 · ' + (ay % (Math.PI * 2) * 57.2958).toFixed(0).padStart(3, '0') + '°', 8, H - 8);

      if (!reduce) requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    boot();
  })();
</script>
</body>
</html>
