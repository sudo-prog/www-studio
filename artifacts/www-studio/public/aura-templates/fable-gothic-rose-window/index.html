<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosace du Nord — A Gothic Rose Window</title>
<style>
  :root{
    --stone:#2b2521; --stone-hi:#6f6257; --stone-lo:#14100e;
    --nave:#0b0908; --nave-2:#1a1410;
    --light:#ffe9b8; --tint:#fff2cf; --ink:#e9dcc5; --muted:#a5937a;
    --sun-a:#fff6dc; --sun-b:#ffd47a;
  }
  body[data-season="winter"]{ --light:#dfe9ff; --tint:#e5ecff; --sun-a:#ffffff; --sun-b:#c9d8ff; }
  body[data-season="summer"]{ --light:#ffe9b8; --tint:#fff2cf; --sun-a:#fff6dc; --sun-b:#ffd47a; }
  body[data-season="evening"]{ --light:#ffb56b; --tint:#ffc48a; --sun-a:#ffd9a6; --sun-b:#ff8a3c; }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    min-height:100vh; overflow-x:hidden; color:var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, ui-serif, serif;
    background:
      radial-gradient(ellipse 80% 60% at 50% 30%, var(--nave-2), transparent 70%),
      linear-gradient(#070605, var(--nave) 40%, #050403);
    transition: background 1.2s ease;
  }
  /* ashlar stone texture on the nave wall */
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
    background:
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(255,255,255,.045) 46px 48px),
      repeating-linear-gradient(90deg, transparent 0 118px, rgba(255,255,255,.04) 118px 120px),
      repeating-linear-gradient(90deg, transparent 0 59px, rgba(0,0,0,.25) 59px 60px);
    background-position: 0 0, 0 0, 60px 24px;
    mask-image: linear-gradient(#000 0 40%, transparent 95%);
    -webkit-mask-image: linear-gradient(#000 0 40%, transparent 95%);
  }
  #motes{ position:fixed; inset:0; z-index:1; pointer-events:none; }

  header{
    position:relative; z-index:3; display:flex; justify-content:space-between; align-items:flex-start;
    gap:1rem; padding: clamp(14px,2.5vw,28px) clamp(16px,3vw,40px) 0;
  }
  h1{ margin:0; font-weight:400; font-size: clamp(1.15rem, 2.3vw, 1.8rem); letter-spacing:.08em; text-transform:uppercase; }
  h1 small{ display:block; font-size:.62em; letter-spacing:.22em; color:var(--muted); margin-top:.35em; font-style:italic; text-transform:none; }
  .seasons{ display:flex; gap:6px; border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:4px; background:rgba(0,0,0,.35); backdrop-filter: blur(6px); }
  .seasons button{
    font: inherit; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
    background:transparent; border:0; border-radius:999px; padding:.5em 1em; cursor:pointer; transition: color .3s, background .3s, box-shadow .3s;
  }
  .seasons button:hover{ color:var(--ink); }
  .seasons button[aria-pressed="true"]{ color:#1a130c; background:var(--light); box-shadow:0 0 18px color-mix(in srgb, var(--light) 60%, transparent); }

  main{ position:relative; z-index:2; display:grid; place-items:center; padding: 0 12px 40px; }
  .window-wrap{ width:min(94vw, 82vh, 1100px); position:relative; }
  svg.rose{ width:100%; height:auto; display:block; overflow:visible; }

  .pane{ cursor:pointer; transition: filter .35s ease, opacity .35s ease; }
  .pane:hover, .pane.active{ filter: brightness(1.55) saturate(1.2) drop-shadow(0 0 10px rgba(255,255,255,.85)); }
  .glass-layer{ filter:url(#glass); }

  .tip{
    position:fixed; z-index:10; pointer-events:none; opacity:0; transform: translate(-50%, -130%) scale(.96);
    transition: opacity .25s ease, transform .25s ease; left:0; top:0;
    padding:.6em 1em; border-radius:6px; background:rgba(12,9,7,.92); border:1px solid rgba(255,220,160,.35);
    color:var(--ink); font-size:.9rem; letter-spacing:.03em; white-space:nowrap; max-width:80vw;
    box-shadow:0 10px 30px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.5);
  }
  .tip::after{ content:""; position:absolute; left:50%; bottom:-6px; width:10px; height:10px; transform:translateX(-50%) rotate(45deg); background:inherit; border-right:1px solid rgba(255,220,160,.35); border-bottom:1px solid rgba(255,220,160,.35); }
  .tip.show{ opacity:1; transform: translate(-50%, -140%) scale(1); }
  .tip em{ display:block; font-style:italic; color:var(--muted); font-size:.82em; margin-top:.2em; }

  .caption{ text-align:center; margin:14px auto 0; max-width:60ch; color:var(--muted); font-style:italic; font-size:clamp(.85rem,1.4vw,1rem); line-height:1.55; min-height:2.6em; }
  .caption strong{ color:var(--ink); font-style:normal; font-weight:400; letter-spacing:.06em; }
  footer{ position:relative; z-index:2; text-align:center; color:#6a5c4c; font-size:.75rem; letter-spacing:.18em; text-transform:uppercase; padding:0 16px 28px; }

  @media (max-width:640px){
    header{ flex-direction:column; align-items:center; text-align:center; }
    .seasons button{ padding:.45em .7em; font-size:.7rem; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body data-season="summer">
<canvas id="motes" aria-hidden="true"></canvas>

<header>
  <h1>Rosace du Nord <small>A twelve-fold rose window, the sun passing behind</small></h1>
  <div class="seasons" role="group" aria-label="Season of daylight">
    <button type="button" data-season="winter" aria-pressed="false">Winter</button>
    <button type="button" data-season="summer" aria-pressed="true">Summer</button>
    <button type="button" data-season="evening" aria-pressed="false">Evening</button>
  </div>
</header>

<main>
  <div class="window-wrap">
    <svg class="rose" viewBox="-400 -320 800 820" role="img" aria-labelledby="roseTitle roseDesc">
      <title id="roseTitle">Gothic rose window with twelve lancets and stained glass panes</title>
      <desc id="roseDesc">A circular stone-traceried window whose jewel-coloured panes brighten as the sun passes behind; coloured light pools on the floor below.</desc>
      <defs>
        <!-- jewel glass -->
        <radialGradient id="g0" cx="40%" cy="35%" r="80%"><stop offset="0" stop-color="#ff5d70"/><stop offset=".55" stop-color="#b3142a"/><stop offset="1" stop-color="#5a0812"/></radialGradient>
        <radialGradient id="g1" cx="40%" cy="35%" r="80%"><stop offset="0" stop-color="#6f95ff"/><stop offset=".55" stop-color="#1f3fb8"/><stop offset="1" stop-color="#0a1656"/></radialGradient>
        <radialGradient id="g2" cx="40%" cy="35%" r="80%"><stop offset="0" stop-color="#63e39a"/><stop offset=".55" stop-color="#128a4d"/><stop offset="1" stop-color="#053c22"/></radialGradient>
        <radialGradient id="g3" cx="40%" cy="35%" r="80%"><stop offset="0" stop-color="#ffd27a"/><stop offset=".55" stop-color="#e08a12"/><stop offset="1" stop-color="#6b3a02"/></radialGradient>
        <radialGradient id="g4" cx="40%" cy="35%" r="80%"><stop offset="0" stop-color="#d59bff"/><stop offset=".55" stop-color="#7a2fb4"/><stop offset="1" stop-color="#32104f"/></radialGradient>
        <radialGradient id="g5" cx="40%" cy="35%" r="80%"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#e8b93a"/><stop offset="1" stop-color="#7a5a0a"/></radialGradient>
        <radialGradient id="g6" cx="45%" cy="40%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#ffe9a8"/><stop offset="1" stop-color="#c9932a"/></radialGradient>

        <!-- sun behind the window -->
        <radialGradient id="sunGrad" gradientUnits="userSpaceOnUse" cx="0" cy="-200" r="300">
          <stop offset="0" stop-color="#fff6dc" stop-opacity=".95"/>
          <stop offset=".45" stop-color="#ffd47a" stop-opacity=".35"/>
          <stop offset="1" stop-color="#000" stop-opacity="0"/>
        </radialGradient>

        <!-- stone -->
        <pattern id="stone" width="60" height="30" patternUnits="userSpaceOnUse">
          <rect width="60" height="30" fill="#2e2824"/>
          <path d="M0 0H60M0 15H60M30 0V15M0 15V30M60 15V30" stroke="#1a1512" stroke-width="1.2"/>
          <path d="M0 1H60M0 16H60" stroke="#463c35" stroke-width=".6" opacity=".7"/>
        </pattern>

        <!-- glass texture: turbulence displacement + mottled highlight -->
        <filter id="glass" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="11" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" result="disp"/>
          <feColorMatrix in="noise" type="matrix" values="0 0 0 0 .7  0 0 0 0 .7  0 0 0 0 .6  0 0 0 .45 0" result="mottle"/>
          <feComposite in="mottle" in2="disp" operator="in" result="mottleIn"/>
          <feBlend in="disp" in2="mottleIn" mode="screen"/>
        </filter>
        <filter id="pool" x="-30%" y="-60%" width="160%" height="220%">
          <feGaussianBlur stdDeviation="9"/>
        </filter>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".8"/>
        </filter>

        <clipPath id="windowClip"><circle r="272"/></clipPath>

        <!-- one bevelled stone spoke, reused 12 times -->
        <symbol id="spoke" overflow="visible">
          <line x1="0" y1="-58" x2="0" y2="-286" stroke="#181310" stroke-width="9" stroke-linecap="round"/>
          <line x1="0" y1="-58" x2="0" y2="-286" stroke="#4a4038" stroke-width="5" stroke-linecap="round"/>
          <line x1="-1.2" y1="-60" x2="-1.2" y2="-284" stroke="#7a6c60" stroke-width="1.2" stroke-linecap="round"/>
        </symbol>
        <symbol id="spokeShort" overflow="visible">
          <line x1="0" y1="-236" x2="0" y2="-286" stroke="#181310" stroke-width="7" stroke-linecap="round"/>
          <line x1="0" y1="-236" x2="0" y2="-286" stroke="#4a4038" stroke-width="4" stroke-linecap="round"/>
          <line x1="-1" y1="-238" x2="-1" y2="-284" stroke="#7a6c60" stroke-width="1" stroke-linecap="round"/>
        </symbol>
      </defs>

      <!-- floor light pools: a blurred, skewed, squashed copy of the glass -->
      <g id="floorPools" opacity=".55" style="mix-blend-mode:screen">
        <g id="poolXform" transform="translate(-40,470) skewX(-28) scale(1,.34)">
          <g filter="url(#pool)"><use href="#glassLayer"/></g>
        </g>
      </g>
      <!-- floor flagstones (faint) -->
      <g opacity=".25" transform="translate(0,300)">
        <path d="M-400 200 L400 200" stroke="#3b332d" stroke-width="1"/>
        <path d="M-400 160 L400 160" stroke="#3b332d" stroke-width=".7"/>
        <path d="M-400 120 L400 120" stroke="#3b332d" stroke-width=".5"/>
      </g>

      <!-- window -->
      <g id="window" filter="url(#softShadow)">
        <circle r="300" fill="url(#stone)"/>
        <circle r="300" fill="none" stroke="#12100d" stroke-width="10"/>
        <circle r="290" fill="none" stroke="#6b5e53" stroke-width="1.4" opacity=".7"/>
        <circle r="272" fill="#05040a"/>

        <g clip-path="url(#windowClip)">
          <g id="glassLayer" class="glass-layer"></g>
          <!-- daylight tint & travelling sun -->
          <rect id="tint" x="-300" y="-300" width="600" height="600" fill="#fff2cf" opacity=".22" style="mix-blend-mode:multiply"/>
          <circle id="sun" r="290" fill="url(#sunGrad)" style="mix-blend-mode:screen"/>
        </g>

        <!-- tracery: rings and spokes -->
        <g id="tracery">
          <g id="spokes"></g>
          <circle r="234" fill="none" stroke="#181310" stroke-width="8"/>
          <circle r="234" fill="none" stroke="#4a4038" stroke-width="4"/>
          <circle r="235.5" fill="none" stroke="#7a6c60" stroke-width="1"/>
          <circle r="136" fill="none" stroke="#181310" stroke-width="8"/>
          <circle r="136" fill="none" stroke="#4a4038" stroke-width="4"/>
          <circle r="137.5" fill="none" stroke="#7a6c60" stroke-width="1"/>
          <circle r="60" fill="none" stroke="#181310" stroke-width="8"/>
          <circle r="60" fill="none" stroke="#4a4038" stroke-width="4"/>
          <circle r="61.5" fill="none" stroke="#7a6c60" stroke-width="1"/>
          <circle r="272" fill="none" stroke="#181310" stroke-width="10"/>
          <circle r="272" fill="none" stroke="#4a4038" stroke-width="5"/>
          <circle r="274" fill="none" stroke="#8a7b6e" stroke-width="1.2"/>
        </g>
      </g>
    </svg>
  </div>
  <p class="caption" id="caption" aria-live="polite"><strong>Hover a pane</strong> — each holds a saint, a labour of the month, or a day of creation.</p>
</main>
<footer>Handmade in inline SVG · twelve-fold symmetry · no fonts, no images, no network</footer>

<div class="tip" id="tip" role="status"></div>

<script>
(function(){
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const glass = document.getElementById('glassLayer');
  const spokes = document.getElementById('spokes');
  const tip = document.getElementById('tip');
  const caption = document.getElementById('caption');
  const f = n => (+n).toFixed(2);

  const polar = (r, a) => { const t = (a - 90) * Math.PI / 180; return [r * Math.cos(t), r * Math.sin(t)]; };
  function sector(r1, r2, a1, a2, pointed){
    const [x1,y1] = polar(r1,a1), [x2,y2] = polar(r1,a2);
    if(!pointed){
      const [x3,y3] = polar(r2,a2), [x4,y4] = polar(r2,a1);
      return `M${f(x1)} ${f(y1)} A${r1} ${r1} 0 0 1 ${f(x2)} ${f(y2)} L${f(x3)} ${f(y3)} A${r2} ${r2} 0 0 0 ${f(x4)} ${f(y4)} Z`;
    }
    const rs = r2 - (r2 - r1) * 0.32, mid = (a1 + a2) / 2, span = a2 - a1;
    const [s2x,s2y] = polar(rs,a2), [s1x,s1y] = polar(rs,a1), [ax,ay] = polar(r2,mid);
    const [c2x,c2y] = polar(r2 - 2, a2 - span * .18), [c1x,c1y] = polar(r2 - 2, a1 + span * .18);
    return `M${f(x1)} ${f(y1)} A${r1} ${r1} 0 0 1 ${f(x2)} ${f(y2)} L${f(s2x)} ${f(s2y)} Q${f(c2x)} ${f(c2y)} ${f(ax)} ${f(ay)} Q${f(c1x)} ${f(c1y)} ${f(s1x)} ${f(s1y)} Z`;
  }

  const saints = [
    ['St. Cecilia', 'patroness of music, her organ pipes drawn in gold leaf'],
    ['The Annunciation', 'a lily, a dove, and the word made visible'],
    ['St. George', 'the lance, the lizard-dragon, the rescued princess'],
    ['The Nativity', 'ox and ass keep watch beneath a single star'],
    ['St. Catherine', 'the broken wheel that would not break her'],
    ['The Flight into Egypt', 'a donkey, a road, a night without lodging'],
    ['St. Francis', 'preaching to the birds that would not fly away'],
    ['The Wedding at Cana', 'six stone jars, the wine that came late and best'],
    ['St. Michael', 'weigher of souls, with the scales held level'],
    ['The Calming of the Storm', 'a boat, twelve frightened men, one word'],
    ['St. Lucia', 'bearer of light, a candle-crown in December'],
    ['The Prodigal\'s Return', 'the fatted calf and the ring restored']
  ];
  const labours = [
    ['January', 'warming by the hearth, two-faced Janus at the door'],
    ['February', 'pruning the vines in a grey wind'],
    ['March', 'digging the first furrow'],
    ['April', 'blossom on the bough, a girl with a garland'],
    ['May', 'riding out with a hawk on the wrist'],
    ['June', 'haymaking, scythes flashing'],
    ['July', 'reaping the wheat under a white sun'],
    ['August', 'threshing on the barn floor'],
    ['September', 'treading grapes, purple to the knee'],
    ['October', 'sowing the winter corn'],
    ['November', 'knocking acorns down for the swine'],
    ['December', 'the feast, the boar\'s head, the wassail cup']
  ];
  const creation = [
    ['First Day', 'let there be light'],
    ['Second Day', 'the firmament divided from the waters'],
    ['Third Day', 'dry land, and the green things'],
    ['Fourth Day', 'sun, moon, and the lesser lights'],
    ['Fifth Day', 'fish in the deep, birds in the air'],
    ['Sixth Day', 'the beasts, and then ourselves']
  ];
  const border = [['Fleur-de-lis', 'a border motif, repeated four-and-twenty times'], ['Vine leaf', 'a border motif, the tendrils of the true vine']];

  function pane(d, grad, label, story){
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d); p.setAttribute('fill', `url(#${grad})`);
    p.setAttribute('stroke', '#0a0810'); p.setAttribute('stroke-width', '1.2');
    p.setAttribute('class', 'pane'); p.setAttribute('tabindex', '0');
    p.dataset.label = label; p.dataset.story = story;
    glass.appendChild(p);
  }

  // ring A: 24 border panes
  for(let i = 0; i < 24; i++){
    const a = i * 15; const grad = i % 2 ? 'g5' : 'g1';
    const [l, s] = border[i % 2];
    pane(sector(240, 266, a - 6.2, a + 6.2, false), grad, l, s);
  }
  // ring B: 12 lancets
  const seq = ['g0','g1','g2','g3','g4','g1','g0','g2','g4','g3','g1','g0'];
  for(let i = 0; i < 12; i++){
    const a = i * 30; const [l, s] = saints[i];
    pane(sector(142, 229, a - 12.8, a + 12.8, true), seq[i], l, s);
  }
  // ring C: 12 panes, offset 15°
  const seqC = ['g3','g4','g0','g2','g1','g3','g4','g0','g2','g1','g3','g4'];
  for(let i = 0; i < 12; i++){
    const a = i * 30 + 15; const [l, s] = labours[i];
    pane(sector(66, 130, a - 12.6, a + 12.6, true), seqC[i], l, s);
  }
  // centre rosette: six petals + core
  for(let i = 0; i < 6; i++){
    const a = i * 60; const [cx, cy] = polar(34, a);
    const e = document.createElementNS(NS, 'ellipse');
    e.setAttribute('cx', f(cx)); e.setAttribute('cy', f(cy)); e.setAttribute('rx', '11'); e.setAttribute('ry', '19');
    e.setAttribute('transform', `rotate(${a} ${f(cx)} ${f(cy)})`);
    e.setAttribute('fill', `url(#${['g0','g3','g1','g2','g4','g0'][i]})`);
    e.setAttribute('stroke', '#0a0810'); e.setAttribute('stroke-width', '1.2');
    e.setAttribute('class', 'pane'); e.setAttribute('tabindex', '0');
    e.dataset.label = creation[i][0]; e.dataset.story = creation[i][1];
    glass.appendChild(e);
  }
  const core = document.createElementNS(NS, 'circle');
  core.setAttribute('r', '14'); core.setAttribute('fill', 'url(#g6)'); core.setAttribute('stroke', '#0a0810'); core.setAttribute('stroke-width', '1.2');
  core.setAttribute('class', 'pane'); core.setAttribute('tabindex', '0');
  core.dataset.label = 'The Mystic Rose'; core.dataset.story = 'the heart of the window, white gold, always lit';
  glass.appendChild(core);

  // tracery spokes via <use>, 12-fold + 24-fold outer
  for(let i = 0; i < 12; i++){
    const u = document.createElementNS(NS, 'use');
    u.setAttribute('href', '#spoke'); u.setAttribute('transform', `rotate(${i * 30})`);
    spokes.appendChild(u);
    const v = document.createElementNS(NS, 'use');
    v.setAttribute('href', '#spokeShort'); v.setAttribute('transform', `rotate(${i * 30 + 15})`);
    spokes.appendChild(v);
  }

  // hover / focus labels
  let active = null;
  function show(el, x, y){
    if(active && active !== el) active.classList.remove('active');
    active = el; el.classList.add('active');
    tip.innerHTML = `${el.dataset.label}<em>${el.dataset.story}</em>`;
    tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.classList.add('show');
    caption.innerHTML = `<strong>${el.dataset.label}</strong> — ${el.dataset.story}.`;
  }
  function hide(){ tip.classList.remove('show'); if(active){ active.classList.remove('active'); active = null; } }
  glass.addEventListener('pointermove', e => { const t = e.target.closest('.pane'); if(t) show(t, e.clientX, e.clientY); });
  glass.addEventListener('pointerleave', hide);
  glass.addEventListener('focusin', e => { const t = e.target.closest('.pane'); if(!t) return; const b = t.getBoundingClientRect(); show(t, b.left + b.width / 2, b.top); });
  glass.addEventListener('focusout', hide);

  // seasons
  const sunStops = document.querySelectorAll('#sunGrad stop');
  const tintRect = document.getElementById('tint');
  const seasons = {
    winter:  { a:'#ffffff', b:'#c9d8ff', tint:'#e5ecff', tintOp:.18, sunOp:.8,  light:[223,233,255] },
    summer:  { a:'#fff6dc', b:'#ffd47a', tint:'#fff2cf', tintOp:.22, sunOp:1,   light:[255,233,184] },
    evening: { a:'#ffd9a6', b:'#ff8a3c', tint:'#ffc48a', tintOp:.32, sunOp:.9,  light:[255,181,107] }
  };
  let season = seasons.summer;
  function setSeason(name){
    season = seasons[name];
    document.body.dataset.season = name;
    sunStops[0].setAttribute('stop-color', season.a);
    sunStops[1].setAttribute('stop-color', season.b);
    sunStops[0].setAttribute('stop-opacity', .95 * season.sunOp);
    tintRect.setAttribute('fill', season.tint); tintRect.setAttribute('opacity', season.tintOp);
    document.querySelectorAll('.seasons button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.season === name)));
  }
  document.querySelector('.seasons').addEventListener('click', e => { const b = e.target.closest('button'); if(b) setSeason(b.dataset.season); });

  // travelling sun
  const sunGrad = document.getElementById('sunGrad');
  const poolXform = document.getElementById('poolXform');
  const CYCLE = 90000;
  let sunX = 0;
  function moveSun(t){
    const u = ((t % CYCLE) / CYCLE);
    const x = -420 + 840 * u;
    const y = 120 - 420 * Math.sin(Math.PI * u);
    sunX = x;
    sunGrad.setAttribute('cx', f(x)); sunGrad.setAttribute('cy', f(y));
    const skew = -28 + (x / 420) * 18;
    poolXform.setAttribute('transform', `translate(${f(-40 - x * .18)},470) skewX(${f(skew)}) scale(1,.34)`);
  }
  moveSun(CYCLE * .3);

  // dust motes in the light beams
  const cv = document.getElementById('motes'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, motes = [];
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(160, Math.round(W * H / 9000));
    motes = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: .6 + Math.random() * 1.6,
      vx: (Math.random() - .5) * .12, vy: .05 + Math.random() * .14, ph: Math.random() * Math.PI * 2, a: .2 + Math.random() * .6
    }));
  }
  function drawMotes(t){
    ctx.clearRect(0, 0, W, H);
    const [lr, lg, lb] = season.light;
    const beamCx = W / 2 - sunX * (W / 800) * .35; // beams lean away from the sun
    for(const m of motes){
      m.x += m.vx + Math.sin(t / 1400 + m.ph) * .12; m.y += m.vy;
      if(m.y > H + 4){ m.y = -4; m.x = Math.random() * W; }
      if(m.x < -4) m.x = W + 4; if(m.x > W + 4) m.x = -4;
      const dx = Math.abs(m.x - beamCx) / (W * .28 + m.y * .25);
      const inBeam = Math.max(0, 1 - dx);
      const tw = .55 + .45 * Math.sin(t / 900 + m.ph * 3);
      const alpha = m.a * tw * (0.15 + .85 * inBeam) * Math.min(1, m.y / (H * .25) + .2);
      ctx.fillStyle = `rgba(${lr},${lg},${lb},${alpha.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  window.addEventListener('resize', resize); resize();

  let last = 0;
  function frame(t){
    if(!reduce){ moveSun(t); }
    if(t - last > 16){ drawMotes(reduce ? 0 : t); last = t; }
    if(!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if(reduce){ drawMotes(0); }
})();
</script>
</body>
</html>
