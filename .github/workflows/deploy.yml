name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  # ── BUILD ONCE ───────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build www-studio
        run: pnpm --filter @workspace/www-studio run build
        env:
          NODE_ENV: "production"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: www-studio-dist
          path: artifacts/www-studio/dist/public
          retention-days: 1

  # ── DEPLOY (uses shared artifact) ────────────────────────────
  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: www-studio-dist
          path: artifacts/www-studio/dist/public

      - name: Deploy to Vercel (prod + www-studio-red alias)
        run: |
          # Deploy to www-studio project with production flag
          DEPLOY_URL=$(npx vercel@latest --prod \
            --project=www-studio \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes 2>&1 | tee /tmp/deploy.log | grep -oE 'https://[a-z0-9-]+-[a-z0-9]+\.vercel\.app' | head -1)
          echo "Deployed to: $DEPLOY_URL"
          # Get the deployment ID from the URL via Vercel API
          DEPLOY_ID=$(curl -s \
            "https://api.vercel.com/v13/deployments?url=${DEPLOY_URL#https://}&limit=1" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('deployments',[{}])[0].get('uid',''))")
          echo "Deployment ID: $DEPLOY_ID"
          # Set www-studio-red alias
          if [ -n "$DEPLOY_ID" ]; then
            curl -s -X POST \
              "https://api.vercel.com/v13/deployments/${DEPLOY_ID}/aliases" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"alias":"www-studio-red.vercel.app"}' | tee /tmp/alias.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('Alias result:', d.get('alias') or d.get('error',{}).get('message','unknown'))"
          else
            echo "ERROR: no deployment ID extracted"
            cat /tmp/deploy.log
            exit 1
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-preview:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: www-studio-dist
          path: artifacts/www-studio/dist/public

      - name: Deploy to Vercel (preview)
        run: npx vercel@latest -t ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── SMOKE TEST (uses shared artifact) ────────────────────────
  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: www-studio-dist
          path: artifacts/www-studio/dist/public

      - uses: pnpm/action-setup@v4
        with:
          version: 4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps for e2e
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter @workspace/www-studio exec playwright install --with-deps chromium 2>&1 | tail -5

      - name: Start preview server
        run: |
          python3 -m http.server 4173 --directory artifacts/www-studio/dist/public &
          echo $! > /tmp/server.pid
        env:
          PORT: "4173"

      - name: Wait for server
        run: npx wait-on http://localhost:4173 --timeout 60000

      - name: Run mobile smoke test (390x844)
        run: pnpm --filter @workspace/www-studio exec playwright test e2e/mobile-shots.ts --project=chromium 2>&1 || true
        env:
          BASE: http://localhost:4173

      - name: Upload screenshots (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-shots
          path: e2e/mobile-shots/
          retention-days: 7
